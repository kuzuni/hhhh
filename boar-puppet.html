<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>뚱멧돼지 「투기」 — 컷아웃 퍼펫 리깅</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#141a12;overflow:hidden;
    font-family:"Segoe UI","Malgun Gothic",sans-serif;}
  #cv{display:block;}
  #err{position:fixed;top:4px;left:4px;z-index:99;color:#ff5252;font:12px/1.4 Consolas,monospace;
    white-space:pre-wrap;max-width:92vw;pointer-events:none;text-shadow:0 1px 2px #000;}
  #back{position:fixed;top:10px;left:12px;z-index:30;color:#f0f8e2;text-decoration:none;font-size:13px;
    background:rgba(18,28,14,.6);padding:5px 11px;border-radius:14px;}
  #back:hover{background:rgba(18,28,14,.9)}
  #hud{position:fixed;top:9px;left:0;right:0;text-align:center;z-index:10;pointer-events:none}
  #hud h1{margin:0;font-size:19px;color:#f6fce9;font-weight:600;text-shadow:0 2px 6px rgba(0,0,0,.45)}
  #hud .sub{font-size:12px;color:#dcedc6;margin-top:2px;text-shadow:0 1px 3px rgba(0,0,0,.4)}
  #panel{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:20;display:flex;gap:6px;
    align-items:center;flex-wrap:wrap;justify-content:center;background:rgba(13,20,10,.8);
    border:1px solid rgba(255,255,255,.13);border-radius:14px;padding:8px 12px;max-width:96vw}
  #panel button{font-family:inherit;font-size:13px;color:#eaf5da;background:#2c3c22;border:1px solid #4d613b;
    border-radius:9px;padding:6px 12px;cursor:pointer}
  #panel button:hover{background:#3a5229}
  #panel button.on{background:#8cc63f;color:#13210b;border-color:#b8e878;font-weight:700}
  #panel button:disabled{opacity:.4;cursor:default}
  #panel .sep{width:1px;height:22px;background:rgba(255,255,255,.18);margin:0 4px}
  #panel label{color:#d3e4bb;font-size:12px;display:flex;align-items:center;gap:5px;cursor:pointer}
  #panel input[type=range]{width:92px}
</style>
</head>
<body>
<div id="err"></div>
<a id="back" href="heroes.html">← 용사 전시관</a>
<div id="hud"><h1>필드 몬스터 — 뚱멧돼지 「투기」</h1>
  <div class="sub">컷아웃 퍼펫 리깅 · 부품 아틀라스 2세트(기본/불속성) · 죽음 = 뿅! 음식 조각</div></div>
<div id="panel">
  <button data-anim="idle" class="on">대기</button>
  <button data-anim="walk">걷기</button>
  <button data-anim="charge">돌진</button>
  <button data-anim="hit">피격</button>
  <span class="sep"></span>
  <button id="btnDie">죽음</button>
  <button id="btnRev" disabled>부활</button>
  <span class="sep"></span>
  <button id="btnAv">아바타: 기본</button>
  <span class="sep"></span>
  <label><input type="checkbox" id="ckBone">뼈대</label>
  <label><input type="checkbox" id="ckExp">부품 분해</label>
  <label>속도 <input type="range" id="rgSpd" min="0.2" max="2" step="0.1" value="1"></label>
</div>
<canvas id="cv"></canvas>
<script>
"use strict";
// ==== 섹션 맵 ====================================================
// 1. 에러 표시 / 유틸(RNG·이징·행렬)
// 2. 팔레트 (기본 / 불속성)
// 3. 부품 드로잉 함수 + 오프스크린 베이크 (아틀라스 2세트)
// 4. 리그 (씬그래프 노드 · pivot · z)
// 5. 애니메이션 (키프레임 트랙 + 큐빅 이징 + 크로스페이드)
// 6. 죽음/부활 (음식 조각 · 해석적 바운스 물리 · 뿅/반짝 이펙트)
// 7. 배경(풀밭 필드) / 이펙트(퍼프·별·김·스파클)
// 8. 렌더 (renderMonster · 뼈대 오버레이 · 부품 분해 뷰)
// 9. 라이브 모드 (상태머신 · 파티클 · UI)
// 10. 몽타주 모드 (?montage — 동기 렌더)
// =================================================================

// ---- 1. 에러 / 유틸 ----
const errBox = document.getElementById('err');
function showErr(m){ errBox.textContent += m + "\n"; }
window.onerror = (m,s,l,c)=>{ showErr("ERR: "+m+" @"+l+":"+c); };
window.addEventListener('unhandledrejection', e=>showErr("REJ: "+e.reason));

const TAU = Math.PI*2, D2R = Math.PI/180;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,u)=>a+(b-a)*u;
const sstep=u=>{u=clamp(u,0,1);return u*u*(3-2*u);};
const easeOut=u=>1-Math.pow(1-clamp(u,0,1),3);
const easeInOut=u=>{u=clamp(u,0,1);return u<0.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
// 2D 행렬 [a,b,c,d,e,f]
function mkM(x,y,r,sx,sy){const c=Math.cos(r),s=Math.sin(r);return [c*sx,s*sx,-s*sy,c*sy,x,y];}
function mulM(p,q){return [p[0]*q[0]+p[2]*q[1], p[1]*q[0]+p[3]*q[1], p[0]*q[2]+p[2]*q[3], p[1]*q[2]+p[3]*q[3], p[0]*q[4]+p[2]*q[5]+p[4], p[1]*q[4]+p[3]*q[5]+p[5]];}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}

// ---- 2. 팔레트 ----
const PAL = {
  base:{ line:'#241c17', body:'#54463e', belly:'#6b5a50', shade:'#3c322c', top:'#665649',
    mane:'#b89a5a', maneSh:'#8a7340', earIn:'#c08a80', eye:'#e8c03c', lid:'#463a32',
    snout:'#9a7a72', snoutHi:'#b3948a', nostril:'#382923', hoof:'#2f2620', tusk:'#f6f2e4',
    leg:'#5a4b42', legFar:'#443831' },
  fire:{ line:'#1c1512', body:'#2e2624', belly:'#3b2f2a', shade:'#1f1815', top:'#413630',
    mane:'#e84c2c', maneSh:'#b93a20', earIn:'#ff8a4c', eye:'#ffb03c', lid:'#241b16',
    snout:'#6e5049', snoutHi:'#8a675c', nostril:'#241813', hoof:'#171210', tusk:'#f6f2e4',
    leg:'#292019', legFar:'#1f1813', crack:'#ff7a3c' }
};

// ---- 3. 부품 드로잉 + 베이크 ----
const PB = 2; // 베이크 해상도 배율
function bake(bounds, fn){
  const [x0,y0,x1,y1]=bounds;
  const cv=document.createElement('canvas');
  cv.width=Math.ceil((x1-x0)*PB); cv.height=Math.ceil((y1-y0)*PB);
  const c=cv.getContext('2d'); c.scale(PB,PB); c.translate(-x0,-y0);
  c.lineJoin='round'; c.lineCap='round';
  fn(c);
  return {cv, x0, y0, w:(x1-x0), h:(y1-y0)};
}
function bodyPath(c){ c.beginPath(); c.ellipse(0,-108,122,106,0,0,TAU); }

function drawBody(c,P,fire){
  bodyPath(c); c.fillStyle=P.body; c.fill();
  c.save(); bodyPath(c); c.clip();
  // 우하단 얇은 셀그림자 림 (어두운 전체 채움 → 베이스를 좌상으로 시프트해 덮음)
  c.fillStyle=P.shade; c.fillRect(-146,-226,292,236);
  c.fillStyle=P.body; c.beginPath(); c.ellipse(-14,-116,122,106,0,0,TAU); c.fill();
  c.fillStyle=P.belly; c.beginPath(); c.ellipse(-22,-62,84,58,0.12,0,TAU); c.fill();     // 배 밝음
  c.globalAlpha=0.55; c.fillStyle=P.top; c.beginPath(); c.ellipse(-30,-178,80,36,-0.18,0,TAU); c.fill(); // 톱라이트
  c.globalAlpha=1; c.restore();
  // 뺨 털 삐죽 2개
  c.fillStyle=P.body; c.strokeStyle=P.line; c.lineWidth=4;
  c.beginPath(); c.moveTo(-114,-96); c.lineTo(-136,-104); c.lineTo(-116,-82); c.closePath(); c.fill(); c.stroke();
  c.beginPath(); c.moveTo(-116,-70); c.lineTo(-138,-70); c.lineTo(-115,-56); c.closePath(); c.fill(); c.stroke();
  bodyPath(c); c.strokeStyle=P.line; c.lineWidth=6; c.stroke();
}
function drawCracks(c,P){ // 불속성 마그마 균열 (몸 클립)
  c.save(); bodyPath(c); c.clip();
  c.strokeStyle=P.crack; c.lineWidth=4; c.lineCap='round';
  const cr=[[[-60,-40],[-38,-66],[-46,-96],[-22,-118]],
            [[30,-26],[54,-52],[44,-84],[68,-108]],
            [[86,-60],[104,-84],[92,-116]],
            [[-8,-18],[10,-40],[-4,-64]],
            [[-92,-118],[-72,-140],[-84,-166]]];
  for(const seg of cr){ c.beginPath(); c.moveTo(seg[0][0],seg[0][1]);
    for(let i=1;i<seg.length;i++) c.lineTo(seg[i][0],seg[i][1]); c.stroke(); }
  c.fillStyle=P.crack;
  for(const [x,y] of [[-30,-30],[70,-40],[20,-100],[-70,-90],[100,-96]]){ c.beginPath(); c.arc(x,y,3,0,TAU); c.fill(); }
  c.restore();
}
function drawLeg(c,P,far){
  const w=far?32:37, col=far?P.legFar:P.leg;
  rr(c,-w/2,-20,w,72,13); c.fillStyle=col; c.fill();
  c.save(); rr(c,-w/2,-20,w,72,13); c.clip();
  c.fillStyle=P.hoof; c.fillRect(-w/2,36,w,18);
  if(!far){ c.globalAlpha=0.35; c.fillStyle=P.belly; c.fillRect(-w/2,-20,9,58); c.globalAlpha=1; }
  c.restore();
  rr(c,-w/2,-20,w,72,13); c.strokeStyle=P.line; c.lineWidth=far?4.5:5; c.stroke();
}
function drawEar(c,P){
  c.beginPath(); c.moveTo(-17,8); c.quadraticCurveTo(-16,-26,-2,-40);
  c.quadraticCurveTo(14,-26,17,10); c.quadraticCurveTo(0,2,-17,8); c.closePath();
  c.fillStyle=P.body; c.fill(); c.strokeStyle=P.line; c.lineWidth=5; c.stroke();
  c.beginPath(); c.moveTo(-8,2); c.quadraticCurveTo(-8,-18,-2,-28);
  c.quadraticCurveTo(6,-18,8,4); c.quadraticCurveTo(0,0,-8,2); c.closePath();
  c.fillStyle=P.earIn; c.fill();
}
function drawFace(c,P,blink,fire){
  for(const s of [-1,1]){ const ex=s<0?-34:34;
    if(!blink){
      c.beginPath(); c.ellipse(ex,0,15,12,0,0,TAU); c.fillStyle=P.eye; c.fill();
      c.save(); c.beginPath(); c.ellipse(ex,0,15,12,0,0,TAU); c.clip();
      // 화난 윗눈꺼풀 (안쪽으로 처지는 사선)
      c.fillStyle=P.lid; c.beginPath();
      if(s<0){ c.moveTo(ex-17,-14); c.lineTo(ex+17,-14); c.lineTo(ex+17,-1); c.lineTo(ex-17,-9); }
      else   { c.moveTo(ex-17,-14); c.lineTo(ex+17,-14); c.lineTo(ex+17,-9); c.lineTo(ex-17,-1); }
      c.closePath(); c.fill();
      c.fillStyle='#17110d'; c.beginPath(); c.ellipse(ex-2,1,5.5,7,0,0,TAU); c.fill();
      c.fillStyle='rgba(255,255,255,.92)'; c.beginPath(); c.arc(ex-4,-2,2.1,0,TAU); c.fill();
      c.restore();
      c.strokeStyle=P.line; c.lineWidth=4;
      c.beginPath();
      if(s<0){ c.moveTo(ex-16,-9); c.lineTo(ex+16,-1);} else { c.moveTo(ex+16,-9); c.lineTo(ex-16,-1);}
      c.stroke();
    } else {
      c.strokeStyle=P.line; c.lineWidth=5; c.beginPath();
      if(s<0){ c.moveTo(ex-14,-6); c.lineTo(ex+13,2);} else { c.moveTo(ex+14,-6); c.lineTo(ex-13,2);}
      c.stroke();
    }
    // 눈썹 능선 (불속성은 밑에 잉걸빛 림)
    if(fire){ c.strokeStyle='#c85a20'; c.globalAlpha=0.7; c.lineWidth=3; c.beginPath();
      if(s<0){ c.moveTo(ex-19,-17); c.quadraticCurveTo(ex,-18,ex+15,-9);}
      else   { c.moveTo(ex+19,-17); c.quadraticCurveTo(ex,-18,ex-15,-9);}
      c.stroke(); c.globalAlpha=1; }
    c.strokeStyle=P.line; c.lineWidth=6.5; c.beginPath();
    if(s<0){ c.moveTo(ex-20,-21); c.quadraticCurveTo(ex,-22,ex+15,-13);}
    else   { c.moveTo(ex+20,-21); c.quadraticCurveTo(ex,-22,ex-15,-13);}
    c.stroke();
  }
  // 미간 주름
  c.strokeStyle=P.line; c.globalAlpha=0.65; c.lineWidth=2.5;
  c.beginPath(); c.moveTo(-5,-16); c.lineTo(-8,-4); c.moveTo(5,-16); c.lineTo(8,-4); c.stroke();
  c.globalAlpha=1;
}
function drawEyeGlow(c){
  for(const ex of [-34,34]){
    const g=c.createRadialGradient(ex,0,2,ex,0,30);
    g.addColorStop(0,'rgba(255,160,60,.9)'); g.addColorStop(1,'rgba(255,120,40,0)');
    c.fillStyle=g; c.beginPath(); c.arc(ex,0,30,0,TAU); c.fill();
  }
}
function drawMuzzle(c,P){
  // 엄니 (주둥이 뒤에 깔림)
  for(const s of [-1,1]){
    c.beginPath(); c.moveTo(s*30,16);
    c.quadraticCurveTo(s*56,14,s*57,-16);
    c.quadraticCurveTo(s*46,-4,s*36,2);
    c.quadraticCurveTo(s*32,8,s*30,16); c.closePath();
    c.fillStyle=P.tusk; c.fill(); c.strokeStyle=P.line; c.lineWidth=4; c.stroke();
  }
  c.beginPath(); c.ellipse(0,0,47,31,0,0,TAU); c.fillStyle=P.snout; c.fill();
  c.save(); c.beginPath(); c.ellipse(0,0,47,31,0,0,TAU); c.clip();
  c.fillStyle=P.snoutHi; c.beginPath(); c.ellipse(-6,-16,34,13,0,0,TAU); c.fill();
  c.globalAlpha=0.25; c.fillStyle=P.line; c.beginPath(); c.ellipse(10,16,40,14,0,0,TAU); c.fill();
  c.globalAlpha=1; c.restore();
  c.beginPath(); c.ellipse(0,0,47,31,0,0,TAU); c.strokeStyle=P.line; c.lineWidth=5; c.stroke();
  c.fillStyle=P.nostril;
  c.beginPath(); c.ellipse(-15,1,7,11.5,-0.14,0,TAU); c.fill();
  c.beginPath(); c.ellipse(16,1,7,11.5,0.14,0,TAU); c.fill();
  // 씩씩 화난 입
  c.strokeStyle=P.line; c.lineWidth=4;
  c.beginPath(); c.moveTo(-25,26); c.quadraticCurveTo(0,17,25,26); c.stroke();
}
function drawTail(c,P){
  c.strokeStyle=P.line; c.lineWidth=15;
  c.beginPath(); c.moveTo(-2,4); c.bezierCurveTo(18,-4,28,-24,12,-32); c.bezierCurveTo(-2,-38,-8,-24,4,-18);
  c.stroke();
  c.strokeStyle=P.body; c.lineWidth=8.5;
  c.beginPath(); c.moveTo(-2,4); c.bezierCurveTo(18,-4,28,-24,12,-32); c.bezierCurveTo(-2,-38,-8,-24,4,-18);
  c.stroke();
}
// 갈기 스파이크 base 점 (mane 로컬 = body로컬 - (16,-152))
const MB=[[-80,-40],[-48,-56],[-12,-62],[26,-56],[58,-40],[84,-18],[100,6]];
function drawMane(c,P){
  const L=[46,54,58,52,44,36,26];
  c.beginPath(); c.moveTo(MB[0][0],MB[0][1]+14);
  for(let i=0;i<MB.length-1;i++){
    const a=MB[i], b=MB[i+1];
    const mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2;
    const dx=mx+16, dy=my-44; const dl=Math.hypot(dx,dy)||1;
    const tip=[mx+dx/dl*L[i]+9+i*1.5, my+dy/dl*L[i]-3];
    c.quadraticCurveTo(a[0]+(tip[0]-a[0])*0.24, a[1]+(tip[1]-a[1])*0.62, tip[0], tip[1]);
    c.quadraticCurveTo(b[0]+(tip[0]-b[0])*0.24, b[1]+(tip[1]-b[1])*0.62, b[0], b[1]);
  }
  c.quadraticCurveTo(60,30,-10,26); c.quadraticCurveTo(-60,20,MB[0][0],MB[0][1]+14); c.closePath();
  c.fillStyle=P.mane; c.fill();
  c.save(); c.clip();
  c.fillStyle=P.maneSh; c.globalAlpha=0.85;
  c.beginPath(); c.moveTo(-96,10); c.quadraticCurveTo(-20,-28,110,26); c.lineTo(110,60); c.lineTo(-96,60); c.closePath(); c.fill();
  c.globalAlpha=1; c.restore();
  c.strokeStyle=P.line; c.lineWidth=5; c.stroke();
}
function drawFlame(c,frame){
  const layers=[['#e84c2c',1],['#ff9a3c',0.68],['#ffd54a',0.4]];
  for(const [col,sf] of layers){
    c.fillStyle=col; c.beginPath();
    for(let i=0;i<MB.length;i++){
      const b=MB[i];
      const j=Math.sin(i*3.1+frame*2.4)*8, j2=Math.cos(i*2.3+frame*1.9)*5;
      const L=(52+16*Math.sin(i*2.0+frame*2.1))*sf*(1-i*0.07);
      const dx=b[0]+16, dy=b[1]-44; const dl=Math.hypot(dx,dy)||1;
      const tip=[b[0]+dx/dl*L+10+j, b[1]+dy/dl*L+j2];
      const w=15*sf;
      c.moveTo(b[0]-w,b[1]+6);
      c.quadraticCurveTo(b[0]-w*1.15+(tip[0]-b[0])*0.4, b[1]+(tip[1]-b[1])*0.55, tip[0], tip[1]);
      c.quadraticCurveTo(b[0]+w*1.15+(tip[0]-b[0])*0.4, b[1]+(tip[1]-b[1])*0.55, b[0]+w, b[1]+6);
      c.closePath();
    }
    c.fill();
  }
}
// ---- 음식 조각 (죽음 연출의 백미 — 단면 디테일) ----
function drawHam(c,grill){
  const bodyCol=grill?'#b06a38':'#e08a7c', ring=grill?'#d9a468':'#f4b6a8',
        inner=grill?'#eec592':'#fbd9cd', bone=grill?'#fff2da':'#fff7e8',
        line=grill?'#4c2612':'#5c3326';
  c.beginPath(); c.moveTo(-30,-25);
  c.bezierCurveTo(4,-34,34,-24,37,-2); c.bezierCurveTo(39,16,24,29,-2,29);
  c.bezierCurveTo(-26,29,-40,15,-38,-6); c.bezierCurveTo(-37,-17,-35,-22,-30,-25);
  c.closePath();
  c.fillStyle=bodyCol; c.fill();
  c.save(); c.clip();
  c.globalAlpha=0.3; c.fillStyle='#fff'; c.beginPath(); c.ellipse(8,-16,26,9,0.2,0,TAU); c.fill(); c.globalAlpha=1;
  if(grill){ c.strokeStyle='#5e3018'; c.lineWidth=4; c.globalAlpha=0.8;
    c.beginPath(); c.moveTo(6,-30); c.lineTo(30,16); c.moveTo(20,-26); c.lineTo(40,8); c.stroke(); c.globalAlpha=1; }
  c.restore();
  // 둥근 분홍 단면 + 중앙 뼈 원
  c.beginPath(); c.arc(-11,1,23,0,TAU); c.fillStyle=ring; c.fill();
  c.strokeStyle=line; c.lineWidth=2.5; c.stroke();
  c.beginPath(); c.arc(-11,1,16,0,TAU); c.fillStyle=inner; c.fill();
  c.beginPath(); c.arc(-11,1,6.2,0,TAU); c.fillStyle=bone; c.fill();
  c.strokeStyle=grill?'#c08a4e':'#dfa08e'; c.lineWidth=2; c.stroke();
  c.beginPath(); c.moveTo(-30,-25);
  c.bezierCurveTo(4,-34,34,-24,37,-2); c.bezierCurveTo(39,16,24,29,-2,29);
  c.bezierCurveTo(-26,29,-40,15,-38,-6); c.bezierCurveTo(-37,-17,-35,-22,-30,-25); c.closePath();
  c.strokeStyle=line; c.lineWidth=4.5; c.stroke();
}
function drawSteak(c,grill){
  const meat=grill?'#a2582c':'#d95850', meatHi=grill?'#bd6f3c':'#ea7d72',
        fat=grill?'#eccf92':'#f7ecd2', side=grill?'#6e3a1c':'#a83c36',

function tv(keys,t){
  if(t<=keys[0][0]) return keys[0][1];
  for(let i=0;i<keys.length-1;i++){ const a=keys[i], b=keys[i+1];
    if(t<=b[0]){ const u=(t-a[0])/Math.max(1e-6,b[0]-a[0]); return a[1]+(b[1]-a[1])*sstep(u); } }
  return keys[keys.length-1][1];
}

function samplePose(name, phase, absT){
  const A=ANIMS[name];
  const t=A.loop? ((phase%1)+1)%1 : clamp(phase,0,1);
  const p=mkPose();
  for(const key in A.tracks){ const di=key.indexOf('.');
    p[key.slice(0,di)][key.slice(di+1)]=tv(A.tracks[key],t); }
  if(A.extra) A.extra(p,t,absT||0);
  return p;

// ---- 6. 죽음/부활 — 음식 조각 물리 (해석적, 결정적) ----
const GRAV=1500, POOF_T=0.32, SETTLE_T=2.3;
const PIECES=(()=>{
  const R=mulberry32(20250823);
  const kinds=['ham','steak','saus','ham','steak','ham','saus','steak'];
  const hh={ham:29,steak:23,saus:16};
  const spread=[-158,-112,-58,-18,24,66,112,158];
  return kinds.map((k,i)=>{
    const s=0.72+R()*0.34;
    return { kind:k, s,
      x0:(R()-0.5)*64, y0:-150+R()*46,
      vx:spread[i]*(0.9+R()*0.35), vy:-(330+R()*190),
      r0:(R()-0.5)*1.2, om:(R()-0.5)*11, e:0.5+R()*0.13,
      hh:hh[k]*s, tilt:(R()-0.5)*0.24, stag:i*0.045 };
  });
})();
function pieceState(p, t){
  if(t<=0) return {x:p.x0,y:p.y0,rot:p.r0,imp:0,air:true,vis:t>-0.001};
  let x=p.x0,y=p.y0,vx=p.vx,vy=p.vy,rot=p.r0,om=p.om,e=p.e;
  const gy=-p.hh; let rem=t, lastB=-9;
  for(let i=0;i<9;i++){
    const A=GRAV/2, B=vy, C=y-gy;
    const disc=Math.max(0,B*B-4*A*C);
    const T=(-B+Math.sqrt(disc))/(2*A);
    if(T>=rem){ x+=vx*rem; y+=vy*rem+A*rem*rem; rot+=om*rem;
      return {x,y,rot,air:true,imp:Math.max(0,1-(t-lastB)/0.12),vis:true}; }
    x+=vx*T; y=gy; rot+=om*T; vy=vy+GRAV*T; rem-=T; lastB=t-rem;
    vy=-vy*e; vx*=0.6; om*=-0.5; e*=0.88;
    if(vy>-95){
      const rr0=rot, target=Math.round(rr0/Math.PI)*Math.PI+p.tilt;
      const u=sstep(rem/0.3);
      return {x, y:gy, rot:lerp(rr0,target,u), air:false,
        imp:Math.max(0,1-rem/0.14), rest:rem>0.35, vis:true};
    }
  }
  return {x,y:gy,rot,air:false,imp:0,rest:true,vis:true};
}
// 뿅 연기 퍼프 (t 0..1)
function drawPuff(c,t,x,y,sc){
  if(t<0||t>=1) return;
  const e=easeOut(t); sc=sc||1;
  c.save(); c.translate(x,y);
  for(let i=0;i<8;i++){
    const a=i/8*TAU+0.45, d=(16+62*e)*sc;
    const r=(27*(1-t*0.55))*(0.75+0.3*Math.sin(i*2.7))*sc;
    c.globalAlpha=(1-t)*0.92;
    c.fillStyle='#ffffff'; c.beginPath(); c.arc(Math.cos(a)*d,Math.sin(a)*d*0.8,r,0,TAU); c.fill();
    c.globalAlpha=(1-t)*0.6; c.fillStyle='#efe8d8';
    c.beginPath(); c.arc(Math.cos(a)*d,Math.sin(a)*d*0.8+r*0.25,r*0.62,0,TAU); c.fill();
  }
  if(t<0.3){ c.globalAlpha=(1-t/0.3); c.fillStyle='#fffbe8';
    c.beginPath(); c.arc(0,0,52*sc*(0.4+t*2),0,TAU); c.fill(); }
  c.restore(); c.globalAlpha=1;
}
function star5(c,r){
  c.beginPath();
  for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, rr2=i%2?r*0.45:r;
    const x=Math.cos(a)*rr2, y=Math.sin(a)*rr2; i?c.lineTo(x,y):c.moveTo(x,y); }
  c.closePath();
}
function drawStarPop(c,t,x,y,sc){
  if(t<0||t>=1) return; sc=sc||1;
  c.save(); c.translate(x,y);
  for(let i=0;i<6;i++){
    const a=i/6*TAU+0.8, d=(26+140*easeOut(t))*sc;
    c.save(); c.translate(Math.cos(a)*d,Math.sin(a)*d*0.85-20*t);
    c.rotate(t*4+i); c.scale(sc*(1-t*0.8),sc*(1-t*0.8));
    star5(c,11); c.fillStyle='#ffd54a'; c.fill();
    c.strokeStyle='#c9871e'; c.lineWidth=2.5; c.stroke(); c.restore();
  }
  c.restore();
}
function drawSparkle(c,x,y,s,al){
  c.save(); c.translate(x,y); c.globalAlpha=al;
  c.fillStyle='#fff9dc';
  c.beginPath();
  c.moveTo(0,-s); c.quadraticCurveTo(s*0.18,-s*0.18,s,0); c.quadraticCurveTo(s*0.18,s*0.18,0,s);
  c.quadraticCurveTo(-s*0.18,s*0.18,-s,0); c.quadraticCurveTo(-s*0.18,-s*0.18,0,-s);
  c.closePath(); c.fill();
  c.restore(); c.globalAlpha=1;
}
function drawSteam(c,x,y,time,amt,seed){
  c.save(); c.strokeStyle='#ffffff'; c.lineCap='round';
  for(let k=0;k<3;k++){
    const p2=time*0.9+seed*3.7+k*0.55, rise=((p2%1.4)/1.4);
    const yy=y-8-rise*62, al=Math.sin(rise*Math.PI)*0.75*amt;
    c.globalAlpha=al; c.lineWidth=4.4-rise*2;
    const bx=x+(k-1)*11;
    c.beginPath(); c.moveTo(bx, y-6-rise*16);
    c.quadraticCurveTo(bx+Math.sin(p2*4+k)*9, (y-6+yy)/2, bx+Math.sin(p2*2.6+k*2)*7, yy);
    c.stroke();
  }
  c.restore(); c.globalAlpha=1;
}
// 죽음 장면 (루트 공간, 결정적: dT만으로 그림)
function drawDeathScene(ctx, dT, av, absT){
  const A=ATLAS[av];
  if(dT<POOF_T){
    const k=dT/POOF_T;
    const p=samplePose('idle',0.16,absT);
    p.root.dx=Math.sin(dT*86)*2.8*k; p.body.sy*=(1-0.1*k); p.body.sx*=(1+0.08*k);
    p.flags.face='blink';
    drawShadow(ctx,p.root.dx,1+0.08*k,1);
    renderMonster(ctx,p,av,{time:absT});
    drawStarPop(ctx,dT*1.7,0,-160,0.5);
    return;
  }
  const t=dT-POOF_T;
  // 조각들
  for(let i=0;i<PIECES.length;i++){
    const pc=PIECES[i], st=pieceState(pc,t-pc.stag);
    if(!st.vis) continue;
    const spr=A[pc.kind];
    const hgt=clamp(1+(st.y+pc.hh)/160,0.25,1);
    ctx.save(); ctx.globalAlpha=0.2*hgt;
    ctx.fillStyle='#1e3512'; ctx.beginPath();
    ctx.ellipse(st.x,-3,34*pc.s*hgt+8,8*hgt+2,0,0,TAU); ctx.fill();
    ctx.restore();
    const sx=1+0.42*st.imp, sy=1-0.38*st.imp;
    ctx.save();
    ctx.translate(st.x, st.y*sy + (1-sy)*(-0)); ctx.rotate(st.air?st.rot:st.rot);
    ctx.scale(pc.s*sx, pc.s*sy);
    ctx.drawImage(spr.cv, spr.x0, spr.y0, spr.w, spr.h);
    ctx.restore();
  }
  drawPuff(ctx,t/0.72,0,-130,1.15);
  drawStarPop(ctx,t/0.9,0,-130,1);
  // 안착 후 — 반짝 + 김 모락모락 (맛있게)
  if(dT>SETTLE_T-0.4){
    const amt=sstep((dT-(SETTLE_T-0.4))/0.5), tm=(absT!==undefined?absT:dT);
    for(let i=0;i<PIECES.length;i++){
      const pc=PIECES[i], st=pieceState(pc,t-pc.stag);
      if(st.air) continue;
      if(av==='fire'||i%3===0) drawSteam(ctx,st.x,st.y-pc.hh*0.5,tm,amt,i);
      const tw=Math.sin(tm*3.1+i*2.3);
      if(tw>0.15) drawSparkle(ctx, st.x+18*Math.sin(i*5), st.y-pc.hh-14-(i%3)*8, (7+(i%3)*3)*tw, amt*Math.min(1,tw+0.2));
    }
  }
}

// ---- 7. 배경 (풀밭 필드) ----
function drawField(ctx,w,h,gy,scroll){
  const sky=ctx.createLinearGradient(0,0,0,gy);
  sky.addColorStop(0,'#a5ddf2'); sky.addColorStop(0.75,'#d4efdc'); sky.addColorStop(1,'#e8f6d0');
  ctx.fillStyle=sky; ctx.fillRect(0,0,w,gy);
  // 구름
  ctx.fillStyle='rgba(255,255,255,.8)';
  for(const [cx,cy,cs] of [[w*0.2,gy*0.28,26],[w*0.72,gy*0.2,32],[w*0.5,gy*0.42,18]]){
    ctx.beginPath(); ctx.arc(cx,cy,cs,0,TAU); ctx.arc(cx+cs*0.9,cy+4,cs*0.72,0,TAU);
    ctx.arc(cx-cs*0.85,cy+6,cs*0.6,0,TAU); ctx.fill();
  }
  // 수풀 실루엣 2겹 (원경 패럴랙스)
  const bush=(off,col,r0,yb)=>{ ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(0,gy);
    const step=110;
    for(let x=-((off%step)+step); x<w+step; x+=step){
      const i=Math.round((x+off)/step);
      const r=r0+Math.abs((i*73)%37); ctx.arc(x,yb, r, Math.PI,0);
    }
    ctx.lineTo(w,gy); ctx.closePath(); ctx.fill(); };
  bush(scroll*0.12,'#b2d98e',44,gy+8);
  bush(scroll*0.25+60,'#93c470',34,gy+14);
  // 잔디
  const gr=ctx.createLinearGradient(0,gy,0,h);
  gr.addColorStop(0,'#8ecf5e'); gr.addColorStop(1,'#5aa83c');
  ctx.fillStyle=gr; ctx.fillRect(0,gy,w,h-gy);
  ctx.strokeStyle='rgba(70,130,44,.5)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,gy+1); ctx.lineTo(w,gy+1); ctx.stroke();
  // 풀 포기 + 꽃 (스크롤)
  for(let i=0;i<26;i++){
    const px=((i*197+41 - scroll) % (w+60) + (w+60)) % (w+60) - 30;
    const py=gy+10+((i*89)%Math.max(20,(h-gy-18)));
    const s=0.55+((i*31)%10)/18;
    ctx.strokeStyle='rgba(58,122,38,.5)'; ctx.lineWidth=1.9*s; ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(px,py); ctx.quadraticCurveTo(px-3*s,py-8*s,px-6*s,py-13*s);
    ctx.moveTo(px,py); ctx.lineTo(px+1*s,py-14*s);
    ctx.moveTo(px,py); ctx.quadraticCurveTo(px+4*s,py-7*s,px+8*s,py-12*s);
    ctx.stroke();
    if(i%6===0){ ctx.fillStyle=i%12?'#fff6c8':'#ffd2e0';
      ctx.beginPath(); ctx.arc(px+14,py-4,3.2,0,TAU); ctx.fill();
      ctx.fillStyle='#f6b23c'; ctx.beginPath(); ctx.arc(px+14,py-4,1.4,0,TAU); ctx.fill(); }
  }
}
function drawShadow(ctx,dx,sx,al){
  ctx.save(); ctx.globalAlpha=0.22*al; ctx.fillStyle='#1e3512';
  ctx.beginPath(); ctx.ellipse(dx,-2,138*sx,20,0,0,TAU); ctx.fill();
  ctx.restore();
}

// ---- 8. 렌더 ----
let LAST_WORLDS=null;
function renderMonster(ctx,pose,av,o){
  o=o||{};
  const A=ATLAS[av], time=o.time||0;
  const worlds={};
  const rp=pose.root;
  worlds.root=mkM(rp.dx+(o.dx||0), rp.dy, rp.rot*D2R, rp.sx*(o.pop||1), rp.sy*(o.pop||1));
  // 부모 먼저 (root 직속 → body 자식 순)
  const topo=NODES.filter(nd=>nd.p==='root').concat(NODES.filter(nd=>nd.p!=='root'));
  for(const nd of topo){
    const pp=pose[nd.n];
    const local=mkM(nd.x+pp.dx, nd.y+pp.dy, pp.rot*D2R, pp.sx, pp.sy);
    worlds[nd.n]=mulM(worlds[nd.p], local);
  }
  const order=NODES.slice().sort((a,b)=>a.z-b.z);
  for(const nd of order){
    if(nd.fireOnly && av!=='fire') continue;
    let sname=nd.spr;
    if(sname==='MANE') sname = av==='fire' ? 'flame'+(Math.floor(time*11)%3) : 'mane';
    if(sname==='FACE') sname = pose.flags.face==='blink'?'face_blink':'face_open';
    const spr=A[sname]; if(!spr) continue;
    const w=worlds[nd.n];
    ctx.save(); ctx.transform(w[0],w[1],w[2],w[3],w[4],w[5]);
    if(nd.n==='eyeglow'){ ctx.globalCompositeOperation='lighter';
      ctx.globalAlpha=(o.alpha||1)*(0.55+0.4*Math.sin(time*5.2)); }
    else if(nd.n==='cracks'){ ctx.globalAlpha=(o.alpha||1)*(0.6+0.4*Math.sin(time*4.1)); }
    else ctx.globalAlpha=o.alpha||1;
    ctx.drawImage(spr.cv,spr.x0,spr.y0,spr.w,spr.h);
    if(nd.n==='cracks'){ ctx.globalCompositeOperation='lighter';
      ctx.globalAlpha=(o.alpha||1)*0.35*(0.6+0.4*Math.sin(time*4.1));
      ctx.drawImage(spr.cv,spr.x0,spr.y0,spr.w,spr.h); }
    ctx.restore();
  }
  LAST_WORLDS=worlds;
  return worlds;
}
function drawBones(ctx,worlds){
  ctx.save();
  ctx.lineWidth=2; ctx.strokeStyle='rgba(255,180,40,.9)';
  for(const nd of NODES){
    const w=worlds[nd.n], pw=worlds[nd.p];
    if(!w||!pw) continue;
    ctx.beginPath(); ctx.moveTo(pw[4],pw[5]); ctx.lineTo(w[4],w[5]); ctx.stroke();
  }
  for(const nd of NODES.concat([{n:'root',kr:'루트'}])){
    const w=nd.n==='root'?worlds.root:worlds[nd.n]; if(!w) continue;
    ctx.fillStyle=nd.n==='root'?'#ff5252':'#ffd54a';
    ctx.beginPath(); ctx.arc(w[4],w[5],5,0,TAU); ctx.fill();
    ctx.strokeStyle='#402800'; ctx.lineWidth=1.5; ctx.stroke();
    ctx.fillStyle='#fff'; ctx.font='11px "Segoe UI","Malgun Gothic",sans-serif';
    ctx.strokeStyle='rgba(0,0,0,.7)'; ctx.lineWidth=3;
    ctx.strokeText(nd.kr||nd.n, w[4]+7, w[5]-6); ctx.fillText(nd.kr||nd.n, w[4]+7, w[5]-6);
  }
  ctx.restore();
}
// 부품 분해 뷰 — 두 아틀라스 비교
function drawExplode(ctx,w,h){
  ctx.fillStyle='#191d24'; ctx.fillRect(0,0,w,h);
  ctx.fillStyle='#f2f6e8'; ctx.textAlign='center';
  ctx.font='600 '+Math.round(clamp(w*0.018,13,22))+'px "Segoe UI","Malgun Gothic",sans-serif';
  ctx.fillText('부품 분해 — 아틀라스 2세트 (리그·피벗·키프레임 공유)', w/2, Math.max(26,h*0.05));
  const items=av=>{
    const L=[['body','몸통'],[av==='fire'?'flame0':'mane',av==='fire'?'불꽃 갈기':'갈기'],
      ['earL','귀(앞)'],['earR','귀(뒤)'],['face_open','얼굴'],['face_blink','얼굴(감음)'],
      ['muzzle','주둥이·엄니'],['tail','꼬리'],['legNear','다리(근)'],['legFar','다리(원)'],
      ['ham',av==='fire'?'구운 햄':'햄'],['steak',av==='fire'?'구운 스테이크':'스테이크'],
      ['saus',av==='fire'?'구운 소시지':'소시지']];
    if(av==='fire') L.push(['cracks','마그마 균열']);
    return L; };
  const cols=3, top=Math.max(40,h*0.08), blockW=w/2;
  [['base','기본'],['fire','불속성']].forEach(([av,label],bi)=>{
    const bx=bi*blockW;
    ctx.fillStyle=bi?'#ffb066':'#c8e29a';
    ctx.font='600 '+Math.round(clamp(w*0.015,12,18))+'px "Segoe UI","Malgun Gothic",sans-serif';
    ctx.fillText('◈ '+label, bx+blockW/2, top);
    const list=items(av), rows=Math.ceil(list.length/cols);
    const cw=(blockW-20)/cols, ch=(h-top-16)/rows;
    list.forEach(([sn,nm],i)=>{
      const cx=bx+12+(i%cols)*cw, cy=top+8+Math.floor(i/cols)*ch;
      ctx.strokeStyle='rgba(255,255,255,.1)'; ctx.lineWidth=1;
      ctx.strokeRect(cx+2,cy+2,cw-6,ch-6);
      const spr=ATLAS[av][sn]; if(!spr) return;
      const fit=Math.min((cw-18)/spr.w,(ch-30)/spr.h,1.1);
      ctx.save(); ctx.translate(cx+cw/2, cy+(ch-14)/2);
      ctx.scale(fit,fit); ctx.translate(-(spr.x0+spr.w/2), -(spr.y0+spr.h/2));
      ctx.drawImage(spr.cv,spr.x0,spr.y0,spr.w,spr.h); ctx.restore();
      ctx.fillStyle='#cdd6c2';
      ctx.font=Math.round(clamp(ch*0.13,9,12))+'px "Segoe UI","Malgun Gothic",sans-serif';
      ctx.fillText(nm, cx+cw/2, cy+ch-8);
    });
  });
  ctx.textAlign='left';
}

  function frame(ms){
    requestAnimationFrame(frame);
    let dt=Math.min(0.05,(ms-lastMs)/1000); lastMs=ms;
    dt*=S.speed; S.absT+=dt; S.popT+=dt;
    const c=ctx;
    c.setTransform(DPR,0,0,DPR,0,0);

    if(S.explode){ drawExplode(c,VW,VH); return; }

    // --- 업데이트 ---
    const A=ANIMS[S.anim];
    if(S.mode==='live'){
      S.animT+=dt; S.fadeT=Math.min(1,S.fadeT+dt*4);
      const phase=S.animT/A.dur;
      if(S.anim==='walk'){ S.scroll+=104*dt;
        if(S.avatar==='fire'){ if(Math.random()<dt*8) emberAt((Math.random()<0.5?-84:82),-6,1); }
      }
      if(S.anim==='charge'){
        cue('scr1',phase,0.18,()=>dustAt(-70,4));
        cue('scr2',phase,0.28,()=>dustAt(-70,4));
        cue('dash',phase,0.48,()=>{ dustAt(60,8,true); if(S.avatar==='fire') emberAt(0,-40,8); });
        if(phase>0.48&&phase<0.64){ S.scroll+=1500*dt; if(Math.random()<dt*30) dustAt(90,1,true); }
        cue('skid',phase,0.65,()=>dustAt(-140,7,true));
        if(phase>=1){ setAnim('idle'); }
      }
      if(S.anim==='hit'){ cue('st',phase,0.05,()=>starsAt(0,-170));
        if(phase>=1) setAnim('idle'); }
      if(S.anim==='idle'){
        const ph=((phase%1)+1)%1;
        cue('sn'+Math.floor(phase),ph,0.46,()=>{
          const fx=S.avatar==='fire';
          puffAt(-58,-92,3,0.6,fx?'#8a8a8a':'#fff'); puffAt(-16,-92,3,0.6,fx?'#8a8a8a':'#fff');
          if(fx) emberAt(-38,-92,3);
        });
        if(ph<0.4) S.charged={};
      }
    } else if(S.mode==='dying'){
      const prev=S.dT; S.dT+=dt;
      if(prev<POOF_T&&S.dT>=POOF_T){}
      if(S.dT>=SETTLE_T+0.4){ S.mode='dead'; btnRev.disabled=false; }
    } else if(S.mode==='dead'){ S.dT+=dt; }
    else if(S.mode==='reviving'){
      S.rT+=dt;
      if(S.rT>=1.25){ S.mode='live'; S.dT=0; S.popT=0; bigPoof(0,-140);
        btnDie.disabled=false; setAnim('idle'); }
    }
    updateParticles(dt);

    // --- 그리기 ---
    const gy=VH*0.62;
    drawField(c,VW,VH,gy,S.scroll);
    const scale=Math.min(VW/900, VH/720)*1.32;
    c.save(); c.translate(VW/2, gy+(VH-gy)*0.45); c.scale(scale,scale);

    const pop=1+(S.popT<0.45? Math.sin(S.popT/0.45*Math.PI)*0.16*(1-S.popT/0.45+0.4):0);
    if(S.mode==='live'){
      const pose=currentPose();
      const phase=S.animT/A.dur;
      drawShadow(c,pose.root.dx,pose.body.sx,1);
      // 돌진 대시 잔상
      if(S.anim==='charge'&&phase>0.47&&phase<0.66){
        renderMonster(c,pose,S.avatar,{time:S.absT,alpha:0.14,dx:86,pop});
        renderMonster(c,pose,S.avatar,{time:S.absT,alpha:0.26,dx:44,pop});
        c.strokeStyle='rgba(255,255,255,.5)'; c.lineWidth=5; c.lineCap='round';
        for(let i=0;i<5;i++){ const yy=-40-i*38, xx=pose.root.dx+150+i*18;
          c.globalAlpha=0.5-i*0.07; c.beginPath(); c.moveTo(xx,yy); c.lineTo(xx+120+i*24,yy); c.stroke(); }
        c.globalAlpha=1;
      }
      renderMonster(c,pose,S.avatar,{time:S.absT,pop});
      if(S.bones) drawBones(c,LAST_WORLDS);
    } else if(S.mode==='dying'||S.mode==='dead'){
      drawDeathScene(c,S.dT,S.avatar,S.absT);
    } else if(S.mode==='reviving'){
      const tau=(SETTLE_T)*(1-easeInOut(S.rT/1.15));
      const conv=sstep((S.rT-0.85)/0.3);
      c.globalAlpha=1-conv;
      drawDeathScene(c,POOF_T+tau,S.avatar,S.absT);
      c.globalAlpha=1;
      // 빨려드는 반짝
      for(let i=0;i<5;i++){ const a=S.rT*7+i*1.3, d=120*(1-S.rT/1.25);
        drawSparkle(c,Math.cos(a)*d, -130+Math.sin(a)*d*0.7, 6, 0.7); }
      if(S.rT>1.0) drawPuff(c,(S.rT-1.0)/0.25*0.5,0,-130,1.1);
    }
    drawParticles(c);
    c.restore();
  }
  requestAnimationFrame(frame);
}
</script>
</body>
