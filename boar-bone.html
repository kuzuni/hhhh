<script>
"use strict";
// ============================================================================
// ==== 섹션 맵 ================================================================
// ==== 1. 팔레트/유틸  2. 리그(본 계층·행렬)  3. 애니(순수 pose 함수)         ====
// ==== 4. 죽음/부활 시뮬(결정적)  5. 음식 조각 드로잉  6. 몬스터 렌더        ====
// ==== 7. 배경/이펙트  8. 뼈대 오버레이  9. 씬 합성  10. UI/루프  11. 몽타주  ====
// ============================================================================
window.onerror=function(m,s,l,c){var e=document.getElementById('err');
  e.textContent+='ERR: '+m+' @'+l+':'+c+'\n';};
window.addEventListener('unhandledrejection',function(ev){
  document.getElementById('err').textContent+='REJ: '+ev.reason+'\n';});

// ==== 1. 팔레트 / 유틸 =======================================================
var TAU=Math.PI*2, PI=Math.PI;
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function lerp(a,b,t){return a+(b-a)*t;}
function eIO(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}
function eO(t){return 1-Math.pow(1-t,3);}
function eI(t){return t*t*t;}
function eOB(t){var c=1.70158,d=c+1;return 1+d*Math.pow(t-1,3)+c*Math.pow(t-1,2);}
function rnd(x){var v=Math.sin(x*127.1+311.7)*43758.5453;return v-Math.floor(v);}
var FONT='"Segoe UI","Malgun Gothic",sans-serif';

var PAL={
 base:{body:'#54463e',belly:'#6b5a50',shade:'#3c322c',top:'#716052',line:'#241c16',
  mane:'#b89a5a',maneSh:'#8a7340',maneHi:'#d4b878',
  snout:'#9a7a72',snoutHi:'#b6968c',snoutSh:'#7c5f58',nostril:'#43302c',
  eye:'#e8c03c',eyeSh:'#b8912a',pupil:'#1c1410',tusk:'#f6f0dd',tuskSh:'#d5cbae',
  earIn:'#c88f8b',hoof:'#2c231e',brow:'#2e241d'},
 fire:{body:'#2e2624',belly:'#3d332e',shade:'#1c1614',top:'#4a3d35',line:'#120d0a',
  crack:'#ff7a3c',crackHot:'#ffb066',
  flameR:'#e84c2c',flameO:'#ff8f3c',flameY:'#ffd54a',
  snout:'#6d554e',snoutHi:'#836a62',snoutSh:'#503c36',nostril:'#241a18',
  eye:'#ffa03c',eyeSh:'#d97722',pupil:'#3a1404',glow:'#ff8a3c',
  tusk:'#f6f0dd',tuskSh:'#d5cbae',earIn:'#9c5a48',hoof:'#171110',brow:'#171110'}
};
var FOOD={
 line:'#5a2a1e',
 hamBody:'#ec9070',hamBodyHi:'#f8b48f',hamFace:'#f9cab8',hamFaceIn:'#f19b95',
 bone:'#fdf6e2',boneSh:'#d9c8a2',
 steak:'#d6524a',steakIn:'#c23f3a',steakSide:'#a03430',fat:'#f7e9cf',fatSh:'#e6d2ac',
 saus:'#c06044',sausHi:'#dd8862',sausTie:'#8a4630',
 gBody:'#a96a3e',gBodyHi:'#c98d58',gFace:'#c78e57',gFaceIn:'#b0703e',
 gDark:'#7c4a28',gMark:'#54301a',gSteak:'#93502e',gSteakIn:'#7c3f22',gFat:'#dfc08e',
 gSaus:'#8f4a2c',gSausHi:'#b06a42'
};

// ==== 2. 리그 — 본 계층 & 행렬 ==============================================
// 본 = {x,y,rot,sx,sy}. 매 프레임 pose 함수가 커브로 값을 계산하고,
// 모든 드로잉은 여기서 파생된 월드 행렬로 그린다. (스쿼시&스트레치 스케일 채널 전 본)
function mat(x,y,r,sx,sy){var c=Math.cos(r),s=Math.sin(r);
  return [c*sx,s*sx,-s*sy,c*sy,x,y];}
function mmul(A,B){return [
  A[0]*B[0]+A[2]*B[1], A[1]*B[0]+A[3]*B[1],
  A[0]*B[2]+A[2]*B[3], A[1]*B[2]+A[3]*B[3],
  A[0]*B[4]+A[2]*B[5]+A[4], A[1]*B[4]+A[3]*B[5]+A[5]];}
function mpt(M,x,y){return [M[0]*x+M[2]*y+M[4], M[1]*x+M[3]*y+M[5]];}
function bmat(b){return mat(b.x,b.y,b.rot,b.sx,b.sy);}

var HIPS={FN:[58,74],FF:[30,68],BN:[-48,76],BF:[-76,68]}; // body 로컬 좌표
var FEET0={FN:[64,0],FF:[36,0],BN:[-52,0],BF:[-80,0]};    // root(지면) 좌표
var MANE_N=8;

function defaultPose(){
 var p={
  root:{x:0,y:0,rot:0,sx:1,sy:1},
  body:{x:0,y:-108,rot:0,sx:1,sy:1},
  snout:{x:100,y:2,rot:0,sx:1,sy:1},
  jaw:{x:66,y:40,rot:0,sx:1,sy:1},
  earN:{x:40,y:-92,rot:0,sx:1,sy:1},
  earF:{x:-4,y:-100,rot:0,sx:1,sy:1},
  tail:{x:-110,y:-26,rot:0,sx:1,sy:1},
  mane:[],feet:{},
  aux:{snort:0,dust:[],sparks:[],smear:0,groundOff:0,wince:0,stars:0,
       scrape:0,browUp:0,ghost:0,mouthOpen:0}
 };
 for(var i=0;i<MANE_N;i++)p.mane.push({rot:0,sx:1,sy:1});
 for(var k in FEET0)p.feet[k]={x:FEET0[k][0],y:FEET0[k][1],planted:true};
 return p;
}
// 월드 행렬 계산 + 다리 IK(엉덩이→발 접지 락). bones 결과는 렌더/오버레이 공용.
function solve(pose){
 var W={};
 W.root=bmat(pose.root);
 W.body=mmul(W.root,bmat(pose.body));
 W.snout=mmul(W.body,bmat(pose.snout));
 W.jaw=mmul(W.body,bmat(pose.jaw));
 W.earN=mmul(W.body,bmat(pose.earN));
 W.earF=mmul(W.body,bmat(pose.earF));
 W.tail=mmul(W.body,bmat(pose.tail));
 W.mane=[];
 for(var i=0;i<MANE_N;i++){
   var a=-1.30+ i*(-1.55/(MANE_N-1)) - 0.12; // 정수리(-85°)→등마루(-175°)
   var px=Math.cos(a)*112, py=Math.sin(a)*100;
   var m=pose.mane[i];
   W.mane.push({M:mmul(W.body,mat(px,py,a+PI/2+m.rot,m.sx,m.sy)),ang:a});
 }
 // 다리: body에 붙은 엉덩이 월드 위치 → root 공간 발 목표. 간단 IK(회전+길이 스케일)
 W.legs={};
 for(var k in HIPS){
   var hip=mpt(W.body,HIPS[k][0],HIPS[k][1]);
   var ft=pose.feet[k];
   var fx=pose.root.x+ft.x, fy=pose.root.y+ft.y;
   var dx=fx-hip[0], dy=fy-hip[1];
   var len=Math.sqrt(dx*dx+dy*dy), ang=Math.atan2(dy,dx);
   W.legs[k]={hip:hip,foot:[fx,fy],len:len,ang:ang,planted:!!ft.planted};
 }
 return W;
}

// ==== 3. 애니메이션 — 순수 pose 함수 (실시간/몽타주 공용) =====================
// t: 사이클 애니는 위상[0..1), 원샷은 초 단위.
function poseIdle(t){
 var p=defaultPose();
 var br=Math.sin(t*TAU);
 var sy=1+0.038*br, sx=1-0.024*br;
 p.body.sx=sx; p.body.sy=sy;
 p.body.y=-108-100*(sy-1);          // 바닥 접지 유지(스케일 보정)
 p.body.rot=0.012*Math.sin(t*TAU-0.9);
 p.snout.sx=1+0.05*Math.max(0,Math.sin(t*TAU*2-1.2)); // 씩씩 콧김 박자
 // 콧김 2박자
 var s1=t>0.50&&t<0.62?(t-0.50)/0.12:0;
 var s2=t>0.66&&t<0.80?(t-0.66)/0.14:0;
 p.aux.snort=Math.max(s1,s2);
 // 귀 파닥 (사이클 중 1회)
 var ef=t>0.30&&t<0.42?Math.sin((t-0.30)/0.12*PI*2):0;
 p.earN.rot=-0.25*ef; p.earF.rot=0.18*ef;
 p.earN.sy=1+0.1*Math.abs(ef);
 // 갈기 미세 흔들림(호흡 지연 따라오기 — 오버랩)
 for(var i=0;i<MANE_N;i++){
   p.mane[i].rot=0.045*Math.sin(t*TAU-0.8-i*0.42);
   p.mane[i].sy=1+0.03*Math.sin(t*TAU-1.1-i*0.42);
 }
 p.tail.rot=0.22*Math.sin(t*TAU*2-0.5);
 // 가끔 앞발 긁기
 if(t>0.78&&t<0.95){
   var u=(t-0.78)/0.17, sw=Math.sin(u*PI*2);
   p.feet.FN.x=64-14*Math.max(0,sw); p.feet.FN.y=-3*Math.max(0,Math.sin(u*PI*4));
   p.feet.FN.planted=false; p.aux.scrape=Math.max(0,sw);
 }
 return p;
}
var DUTY=0.62, STRIDE=46, LIFT=15;
function footCycle(ph,bx,dir){
 var lp=ph%1; if(lp<0)lp+=1;
 if(lp<DUTY){var u=lp/DUTY; return {x:bx+STRIDE*(0.5-u)*dir,y:0,planted:true,land:u<0.10?1-u/0.10:0};}
 var u=(lp-DUTY)/(1-DUTY);
 return {x:bx+STRIDE*(eIO(u)-0.5)*dir,y:-LIFT*Math.sin(PI*u),planted:false,land:0};
}
function poseWalk(t){
 var p=defaultPose();
 var offs={FN:0,BF:0.06,FF:0.5,BN:0.56};
 for(var k in offs){
   var f=footCycle(t+offs[k],FEET0[k][0],1);
   p.feet[k]={x:f.x,y:f.y,planted:f.planted};
   if(f.land>0.4&&f.planted)p.aux.dust.push({x:f.x,y:0,a:f.land*0.5,r:7});
 }
 // 몸 뒤뚱: 좌우 롤 + 2박자 바운스 + 무게 이동
 var roll=Math.sin(t*TAU);
 p.body.rot=0.105*roll;
 p.body.x=5*roll;
 var bob=Math.abs(Math.cos(t*TAU));
 p.body.y=-108-7*bob;
 p.body.sy=1+0.045*Math.cos(t*TAU*2+0.6);
 p.body.sx=1-0.03*Math.cos(t*TAU*2+0.6);
 p.snout.rot=0.06*roll; p.snout.y=2+1.5*bob;
 p.earN.rot=-0.16*Math.sin(t*TAU-1.0); p.earF.rot=0.14*Math.sin(t*TAU-1.4);
 p.jaw.rot=0.03*roll;
 for(var i=0;i<MANE_N;i++){ // 갈기 오버랩: 몸 롤을 지연해 따라옴
   p.mane[i].rot=-0.20*Math.sin(t*TAU-0.9-i*0.36);
   p.mane[i].sy=1+0.05*Math.sin(t*TAU*2-i*0.4);
 }
 p.tail.rot=0.35*Math.sin(t*TAU*2-1.0);
 p.aux.groundOff=t*STRIDE/DUTY;
 return p;
}
var CHARGE_D=2.7;
function poseCharge(t){
 var p=defaultPose();
 t=clamp(t,0,CHARGE_D);
 if(t<0.9){ // 재기: 뒤로 갸우뚱 + 앞발 긁기 2회
   var u=t/0.9;
   p.root.x=-30*eO(Math.min(1,u*1.6));
   p.body.rot=-0.16*eO(Math.min(1,u*1.6));
   p.body.sx=1+0.03*Math.sin(u*PI); p.body.sy=1-0.02*Math.sin(u*PI);
   var sc=Math.sin(u*PI*4);
   if(u>0.15){p.feet.FN.x=64-20*Math.max(0,sc);p.feet.FN.y=-4*Math.max(0,Math.sin(u*PI*8));
     p.feet.FN.planted=false;p.aux.scrape=Math.max(0,sc);}
   p.aux.snort=0.5+0.5*Math.sin(u*PI*6);
   p.aux.browUp=1;
 }else if(t<1.08){ // 응축
   var u=(t-0.9)/0.18;
   p.root.x=-30-8*Math.sin(u*PI);
   p.body.sx=1-0.10*Math.sin(u*PI); p.body.sy=1+0.08*Math.sin(u*PI);
   p.body.rot=-0.16;
 }else if(t<1.62){ // 부앙! 대시 — 스미어/잔상/먼지
   var u=(t-1.08)/0.54;
   p.root.x=lerp(-30,170,eI(Math.min(1,u*1.15)));
   p.body.sx=1.22; p.body.sy=0.85; p.body.rot=0.05;
   p.body.y=-104;
   p.aux.smear=Math.sin(Math.min(1,u*1.3)*PI);
   p.aux.ghost=1;
   for(var k in p.feet){p.feet[k].y=-6;p.feet[k].planted=false;}
   for(var i=0;i<MANE_N;i++){p.mane[i].rot=0.45;p.mane[i].sy=1.25;}
   p.aux.dust.push({x:p.root.x-110,y:0,a:0.5,r:16});
   p.aux.dust.push({x:p.root.x-160,y:-6,a:0.35,r:22});
 }else if(t<2.02){ // 급정지 미끄러짐
   var u=(t-1.62)/0.4;
   p.root.x=lerp(170,208,eO(u));
   p.body.sx=lerp(0.88,1.02,eO(u)); p.body.sy=lerp(1.14,0.99,eO(u));
   p.body.rot=lerp(0.14,0.02,eO(u));
   p.feet.FN.x=78; p.feet.BN.x=-38;
   p.aux.dust.push({x:p.root.x+50,y:0,a:0.55*(1-u),r:13});
   p.aux.dust.push({x:p.root.x+20,y:-4,a:0.4*(1-u),r:18});
 }else{ // 총총 복귀
   var u=(t-2.02)/(CHARGE_D-2.02);
   p.root.x=lerp(208,0,eIO(u));
   var hop=Math.abs(Math.sin(u*PI*3));
   p.root.y=-8*hop;
   p.body.sy=1+0.06*hop; p.body.sx=1-0.04*hop;
   for(var k2 in p.feet)p.feet[k2].planted=hop<0.25;
   p.aux.snort=u<0.25?1:0;
 }
 return p;
}
var HIT_D=0.8;
function poseHit(t){
 var p=defaultPose();
 t=clamp(t,0,HIT_D);
 var u=t/HIT_D;
 var k=Math.exp(-u*4.2);
 p.root.x=-26*Math.sin(Math.min(1,u*2.2)*PI)*1.2*(1-u*0.4);
 p.body.sx=1+0.20*Math.cos(u*22)*k;
 p.body.sy=1-0.18*Math.cos(u*22)*k;
 p.body.rot=-0.07*Math.sin(u*18)*k;
 p.aux.wince=k>0.25?1:0;
 p.aux.stars=k;
 for(var i=0;i<MANE_N;i++)p.mane[i].rot=0.3*Math.sin(u*20-i*0.5)*k;
 p.earN.rot=0.5*k; p.earF.rot=-0.4*k;
 p.aux.mouthOpen=k;
 return p;
}

// ==== 4. 죽음/부활 — 결정적 시뮬 (순수 함수: t → 상태) ========================
// 시퀀스: 경직(0~0.24) → 뿅!연기(0.24) → 조각 포물선+바운스 → 안착 → 반짝/김
var D_STUN=0.24, D_SPAWN=0.40, GRAV=1080;
var PIECE_KINDS=['ham','steak','sausage','ham','steak','ham','sausage'];
var PIECE_REST={ham:19,steak:11,sausage:11};
function makePieces(){
 var n=PIECE_KINDS.length,arr=[];
 for(var i=0;i<n;i++){
   var r1=rnd(i*7.13+2.1),r2=rnd(i*3.71+5.5),r3=rnd(i*9.29+1.3);
   arr.push({kind:PIECE_KINDS[i],
     x0:(i-(n-1)/2)*17, y0:-90-r2*26,
     vx:((i/(n-1))-0.5)*195+(r1-0.5)*46,
     vy:-(240+r2*170), w:(r3-0.5)*13, rot0:(r1-0.5)*1.4,
     s:0.82+r1*0.34, rest:0});
   arr[i].rest=PIECE_REST[arr[i].kind]*arr[i].s;
 }
 return arr;
}
var PIECES=makePieces();
function simPiece(p,t){ // t: 스폰 이후 경과. 절차 물리: 중력+바운스+회전 감쇠
 var x=p.x0,y=p.y0,vx=p.vx,vy=p.vy,rot=p.rot0,w=p.w;
 var floor=-p.rest,dt=1/120,bAmt=0,bAge=9,landed=false,landAt=0;
 var T=Math.min(t,3.2);
 for(var time=0;time<T;time+=dt){
   if(landed)break;
   vy+=GRAV*dt; x+=vx*dt; y+=vy*dt; rot+=w*dt; bAge+=dt;
   if(y>floor){ y=floor;
     if(vy>85){bAmt=clamp(vy/520,0.3,1);vy=-vy*0.46;vx*=0.5;w*=-0.5;bAge=0;}
     else{landed=true;landAt=time;vy=0;vx=0;}
   }
 }
 var pop=0.35+0.65*eO(clamp(t/0.22,0,1)); // 스폰 직후 뿅 스케일-인
 if(landed){
   var st=Math.min(t,3.2)-landAt+Math.max(0,t-3.2);
   var nr=rot%TAU; if(nr>PI)nr-=TAU; if(nr<-PI)nr+=TAU;
   rot=nr*Math.exp(-st*7);
   var sq=Math.max(0,1-st*8)*0.35;
   return {x:x,y:floor+p.rest*sq*0.5,rot:rot,sqx:1+sq,sqy:1-sq,landed:true,settleT:st,pop:1};
 }
 var sq2=Math.max(0,1-bAge*8)*0.4*bAmt;
 return {x:x,y:y,rot:rot,sqx:1+sq2,sqy:1-sq2,landed:false,settleT:0,pop:pop};
}
function simDeath(t){
 var st={stun:t<D_STUN,stunT:t,poofT:t<D_STUN?-1:(t-D_STUN),
         bodyGone:t>=D_STUN,pieces:[],sparkT:0};

 // 엄니 (주둥이 양옆, 주둥이보다 먼저)
 part(W.jaw,function(){

   g.save();g.translate(40,-8);g.scale(0.82,0.82);drawTusk(g,pal,false);g.restore();
 });
 part(W.snout,function(){drawSnout(g,pal,pose.aux,time,fire);});

// ==== 7. 배경 / 이펙트 =======================================================
function drawField(g,w,h,gy,off,time){
 var sky=g.createLinearGradient(0,0,0,gy);
 sky.addColorStop(0,'#bfe4f2');sky.addColorStop(0.8,'#e9f5da');
 g.fillStyle=sky;g.fillRect(0,0,w,gy);
 // 수풀 실루엣 2겹
 function bushes(y,rr,col,sp,seed){
   g.fillStyle=col;g.beginPath();g.moveTo(0,y+40);
   for(var x=-40;x<w+60;x+=sp){
     var r=rr*(0.7+0.6*rnd(Math.floor((x)/sp)+seed));
     g.arc(x,y,r,PI,0,false);
   }
   g.lineTo(w,y+60);g.lineTo(0,y+60);g.closePath();g.fill();
 }
 bushes(gy-6,46,'#b7dc99',95,11);
 bushes(gy+2,30,'#9ccf7e',70,77);
 // 잔디
 var gr=g.createLinearGradient(0,gy,0,h);
 gr.addColorStop(0,'#7ec850');gr.addColorStop(1,'#58a238');
 g.fillStyle=gr;g.fillRect(0,gy,w,h-gy);
 g.strokeStyle='#4f8f34';g.lineWidth=3;
 g.beginPath();g.moveTo(0,gy+1.5);g.lineTo(w,gy+1.5);g.stroke();
 // 풀포기 (걷기 스크롤과 동기)
 var sp=52;
 g.strokeStyle='#3f7d2b';g.lineWidth=2.4;g.lineCap='round';
 for(var x=-((off%sp)+sp);x<w+sp;x+=sp){
   var wi=Math.round((x+off)/sp);
   var r0=rnd(wi*3.7+1), yy=gy+14+r0*60;
   if(yy>h-4)continue;
   var s=0.8+r0*0.7;
   g.beginPath();
   g.moveTo(x,yy);g.quadraticCurveTo(x-3*s,yy-7*s,x-5*s,yy-11*s);
   g.moveTo(x,yy);g.quadraticCurveTo(x+1*s,yy-8*s,x,yy-13*s);
   g.moveTo(x,yy);g.quadraticCurveTo(x+4*s,yy-6*s,x+6*s,yy-10*s);
   g.stroke();
   if(rnd(wi*9.1+4)>0.8){ // 꽃
     g.fillStyle=rnd(wi*5.3)>0.5?'#fff6b8':'#ffd7e0';
     ell(g,x+10,yy-4,3.4,3.4);g.fill();
     g.fillStyle='#e8a33c';ell(g,x+10,yy-4,1.4,1.4);g.fill();
     g.fillStyle='#3f7d2b';
   }
 }
}
function drawPuff(g,x,y,t,scale){ // 뿅! 흰 연기 퍼프 (t 0..1)
 if(t<0||t>1)return;
 var n=8;
 for(var i=0;i<n;i++){
   var a=i/n*TAU+rnd(i*3.3)*0.8;
   var d=(22+66*eO(t))*(0.75+0.5*rnd(i*7.7))*scale;
   var r=(30*(1-t*0.55))*(0.7+0.55*rnd(i*5.1))*scale;
   g.globalAlpha=(1-t)*0.92;
   g.fillStyle=i%3?'#ffffff':'#f2f7ee';
   ell(g,x+Math.cos(a)*d,y+Math.sin(a)*d*0.8,r,r*0.92);g.fill();
 }
 g.globalAlpha=(1-t);
 g.fillStyle='#ffffff';ell(g,x,y,26*(1-t*0.6)*scale,24*(1-t*0.6)*scale);g.fill();
 g.globalAlpha=1;
}
function star4(g,x,y,r,rot){
 g.save();g.translate(x,y);g.rotate(rot||0);
 g.beginPath();
 for(var i=0;i<4;i++){
   var a=i/4*TAU-PI/2;
   g.lineTo(Math.cos(a)*r,Math.sin(a)*r);
   var a2=a+TAU/8;
   g.lineTo(Math.cos(a2)*r*0.38,Math.sin(a2)*r*0.38);
 }
 g.closePath();g.fill();g.restore();
}
function drawPopStars(g,x,y,t,scale){ // 별 팝
 if(t<0||t>1)return;
 for(var i=0;i<6;i++){
   var a=i/6*TAU+0.5, d=(30+95*eO(t))*scale;
   g.globalAlpha=1-t;
   g.fillStyle=i%2?'#ffd54a':'#fff2a8';
   star4(g,x+Math.cos(a)*d,y+Math.sin(a)*d*0.85,(10-6*t)*scale,t*3+i);
 }
 g.globalAlpha=1;
}
function drawSteam(g,x,y,time,i){ // 김 모락모락
 var ph=(time*0.55+rnd(i*13.7))%1;
 for(var k=0;k<2;k++){
   var p2=(ph+k*0.5)%1;
   var yy=y-8-p2*46, a=Math.sin(p2*PI)*0.5;
   g.strokeStyle='rgba(255,255,255,'+a.toFixed(3)+')';
   g.lineWidth=4.5;g.lineCap='round';
   g.beginPath();
   g.moveTo(x+Math.sin(p2*9+i)*5,yy+12);
   g.quadraticCurveTo(x+Math.sin(p2*9+i+1.4)*8,yy+4,x+Math.sin(p2*9+i+2.6)*5,yy-5);
   g.stroke();
 }
}
function drawSparkle(g,x,y,time,i){
 var tw=Math.max(0,Math.sin(time*2.6+rnd(i*7.1)*TAU));
 if(tw<0.05)return;
 g.globalAlpha=tw;g.fillStyle='#fffbe0';
 star4(g,x,y,5+6*tw,time+i);
 g.globalAlpha=1;
}
function drawSnort(g,W,st,amt){ // 콧김 (기본: 흰 김 / 불: 연기+불티)
 if(amt<=0.02)return;
 var fire=st.avatar==='fire';
 var n1=mpt(W.snout,-9,10), n2=mpt(W.snout,11,10);
 [n1,n2].forEach(function(p,idx){
   var dx=(idx?1:0.6);
   for(var k=0;k<2;k++){
     var u=clamp(amt-k*0.25,0,1);if(u<=0)return;
     g.globalAlpha=(1-u)*0.7;
     g.fillStyle=fire?'rgba(90,80,78,1)':'#ffffff';
     ell(g,p[0]+16*u*dx+6,p[1]+16*u+4,6+10*u,5+8*u);g.fill();
   }
   if(fire){
     g.globalAlpha=1-amt;
     g.fillStyle='#ffb054';
     ell(g,p[0]+22*amt,p[1]+10*amt,2.4,2.4);g.fill();
   }
 });
 g.globalAlpha=1;
}
function drawDusts(g,rootM,dust){
 dust.forEach(function(d){
   g.globalAlpha=d.a;
   g.fillStyle='#e8dcbb';
   var p=mpt(rootM,d.x,d.y);
   ell(g,p[0],p[1]-4,d.r,d.r*0.7);g.fill();
   ell(g,p[0]-d.r*0.9,p[1]-2,d.r*0.6,d.r*0.45);g.fill();
 });
 g.globalAlpha=1;
}

// ==== 8. 뼈대 오버레이 =======================================================
function drawBones(g,pose,W){
 g.save();
 g.globalAlpha=0.95;
 function seg(a,b,col){g.strokeStyle=col;g.lineWidth=3;g.lineCap='round';
   g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke();}
 function joint(p,col,r){g.fillStyle=col;ell(g,p[0],p[1],r||5,r||5);g.fill();
   g.strokeStyle='#0b1e08';g.lineWidth=1.5;g.stroke();}
 var rootP=mpt(W.root,0,0), bodyP=mpt(W.body,0,0);
 // 지면
 g.strokeStyle='rgba(255,80,80,0.8)';g.lineWidth=1.6;g.setLineDash([7,6]);
 g.beginPath();g.moveTo(rootP[0]-190,rootP[1]);g.lineTo(rootP[0]+190,rootP[1]);g.stroke();
 g.setLineDash([]);
 seg(rootP,bodyP,'#59ff8a');
 [['snout','#59ff8a'],['jaw','#59ff8a'],['earN','#7ad9ff'],['earF','#7ad9ff'],['tail','#7ad9ff']]
 .forEach(function(it){seg(bodyP,mpt(W[it[0]],0,0),it[1]);joint(mpt(W[it[0]],0,0),'#ffe25a',4.5);});
 W.mane.forEach(function(m){
   var a=mpt(m.M,0,0),b=mpt(m.M,0,-30);
   seg(a,b,'#ffa04a');joint(a,'#ffe25a',3.4);
 });
 for(var k in W.legs){
   var L=W.legs[k];
   seg(L.hip,L.foot,'#59ff8a');
   joint(L.hip,'#ffe25a',5);
   // 접지 락 표시
   if(L.planted){g.strokeStyle='#ff5a5a';g.lineWidth=2.4;
     g.beginPath();g.arc(L.foot[0],L.foot[1],9,0,TAU);g.stroke();}
   joint(L.foot,L.planted?'#ff8a8a':'#ffe25a',4.5);
 }
 joint(bodyP,'#ff5aff',6.5);
 joint(rootP,'#ffffff',5.5);
 g.restore();
}

// ==== 9. 씬 합성 — 상태 → 한 프레임 (실시간/몽타주 공용) ======================
// st={anim,t,avatar,time,showBones,groundOff,camX,scale,gyFrac,noBg,alpha}
function animPose(st){
 switch(st.anim){
   case 'walk':return poseWalk(st.t);
   case 'charge':return poseCharge(st.t);
   case 'hit':return poseHit(st.t);
   default:return poseIdle(st.t);
 }
}
function drawScene(g,w,h,st){
 var gy=h*(st.gyFrac||0.76);
 var s=st.scale||h/560;
 var off=(st.groundOff||0)*s;
 if(!st.noBg)drawField(g,w,h,gy,off,st.time||0);
 g.save();
 g.translate(w/2+(st.camX||0),gy);
 g.scale(s,s);
 if(st.alpha!==undefined)g.globalAlpha=st.alpha;
 if(st.anim==='death'||st.anim==='dead'){
   var dt2=st.anim==='dead'?st.t+2.6:st.t;
   var ds=simDeath(dt2);
   if(!ds.bodyGone){ // 경직: 부들부들 + 흰 플래시
     var p=poseHit(0.06);
     p.body.sx=1.06+0.05*Math.sin(dt2*70);p.body.sy=0.95-0.04*Math.sin(dt2*70);
     var W0=solve(p);
     drawMonster(g,p,W0,st);
     g.globalAlpha=0.4*Math.max(0,1-dt2/0.14);
     g.save();g.transform(W0.body[0],W0.body[1],W0.body[2],W0.body[3],W0.body[4],W0.body[5]);
     pathBlob(g);g.fillStyle='#ffffff';g.fill();g.restore();g.globalAlpha=1;
   }
   var fire=st.avatar==='fire';
   ds.pieces.forEach(function(q,i){
     // 조각 그림자
     g.fillStyle='rgba(30,60,22,0.25)';
     var hgt=clamp((-q.y-PIECES[i].rest)/120,0,1);
     ell(g,q.x,3,26*PIECES[i].s*(1-hgt*0.4)*q.pop,6*(1-hgt*0.4));g.fill();
     drawPiece(g,PIECES[i].kind,fire,q.x,q.y,q.rot,q.sqx,q.sqy,PIECES[i].s*q.pop);
     if(q.landed&&q.settleT>0.25){
       if(fire)drawSteam(g,q.x,q.y-PIECES[i].rest,st.time||dt2,i);
       drawSparkle(g,q.x+14,q.y-PIECES[i].rest-8,(st.time||dt2)+i,i);
       if(i%2)drawSparkle(g,q.x-16,q.y-6,(st.time||dt2)+i*1.7+1,i+9);
     }
   });
   if(ds.poofT>=0){
     drawPuff(g,0,-96,ds.poofT/0.62,1.5);
     drawPopStars(g,0,-96,ds.poofT/0.75,1.2);
   }
 }else if(st.anim==='revive'){
   var rs=simRevive(st.t);
   var fire2=st.avatar==='fire';
   rs.pieces.forEach(function(q){
     var P=PIECES[q.kind];
     drawPiece(g,P.kind,fire2,q.x,q.y,q.rot,1,1,P.s*q.scale);
   });
   if(rs.bodyScale>0){
     var p3=poseIdle(0);
     p3.body.sx*=rs.bodyScale;p3.body.sy*=rs.bodyScale;
     p3.body.y=-108*rs.bodyScale-((rs.bodyScale-1)*40);
     var W3=solve(p3);
     drawMonster(g,p3,W3,st);
   }
   if(rs.poofT>=0){drawPuff(g,0,-96,rs.poofT/0.5,1.2);drawPopStars(g,0,-96,rs.poofT/0.6,1);}
 }else{
   var pose=animPose(st);
   var W=solve(pose);
   drawMonster(g,pose,W,st);
   drawDusts(g,W.root,pose.aux.dust);
   drawSnort(g,W,st,pose.aux.snort);
   if(pose.aux.scrape>0.1){
     var fp=W.legs.FN.foot;
     g.globalAlpha=pose.aux.scrape*0.6;g.fillStyle='#e8dcbb';
     ell(g,fp[0]-14,fp[1]-3,9,6);g.fill();g.globalAlpha=1;
   }
   if(pose.aux.smear>0.05){ // 대시 스피드라인
     g.strokeStyle='rgba(255,255,255,'+(0.6*pose.aux.smear).toFixed(2)+')';
     g.lineWidth=5;g.lineCap='round';
     for(var i=0;i<5;i++){
       var y2=-40-i*28+rnd(i*3.1)*18;
       g.beginPath();g.moveTo(pose.root.x-140,y2);g.lineTo(pose.root.x-260-i*14,y2);g.stroke();
     }
   }
   if(pose.aux.stars>0.05){ // 피격 별
     var bp=mpt(W.body,10,-130);
     for(var j=0;j<3;j++){
       var a3=(st.time||st.t)*4+j*TAU/3;
       g.globalAlpha=pose.aux.stars;g.fillStyle='#ffd54a';
       star4(g,bp[0]+Math.cos(a3)*44,bp[1]+Math.sin(a3)*12,9,a3);
     }
     g.globalAlpha=1;
   }
   // 불속성: 몸에서 피어오르는 불티
   if(st.avatar==='fire'){
     var tt=st.time||1;
     for(var ei=0;ei<5;ei++){
       var ph2=(tt*0.5+rnd(ei*11.3))%1;
       var ex=(rnd(ei*7.9)-0.5)*190+pose.root.x;
       var ey=-120-ph2*95;
       g.globalAlpha=Math.sin(ph2*PI)*0.85;
       g.fillStyle=ei%2?'#ffb054':'#ff7a3c';
       ell(g,ex+Math.sin(ph2*8+ei)*9,ey,2.6-ph2,2.6-ph2);g.fill();
     }
     g.globalAlpha=1;
   }
   // 불속성: 발걸음 불씨
   if(st.avatar==='fire'&&st.anim==='walk'){
     for(var k in W.legs){var L2=W.legs[k];
       if(L2.planted){
         var sp2=rnd(Math.floor((st.t*4+L2.foot[0])*1.7));
         g.globalAlpha=0.7;g.fillStyle='#ff9e46';
         ell(g,L2.foot[0]+ (sp2-0.5)*18,L2.foot[1]-4-sp2*10,2.6,2.6);g.fill();
         g.globalAlpha=1;
       }}
   }
   if(st.showBones)drawBones(g,pose,W);
 }
 // 아바타 전환 뿅
 if(st.switchFx!==undefined&&st.switchFx>=0&&st.switchFx<1){
   drawPuff(g,0,-100,st.switchFx,1.3);
   drawPopStars(g,0,-100,st.switchFx,1.1);
 }
 g.restore();
}

 var IDLE_D=3.2,WALK_D=0.62;
 function setAnim(a){
   if(a==='revive'&&state.anim!=='dead'&&state.anim!=='death')return;
   if(a!=='revive'&&(state.anim==='death'||state.anim==='dead')&&a!=='death'){

   }

     b.classList.toggle('on',b.dataset.anim===a);});
 }
 document.querySelectorAll('#ui button[data-anim]').forEach(function(b){
   b.onclick=function(){setAnim(b.dataset.anim);};});
 document.getElementById('bAva').onclick=function(){
   state.avatar=state.avatar==='base'?'fire':'base';
   state.switchFx=0;
   this.textContent='아바타: '+(state.avatar==='base'?'기본':'불속성');

 }
 addEventListener('resize',resize);resize();
 var last=performance.now();
 function frame(now){
   var dt=Math.min(0.05,(now-last)/1000)*state.speed;last=now;
   state.time+=dt;state.modeT+=dt;
   if(state.switchFx>=0){state.switchFx+=dt*2.4;if(state.switchFx>=1)state.switchFx=-1;}
   var st={avatar:state.avatar,showBones:state.showBones,time:state.time,
     switchFx:state.switchFx,groundOff:0};
   if(state.anim==='idle'){state.phase=(state.phase+dt/IDLE_D)%1;st.anim='idle';st.t=state.phase;}
   else if(state.anim==='walk'){
     state.phase=(state.phase+dt/WALK_D)%1;
     state.walkDist+=dt/WALK_D*STRIDE/DUTY;
     st.anim='walk';st.t=state.phase;st.groundOff=state.walkDist;
   }
   else if(state.anim==='charge'){st.anim='charge';st.t=state.modeT;

   else if(state.anim==='death'){st.anim='death';st.t=state.modeT;
     if(state.modeT>2.6){state.anim='dead';state.modeT=0;}}

   else if(state.anim==='revive'){st.anim='revive';st.t=state.modeT;
     if(state.modeT>REV_D){setAnim('idle');st.anim='idle';st.t=0;state.phase=0;}}
   var d=window.devicePixelRatio||1;
   ctx.setTransform(d,0,0,d,0,0);
   drawScene(ctx,innerWidth,innerHeight,st);

 }
