<script>
"use strict";
// ============================================================================
// ==== 섹션 맵 ====
// ==== 0. 에러 핸들러 / 유틸 ====
// ==== 1. 팔레트 ====
// ==== 2. 리그 (뼈대 상수 · 2본 IK · solve) ====
// ==== 3. 애니 (pose 순수함수: idle/walk/swing/jump/joy) ====
// ==== 4. 렌더 (배경 · 얼굴 · 머리 · 몸 · 아바타 드로잉 세트 · 무기 · 이펙트 · 뼈대) ====
// ==== 5. UI / 라이브 루프 ====
// ==== 6. 몽타주 ====
// ============================================================================

// ==== 0. 에러 핸들러 / 유틸 ====
function showErr(m){var e=document.getElementById('err');e.style.display='block';e.textContent+=m+"\n";}
window.onerror=function(msg,src,ln){showErr("ERR: "+msg+" @"+ln);return false;};
window.addEventListener('unhandledrejection',function(ev){showErr("REJ: "+ev.reason);});

var TAU=Math.PI*2;
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function lerp(a,b,t){return a+(b-a)*t;}
function seg01(t,a,b){return clamp((t-a)/(b-a),0,1);}
function ease(t){t=clamp(t,0,1);return t*t*(3-2*t);}
function easeOut(t){t=clamp(t,0,1);return 1-(1-t)*(1-t);}
function easeIn(t){t=clamp(t,0,1);return t*t;}
function hash(n){var x=Math.sin(n*127.1+31.7)*43758.5453;return x-Math.floor(x);}
function frac(x){return x-Math.floor(x);}
function dirv(a){return {x:Math.cos(a),y:Math.sin(a)};}
function rotv(dx,dy,a){var c=Math.cos(a),s=Math.sin(a);return {x:dx*c-dy*s,y:dx*s+dy*c};}

// 부드러운 닫힌 블롭 경로 (중점 quadratic)
function blob(g,pts){
  var n=pts.length;
  g.beginPath();
  g.moveTo((pts[0][0]+pts[n-1][0])/2,(pts[0][1]+pts[n-1][1])/2);
  for(var i=0;i<n;i++){var p=pts[i],q=pts[(i+1)%n];
    g.quadraticCurveTo(p[0],p[1],(p[0]+q[0])/2,(p[1]+q[1])/2);}
  g.closePath();
}
// 테이퍼 캡슐 (팔다리)
function limb(g,x1,y1,x2,y2,r1,r2,fill,line,lw){
  var a=Math.atan2(y2-y1,x2-x1);
  g.beginPath();
  g.arc(x1,y1,r1,a+Math.PI/2,a-Math.PI/2);
  g.arc(x2,y2,r2,a-Math.PI/2,a+Math.PI/2);
  g.closePath();
  if(fill){g.fillStyle=fill;g.fill();}
  if(line){g.strokeStyle=line;g.lineWidth=lw||LW;g.lineJoin='round';g.stroke();}
}
function ell(g,x,y,rx,ry,fill,line,lw){
  g.beginPath();g.ellipse(x,y,rx,ry,0,0,TAU);
  if(fill){g.fillStyle=fill;g.fill();}
  if(line){g.strokeStyle=line;g.lineWidth=lw||LW;g.stroke();}
}
function star5(g,x,y,R,r,rot){
  g.beginPath();
  for(var i=0;i<10;i++){var a=rot+i*Math.PI/5-Math.PI/2,rr=(i%2===0)?R:r;
    if(i===0)g.moveTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);
    else g.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}
  g.closePath();
}
function heartP(g,x,y,s){
  g.beginPath();
  g.moveTo(x,y+s*0.9);
  g.bezierCurveTo(x-s*1.3,y-s*0.1,x-s*0.7,y-s*1.0,x,y-s*0.35);
  g.bezierCurveTo(x+s*0.7,y-s*1.0,x+s*1.3,y-s*0.1,x,y+s*0.9);
  g.closePath();
}
function sparkle4(g,x,y,r,rot){
  g.beginPath();
  for(var i=0;i<8;i++){var a=rot+i*Math.PI/4,rr=(i%2===0)?r:r*0.3;
    if(i===0)g.moveTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);
    else g.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}
  g.closePath();
}

// ==== 1. 팔레트 ====
var LW=2.1;                                   // 치비: 굵고 균일한 외곽선
var LINE='#47262e';
var SKIN={base:'#ffe4cd',shade:'#f0b493',blush:'rgba(255,120,110,0.42)'};
var HAIR={base:'#f2582e',dark:'#c23a1d',hi:'#ffa763',line:'#5c2012'};
var EYE={top:'#8a3c12',mid:'#f09030',low:'#ffde85',pupil:'#3d1d0a',line:'#38202b'};
var PIRATE={
  key:'pirate',name:'해적',ahoge:true,stock:false,
  bandana:'#2f6fd8',bandanaDk:'#2151a8',skull:'#f7f9ff',
  scarf:'#e8453c',scarfDk:'#b52f2c',
  top:'#fdfdff',topShade:'#d9dde8',trim:'#2f6fd8',
  denim:'#5677b5',denimDk:'#41598c',denimHi:'#7f9bd8',
  belt:'#7a4a2a',buckle:'#eab84c',
  bootC:'#8a5a34',bootDk:'#6b4226',bootCuff:'#a87243',
  blade:'#c9d3de',bladeDk:'#9aa6b6',bladeHi:'#eef3f9',guard:'#e0b054',gripc:'#7a4a2c',
  armCol:'#ffe4cd',wrist:'#e8453c'
};
var MAGE={
  key:'mage',name:'마법사',ahoge:false,stock:true,
  hat:'#6d4bc7',hatDk:'#523697',hatBand:'#f2b64a',
  robe:'#8a63e0',robeDk:'#6a48b8',cape:'#5d3fae',capeDk:'#4a3190',
  starc:'#ffd75e',
  stockA:'#6d4bc7',stockB:'#ece6fa',
  bootC:'#3a2a6e',bootDk:'#2b1f52',bootCuff:'#f2b64a',
  staff:'#8a5a34',staffDk:'#6b4226',gem:'#7ef0e8',gemDk:'#38b8ae',
  armCol:'#8a63e0',wrist:'#f2b64a'
};

// ==== 2. 리그 (뼈대 상수 · 2본 IK · solve) ====
// 캐릭터 로컬 좌표: 지면 y=0, 위가 -y (캔버스 y+아래). 전신 ~125유닛, 머리 ~52 (2.5등신).
var CH={
  torso:18, neckLen:7, headLen:24,       // pelvis→chest, chest→neck, neck→머리중심
  shX:12, thigh:18.5, shin:18.5,
  upperArm:13.5, foreArm:13.5,
  hipX:7, ankleH:3.5
};
// 2본 해석 IK: root→target, 길이 l1/l2, bend=±1 굽힘 방향. 중간관절 반환.
function ik2(ax,ay,tx,ty,l1,l2,bend){
  var dx=tx-ax,dy=ty-ay,d=Math.hypot(dx,dy);
  d=clamp(d,Math.abs(l1-l2)+0.01,l1+l2-0.01);
  var a1=Math.acos(clamp((l1*l1+d*d-l2*l2)/(2*l1*d),-1,1));
  var ang=Math.atan2(dy,dx)+bend*a1;
  return {x:ax+Math.cos(ang)*l1,y:ay+Math.sin(ang)*l1};
}
// pose → 관절 좌표(J). 순수함수.
function solve(P){
  var J={};
  var px=P.px,py=P.py,lean=P.lean;
  J.pelvis={x:px,y:py};
  var r1=rotv(0,-CH.torso,lean);
  J.chest={x:px+r1.x,y:py+r1.y};
  var r2=rotv(0,-CH.neckLen,lean*1.15);
  J.neck={x:J.chest.x+r2.x,y:J.chest.y+r2.y};
  var hA=lean*1.2+P.headAng;
  var r3=rotv(P.headDX,-CH.headLen+P.headDY,hA);
  J.head={x:J.neck.x+r3.x,y:J.neck.y+r3.y,ang:hA};
  var sL=rotv(-CH.shX,1,lean),sR=rotv(CH.shX,1,lean);
  J.shL={x:J.chest.x+sL.x,y:J.chest.y+sL.y};
  J.shR={x:J.chest.x+sR.x,y:J.chest.y+sR.y};
  J.hipL={x:px-CH.hipX,y:py+2};
  J.hipR={x:px+CH.hipX,y:py+2};
  function legIK(hip,f){
    var ank={x:f.x,y:f.y-CH.ankleH};
    return {knee:ik2(hip.x,hip.y,ank.x,ank.y,CH.thigh,CH.shin,P.kneeBend),ank:ank};
  }
  var lg=legIK(J.hipL,P.lFoot);J.kneeL=lg.knee;J.ankL=lg.ank;
  var rg=legIK(J.hipR,P.rFoot);J.kneeR=rg.knee;J.ankR=rg.ank;
  // 손 IK — 오른손은 무기 그립에 용접, both면 왼손도 그립
  var d=dirv(P.grip.ang);
  var hr={x:P.grip.x+d.x*2.5,y:P.grip.y+d.y*2.5};
  var hl=P.grip.both?{x:P.grip.x-d.x*5.5,y:P.grip.y-d.y*5.5}:P.lHand;
  J.handL=hl;J.handR=hr;
  J.elbL=ik2(J.shL.x,J.shL.y,hl.x,hl.y,CH.upperArm,CH.foreArm,P.elbBendL);
  J.elbR=ik2(J.shR.x,J.shR.y,hr.x,hr.y,CH.upperArm,CH.foreArm,P.elbBendR);
  J.weapon={x:P.grip.x,y:P.grip.y,ang:P.grip.ang};
  return J;
}

// ==== 3. 애니 (pose 순수함수) ====
var PERIODS={idle:3.0,walk:0.62,swing:2.2,jump:1.6,joy:0.95};
function blinkAt(time){
  var iv=3.3,segN=Math.floor(time/iv),r=hash(segN);
  var start=segN*iv+0.6+r*2.2,b=0,dd=time-start;
  if(dd>0&&dd<0.13)b=Math.sin(Math.PI*dd/0.13);
  if(hash(segN+7)>0.72){var d2=time-start-0.19;if(d2>0&&d2<0.13)b=Math.max(b,Math.sin(Math.PI*d2/0.13));}
  return b;
}
function basePose(time){
  return {
    px:0,py:-40,lean:0,headAng:0,headDX:0,headDY:0,
    sx:1,sy:1,spinSx:1,headSx:1,headSy:1,
    earWig:0,tailD1:0,tailD2:0,tailD3:0,tailSpread:0,
    blink:blinkAt(time),eyes:'open',eyeLX:0,eyeLY:0,
    mouth:'smile',browUp:0,browAng:0,
    lFoot:{x:-8,y:0,ang:0,planted:true},rFoot:{x:8,y:0,ang:0,planted:true},
    lHand:{x:-14,y:-36},
    grip:{x:14,y:-36,ang:-2.0,both:false,layer:'back'},
    kneeBend:-1,elbBendL:1,elbBendR:-1,
    fx:[]
  };
}
function poseIdle(t,time,P){
  var w=Math.sin(TAU*t);
  P.py=-40+1.5*w;P.sy=1+0.022*w;P.sx=1-0.016*w;
  P.lean=0.03*Math.sin(TAU*t+1.3);
  P.headAng=0.05*Math.sin(TAU*t+2.1);
  P.tailD1=0.12*Math.sin(TAU*t-0.9);
  P.tailD2=0.17*Math.sin(TAU*t-1.6);
  P.tailD3=0.22*Math.sin(TAU*t-2.3);
  P.earWig=0.3*Math.sin(time*11)*Math.pow(Math.max(0,Math.sin(time*0.83)),6);
  P.eyeLX=2.0*Math.tanh(2*Math.sin(time*0.4+1.7)*Math.sin(time*0.9));
  if(hash(Math.floor(time/4.1))>0.5)P.mouth='cat';
  P.lHand={x:-14+0.3*w,y:-36+1.4*w};
  P.grip={x:14,y:-36+1.4*w,ang:-2.0+0.03*w,both:false,layer:'back'};
}
function poseWalk(t,time,P){
  var S=10.5;
  function foot(ph,x0){
    ph=frac(ph);
    var st=0.58;
    if(ph<st){var u=ph/st;return {x:x0+lerp(S,-S,u),y:0,ang:0,planted:true};}
    var u2=(ph-st)/(1-st),e=ease(u2);
    return {x:x0+lerp(-S,S,e),y:-9*Math.sin(Math.PI*u2),ang:-0.5*Math.sin(Math.PI*u2),planted:false};
  }
  P.lFoot=foot(t,-5);P.rFoot=foot(t+0.5,5);
  var b=Math.cos(TAU*2*t+0.6);
  P.py=-40+2.3*b;P.sy=1+0.05*b;P.sx=1-0.035*b;
  P.lean=0.13+0.02*b;
  P.headAng=-0.05+0.03*b;
  P.eyeLX=2.4;P.mouth='open';
  P.tailD1=0.13+0.28*Math.sin(TAU*2*t-1.1);
  P.tailD2=0.18+0.40*Math.sin(TAU*2*t-1.9);
  P.tailD3=0.20+0.52*Math.sin(TAU*2*t-2.6);
  P.earWig=0.15*Math.sin(TAU*2*t);
  P.lHand={x:-16+3*Math.sin(TAU*t+Math.PI),y:-48+2*b};
  P.grip={x:13+1.5*Math.sin(TAU*t),y:-37+1.8*b,ang:-2.1+0.08*b,both:false,layer:'back'};
}
function poseSwing(t,time,P){
  P.browAng=0.4;P.browUp=-1.2;P.mouth='grit';
  P.lFoot={x:-11,y:0,ang:0,planted:true};
  P.rFoot={x:11,y:0,ang:0,planted:true};
  var th,off=0,r=17,both=true,layer='front';
  if(t<0.18){var u=easeOut(seg01(t,0,0.18));      // 재기(예비동작)
    th=lerp(0.9,-2.45,u);off=lerp(-0.1,-0.55,u);r=lerp(16,15,u);
    P.lean=lerp(0,-0.30,u);P.py=lerp(-40,-37,u);
    P.sy=lerp(1,0.93,u);P.sx=lerp(1,1.05,u);
    P.tailD1=0.5*u;P.tailD2=0.7*u;P.tailD3=0.9*u;
    both=t>0.05;
  }else if(t<0.30){var u2=ease(seg01(t,0.18,0.30)); // 깊은 비틀림
    th=lerp(-2.45,-2.75,u2);off=lerp(-0.55,-0.7,u2);r=15;
    P.lean=lerp(-0.30,-0.42,u2);P.py=lerp(-37,-36,u2);
    P.sy=lerp(0.93,0.90,u2);P.sx=lerp(1.05,1.07,u2);
    P.tailD1=0.5+0.25*u2;P.tailD2=0.7+0.3*u2;P.tailD3=0.9+0.35*u2;
    P.eyes='grit';
  }else if(t<0.40){var u3=easeIn(seg01(t,0.30,0.40)); // 풀스윙 (급가속+스미어)
    th=lerp(-2.75,0.35,u3);off=lerp(-0.7,0.25,u3);r=lerp(15,21,u3);
    P.lean=lerp(-0.42,0.30,u3);P.py=lerp(-36,-40,u3);
    P.sy=lerp(0.90,1.04,u3);P.sx=lerp(1.07,0.98,u3);
    P.px=lerp(0,4,u3);
    P.tailD1=lerp(0.75,-0.9,u3);P.tailD2=lerp(1.0,-1.2,u3);P.tailD3=lerp(1.25,-1.5,u3);
    var wa0=th+off;
    P.fx.push({type:'smear',x:P.px,y:P.py-15,r0:45,r1:100,a0:-3.4,a1:wa0,al:0.5*u3+0.25});
    for(var i=0;i<4;i++){var aa=lerp(-3.2,wa0,(i+1)/5);
      P.fx.push({type:'star',x:P.px+Math.cos(aa)*88,y:P.py-15+Math.sin(aa)*88,r:5+2*hash(i),rot:aa,col:'#fff2a0',al:0.9*u3});}
  }else if(t<0.52){var u4=seg01(t,0.40,0.52);var sh=Math.sin(u4*40)*Math.exp(-6*u4); // 임팩트 홀드
    th=0.35+0.02*sh;off=lerp(0.25,0.1,u4);r=21;
    P.lean=0.30+0.03*sh;P.py=-39;P.px=5;
    P.sy=0.97;P.sx=1.02;P.eyes='grit';
    P.tailD1=-0.9+0.3*u4;P.tailD2=-1.2+0.4*u4;P.tailD3=-1.5+0.5*u4;
    var tip={x:P.px+Math.cos(th)*r+Math.cos(th+off)*88,y:P.py-15+Math.sin(th)*r+Math.sin(th+off)*88};
    if(u4<0.65){
      P.fx.push({type:'burst',x:tip.x,y:tip.y,r:18+24*u4,al:1-u4*1.3});
      P.fx.push({type:'ring',x:tip.x,y:tip.y,r:14+48*u4,al:0.9-u4});
    }
    for(var k=0;k<3;k++)P.fx.push({type:'star',x:tip.x+(hash(k+9)-0.5)*44,y:tip.y+(hash(k+3)-0.5)*44,r:4+3*hash(k+5),rot:k,col:'#ffe066',al:(1-u4)*0.9});
  }else if(t<0.78){var u5=ease(seg01(t,0.52,0.78));var thS=u5*TAU; // 관성 회전 (한 바퀴 비틀)
    var cs=Math.cos(thS);
    P.spinSx=cs>=0?Math.max(0.14,cs):Math.min(-0.14,cs);
    th=0.35;off=0.1;r=21;
    P.lean=0.08*Math.sin(thS*2);P.py=-39+1.5*Math.sin(thS);
    P.px=lerp(5,1,u5);
    P.eyes='dizzy';P.mouth='oh';P.browAng=0;P.browUp=0.8;
    P.lFoot={x:-9,y:-1.5*Math.abs(Math.sin(thS*2)),ang:0,planted:false};
    P.rFoot={x:9,y:-1.5*Math.abs(Math.sin(thS*2+1)),ang:0,planted:false};
    P.tailSpread=0.25;both=false;P.lHand={x:P.px-15,y:-44};
    P.tailD1=0.7*Math.sin(thS-0.5);P.tailD2=0.9*Math.sin(thS-1.0);P.tailD3=1.1*Math.sin(thS-1.5);
    for(var m=0;m<3;m++){var oa=thS*1.5+m*TAU/3;
      P.fx.push({type:'star',x:P.px+Math.cos(oa)*26,y:-96+Math.sin(oa)*8,r:4.5,rot:oa,col:'#ffe066',al:0.9});}
  }else{var u6=seg01(t,0.78,1);var e2=Math.exp(-4*u6),wob=Math.cos(11*u6); // 헤헤 복귀
    var gx=lerp(9,14,ease(u6)),gy=lerp(-30,-37,ease(u6)),ga=lerp(-0.9,-2.0,ease(u6));
    P.grip={x:gx,y:gy,ang:ga,both:false,layer:u6>0.4?'back':'front'};
    P.lean=0.2*e2*wob;P.py=-40+2.5*e2*Math.cos(11*u6+0.8);P.px=lerp(2,0,u6);
    P.sy=1+0.06*e2*wob;P.sx=1-0.05*e2*wob;
    P.eyes='happy';P.mouth='open';P.browUp=0;P.browAng=0;
    P.lHand={x:-14,y:-36};
    P.tailD1=0.5*e2*Math.cos(9*u6);P.tailD2=0.65*e2*Math.cos(9*u6-0.6);P.tailD3=0.8*e2*Math.cos(9*u6-1.2);
    return;
  }
  P.grip={x:P.px+Math.cos(th)*r,y:(P.py-15)+Math.sin(th)*r,ang:th+off,both:both,layer:layer};
}
function poseJump(t,time,P){
  var H=56;
  P.mouth='open';
  if(t<0.20){var u=ease(t/0.20);                     // 웅크림 (납작)
    P.py=-40+9*u;P.sy=1-0.20*u;P.sx=1+0.15*u;P.lean=0.14*u;
    P.lFoot={x:-11,y:0,ang:0,planted:true};P.rFoot={x:11,y:0,ang:0,planted:true};
    P.lHand={x:-18,y:P.py+6};
    P.grip={x:16,y:P.py+4,ang:-2.5,both:false,layer:'back'};
    P.eyes='open';P.eyeLY=1.5;P.tailD1=0.4*u;P.tailD2=0.55*u;P.tailD3=0.7*u;
  }else if(t<0.34){var u2=easeOut(seg01(t,0.20,0.34)); // 폴짝! (쭉 늘어남)
    P.py=lerp(-31,-40-H,u2);P.sy=lerp(0.80,1.16,u2);P.sx=lerp(1.15,0.90,u2);
    P.lean=lerp(0.14,-0.05,u2);
    P.lFoot={x:P.px-8,y:P.py+27,ang:0.5,planted:false};
    P.rFoot={x:P.px+8,y:P.py+29,ang:0.4,planted:false};
    P.lHand={x:-17,y:P.py-14};
    P.grip={x:15,y:P.py-13,ang:-2.4,both:false,layer:'back'};
    P.eyes='happy';P.tailD1=lerp(0.4,0.9,u2);P.tailD2=lerp(0.55,1.15,u2);P.tailD3=lerp(0.7,1.4,u2);
  }else if(t<0.62){var u3=seg01(t,0.34,0.62);           // 체공 (매달림)
    var arc=Math.sin(Math.PI*(0.5+0.5*u3));
    P.py=-40-H*lerp(1,0.92,1-arc);P.sy=lerp(1.16,1.0,ease(u3*2));P.sx=lerp(0.90,1.0,ease(u3*2));
    P.lFoot={x:P.px-8,y:P.py+26,ang:0.55,planted:false};
    P.rFoot={x:P.px+8,y:P.py+29,ang:0.4,planted:false};
    P.lHand={x:-18,y:P.py-16};
    P.grip={x:15,y:P.py-14,ang:-2.4,both:false,layer:'back'};
    P.eyes='happy';P.mouth='open';
    P.tailD1=0.9-0.3*u3;P.tailD2=1.15-0.35*u3;P.tailD3=1.4-0.4*u3;
    P.earWig=0.4;
    if(u3<0.4)P.fx.push({type:'sparkle',x:P.px+14,y:P.py-30,r:5,al:(0.4-u3)*2});
  }else if(t<0.74){var u4=easeIn(seg01(t,0.62,0.74));  // 낙하
    P.py=lerp(-40-H*0.92,-40,u4);P.sy=lerp(1.0,1.08,u4);P.sx=lerp(1.0,0.94,u4);
    P.lFoot={x:P.px-9,y:P.py+31,ang:0.2,planted:false};
    P.rFoot={x:P.px+9,y:P.py+32,ang:0.15,planted:false};
    P.lHand={x:-17,y:P.py-13};
    P.grip={x:15,y:P.py-11,ang:-2.3,both:false,layer:'back'};
    P.eyes='open';P.eyeLY=2;
    P.tailD1=-0.5*u4;P.tailD2=-0.7*u4;P.tailD3=-0.9*u4;
  }else if(t<0.85){var u5=seg01(t,0.74,0.85);var dip=Math.sin(Math.PI*u5); // 착지 스쿼시+먼지
    P.py=-40+7*dip;P.sy=1-0.24*dip;P.sx=1+0.19*dip;P.lean=0.06*dip;
    P.lFoot={x:-11,y:0,ang:0,planted:true};P.rFoot={x:11,y:0,ang:0,planted:true};
    P.lHand={x:-18,y:P.py+4};
    P.grip={x:16,y:P.py+2,ang:-2.4,both:false,layer:'back'};
    P.eyes='grit';P.mouth='grit';
    P.tailD1=-0.8*dip;P.tailD2=-1.0*dip;P.tailD3=-1.3*dip;
    if(u5<0.7){for(var i=0;i<5;i++){var s2=(i%2?1:-1);
      P.fx.push({type:'dust',x:s2*(12+u5*26+6*hash(i)),y:-3-6*hash(i+4)*u5,r:4+3*hash(i+2),al:(1-u5)*0.7});}}
  }else{var u6=seg01(t,0.85,1);var e3=Math.exp(-5*u6),wob2=Math.cos(12*u6); // 복원 쫀득
    P.py=-40+3*e3*wob2;P.sy=1+0.09*e3*wob2;P.sx=1-0.07*e3*wob2;
    P.lFoot={x:-9,y:0,ang:0,planted:true};P.rFoot={x:9,y:0,ang:0,planted:true};
    P.lHand={x:-14,y:-36};
    P.grip={x:14,y:-36,ang:-2.0,both:false,layer:'back'};
    P.eyes='happy';P.mouth='cat';
    P.tailD1=0.6*e3*wob2;P.tailD2=0.75*e3*Math.cos(12*u6-0.7);P.tailD3=0.9*e3*Math.cos(12*u6-1.3);
  }
}
function poseJoy(t,time,P){
  var air=t>0.12&&t<0.72,h=0;
  if(air)h=Math.sin(Math.PI*seg01(t,0.12,0.72));
  P.py=-40-26*h;
  if(t<=0.12){var u=Math.sin(Math.PI*t/0.12);P.sy=1-0.13*u;P.sx=1+0.10*u;P.py=-40+4*u;}
  else if(t>=0.72&&t<0.86){var u2=Math.sin(Math.PI*seg01(t,0.72,0.86));P.sy=1-0.17*u2;P.sx=1+0.13*u2;P.py=-40+5*u2;}
  else if(t>=0.86){var u3=seg01(t,0.86,1);var e4=Math.exp(-4*u3);P.sy=1+0.1*e4*Math.cos(10*u3);P.sx=1-0.08*e4*Math.cos(10*u3);}
  else {P.sy=1+0.08*h;P.sx=1-0.06*h;}
  if(air){
    P.lFoot={x:P.px-8,y:P.py+28,ang:0.5,planted:false};
    P.rFoot={x:P.px+8,y:P.py+30,ang:0.4,planted:false};
  }else{
    P.lFoot={x:-9,y:0,ang:0,planted:true};P.rFoot={x:9,y:0,ang:0,planted:true};
  }
  P.lean=0.04*Math.sin(TAU*t);
  P.headAng=0.1*Math.sin(TAU*t+1);
  P.eyes='star';P.mouth='open';P.earWig=0.35*Math.sin(TAU*2*t);
  P.tailD1=0.5*Math.sin(TAU*t-0.7)-0.3*h;P.tailD2=0.65*Math.sin(TAU*t-1.3)-0.4*h;P.tailD3=0.8*Math.sin(TAU*t-1.9)-0.5*h;
  P.lHand={x:-17,y:P.py-24};
  P.grip={x:9,y:P.py-40,ang:-1.85+0.25*Math.sin(TAU*t),both:false,layer:'back'};
  for(var i=0;i<3;i++){
    var ph=frac(time*0.7+i/3),sd=Math.floor(time*0.7+i/3);
    var hx=(hash(sd*3+i)-0.5)*84,hy=-62-58*ph;
    P.fx.push({type:(i%2?'heart':'star'),x:hx,y:hy,r:5+3*hash(sd+i),rot:ph*3,col:'#ffe066',al:Math.sin(Math.PI*ph)*0.95});
  }
  P.fx.push({type:'sparkle',x:26*Math.sin(time*2.1),y:-88+8*Math.sin(time*3.3),r:4.5,al:0.6+0.4*Math.sin(time*7)});
}
var POSES={idle:poseIdle,walk:poseWalk,swing:poseSwing,jump:poseJump,joy:poseJoy};
function pose(anim,t,time){
  t=frac(t);
  var P=basePose(time);
  POSES[anim](t,time,P);
  return P;
}

// ---- 4.1 배경 (밝은 낮: 하늘·뭉게구름·풀밭 언덕) ----
function drawBG(g,w,h,time,groundY){
  var sky=g.createLinearGradient(0,0,0,groundY);
  sky.addColorStop(0,'#5fbdf0');sky.addColorStop(0.65,'#a5dcf8');sky.addColorStop(1,'#e2f5ff');
  g.fillStyle=sky;g.fillRect(0,0,w,groundY);
  // 해 + 글로우
  var sx0=w*0.82,sy0=h*0.13;
  var glow=g.createRadialGradient(sx0,sy0,0,sx0,sy0,h*0.22);
  glow.addColorStop(0,'rgba(255,250,210,0.95)');glow.addColorStop(0.3,'rgba(255,244,180,0.45)');glow.addColorStop(1,'rgba(255,244,180,0)');
  g.fillStyle=glow;g.beginPath();g.arc(sx0,sy0,h*0.22,0,TAU);g.fill();
  g.fillStyle='#fff6c8';g.beginPath();g.arc(sx0,sy0,h*0.05,0,TAU);g.fill();
  // 구름 (천천히 흐름)
  g.fillStyle='rgba(255,255,255,0.93)';
  for(var i=0;i<5;i++){
    var cw2=w*0.16*(0.7+0.6*hash(i*13+2));
    var cx=frac(hash(i*7)+time*0.008*(0.5+hash(i)))* (w+cw2*2)-cw2;
    var cy=groundY*(0.1+0.42*hash(i*3+1));
    g.beginPath();
    g.ellipse(cx,cy,cw2*0.55,cw2*0.2,0,0,TAU);
    g.ellipse(cx-cw2*0.3,cy+cw2*0.05,cw2*0.3,cw2*0.14,0,0,TAU);
    g.ellipse(cx+cw2*0.3,cy+cw2*0.04,cw2*0.33,cw2*0.15,0,0,TAU);
    g.ellipse(cx+cw2*0.05,cy-cw2*0.1,cw2*0.32,cw2*0.17,0,0,TAU);
    g.fill();
  }
  // 언덕 2겹
  g.fillStyle='#a8dd7c';
  g.beginPath();g.moveTo(0,groundY);
  for(var x2=0;x2<=w;x2+=w/6)
    g.quadraticCurveTo(x2+w/12,groundY-h*0.09*(0.5+hash(Math.floor(x2/(w/6))+3)),x2+w/6,groundY);
  g.lineTo(w,groundY);g.closePath();g.fill();
  g.fillStyle='#7ecb5a';
  g.beginPath();g.moveTo(0,groundY+2);
  g.quadraticCurveTo(w*0.25,groundY-h*0.035,w*0.5,groundY+2);
  g.quadraticCurveTo(w*0.75,groundY-h*0.03,w,groundY+2);
  g.lineTo(w,h);g.lineTo(0,h);g.closePath();g.fill();
  // 풀·꽃
  for(var k=0;k<14;k++){
    var fx2=w*hash(k*17+5),fy=groundY+ (h-groundY)*(0.15+0.7*hash(k*11+9));
    if(hash(k)<0.55){
      g.strokeStyle='#569e3c';g.lineWidth=1.5;g.beginPath();
      g.moveTo(fx2-3,fy);g.lineTo(fx2-1,fy-6);g.moveTo(fx2,fy);g.lineTo(fx2,fy-8);g.moveTo(fx2+3,fy);g.lineTo(fx2+1,fy-6);g.stroke();
    }else{
      var fc=['#ffd8e6','#fff3b8','#ffffff'][k%3];
      for(var p2=0;p2<5;p2++){var pa=p2/5*TAU;
        g.fillStyle=fc;g.beginPath();g.arc(fx2+Math.cos(pa)*2.6,fy-5+Math.sin(pa)*2.6,1.8,0,TAU);g.fill();}
      g.fillStyle='#f2b64a';g.beginPath();g.arc(fx2,fy-5,1.6,0,TAU);g.fill();
    }
  }
}
// ---- 4.2 눈/입 (귀여움 코어) ----
function drawEye(g,x,y,s,P){
  var ew=7.4,eh=9.4,lookx=P.eyeLX*0.35,looky=P.eyeLY*0.35;
  g.save();g.translate(x,y);
  g.lineCap='round';g.lineJoin='round';
  if(P.eyes==='happy'||(P.eyes==='open'&&P.blink>0.78)){ // ∩ 활 모양
    g.strokeStyle=EYE.line;g.lineWidth=3;
    g.beginPath();g.moveTo(-ew+0.5,2.5);g.quadraticCurveTo(0,-5.5,ew-0.5,2.5);g.stroke();
    drawLashes(g,s,ew,1.5);
    g.restore();return;
  }
  if(P.eyes==='grit'){ // 힘주고 찡그림 — 납작 눈 + 사선 눈꺼풀
    g.save();g.scale(1,0.5);
    drawOpenEye(g,ew,eh,0,0.8,P);
    g.restore();
    g.strokeStyle=EYE.line;g.lineWidth=3;
    g.beginPath();g.moveTo(-ew,-3-s*1.5);g.lineTo(ew,-3+s*1.5);g.stroke();
    g.restore();return;
  }
  if(P.eyes==='dizzy'){ // @_@ 소용돌이
    g.strokeStyle=EYE.line;g.lineWidth=2;
    g.beginPath();
    for(var a=0;a<4.2*Math.PI;a+=0.25){var rr=0.6+a*1.1;
      var px2=Math.cos(a)*rr,py2=Math.sin(a)*rr*0.9;
      if(a===0)g.moveTo(px2,py2);else g.lineTo(px2,py2);}
    g.stroke();
    g.restore();return;
  }
  var bl=P.blink;
  g.scale(1,1-0.75*bl);
  drawOpenEye(g,ew,eh,lookx,looky,P);
  if(P.eyes==='star'){ // 반짝반짝
    star5(g,lookx-0.5,looky-1,4.6,1.9,0.12);
    g.fillStyle='#fff';g.fill();
  }
  // 윗눈꺼풀 (굵게) + 속눈썹
  g.strokeStyle=EYE.line;g.lineWidth=2.7;
  g.beginPath();g.moveTo(-ew*0.96,-2);g.quadraticCurveTo(0,-eh-1.2,ew*0.96,-2.4);g.stroke();
  drawLashes(g,s,ew,-3);
  // 쌍꺼풀 얇게
  g.strokeStyle='rgba(56,32,43,0.3)';g.lineWidth=1;
  g.beginPath();g.moveTo(-ew*0.6,-eh+0.4);g.quadraticCurveTo(0,-eh-2.6,ew*0.6,-eh+0.2);g.stroke();
  // 아랫라인 얇고 연하게 2/3
  g.strokeStyle='rgba(56,32,43,0.45)';g.lineWidth=1.3;
  g.beginPath();g.moveTo(-ew*0.55,eh-1);g.quadraticCurveTo(0,eh+0.4,ew*0.7,eh-1.8);g.stroke();
  g.restore();
}
function drawOpenEye(g,ew,eh,lookx,looky,P){
  g.beginPath();g.ellipse(0,0,ew,eh,0,0,TAU);
  g.fillStyle='#fff';g.fill();
  g.save();g.clip();
  // 홍채 3톤 세로 그라데이션
  var ig=g.createLinearGradient(0,-eh,0,eh);
  ig.addColorStop(0,EYE.top);ig.addColorStop(0.45,EYE.mid);ig.addColorStop(1,EYE.low);
  g.fillStyle=ig;
  g.beginPath();g.ellipse(lookx,looky+0.6,6.3,8.2,0,0,TAU);g.fill();
  // 동공
  g.fillStyle=EYE.pupil;
  g.beginPath();g.ellipse(lookx,looky+0.4,2.9,4.0,0,0,TAU);g.fill();
  // 아래 밝은 반사
  g.fillStyle='rgba(255,244,200,0.6)';
  g.beginPath();g.ellipse(lookx,looky+5.2,4.1,2.2,0,0,TAU);g.fill();
  // 하이라이트 큰 1 + 작은 2
  g.fillStyle='#fff';
  g.beginPath();g.arc(lookx-2.7,looky-3.6,2.9,0,TAU);g.fill();
  g.beginPath();g.arc(lookx+2.7,looky+3.0,1.5,0,TAU);g.fill();
  g.fillStyle='rgba(255,255,255,0.85)';
  g.beginPath();g.arc(lookx+3.4,looky-1.4,0.95,0,TAU);g.fill();
  g.restore();
}
function drawLashes(g,s,ew,y0){
  // 눈꼬리 바깥쪽 뾰족 속눈썹 2~3개
  g.fillStyle=EYE.line;
  for(var i=0;i<3;i++){
    var bx=s*(ew*0.55+i*ew*0.2),by=y0-i*1.6;
    g.beginPath();
    g.moveTo(bx,by+1.2);
    g.lineTo(bx+s*3.6,by-2.2-i*0.5);
    g.lineTo(bx+s*0.8,by-1.2);
    g.closePath();g.fill();
  }
}
function drawMouth(g,P){
  g.lineCap='round';g.lineJoin='round';
  var m=P.mouth;
  if(m==='smile'){
    g.strokeStyle=LINE;g.lineWidth=1.8;
    g.beginPath();g.moveTo(-3.5,15.4);g.quadraticCurveTo(0,17.6,3.5,15.4);g.stroke();
  }else if(m==='cat'){
    g.strokeStyle=LINE;g.lineWidth=1.8;
    g.beginPath();g.moveTo(-4.4,15.2);g.quadraticCurveTo(-2.2,18.2,0,15.6);g.quadraticCurveTo(2.2,18.2,4.4,15.2);g.stroke();
  }else if(m==='open'){
    blob(g,[[-4.6,15],[4.6,15],[3.4,19.6],[-3.4,19.6]]);
    g.fillStyle='#93353c';g.fill();g.strokeStyle=LINE;g.lineWidth=1.6;g.stroke();
    g.save();g.clip();
    g.fillStyle='#ef8a8b';g.beginPath();g.ellipse(0,20,3.4,2.3,0,0,TAU);g.fill();
    g.restore();
  }else if(m==='grit'){
    blob(g,[[-4.8,15.2],[4.8,15.2],[4.4,17.8],[-4.4,17.8]]);
    g.fillStyle='#93353c';g.fill();g.strokeStyle=LINE;g.lineWidth=1.5;g.stroke();
    g.fillStyle='#fff';g.fillRect(-4,15.7,8,1.2);
  }else if(m==='oh'){
    ell(g,0,16.4,2.2,2.9,'#93353c',LINE,1.5);
  }
  // 아랫입술 그림자 1획
  g.strokeStyle='rgba(240,180,147,0.55)';g.lineWidth=1.2;
  g.beginPath();g.moveTo(-2.4,20.6);g.quadraticCurveTo(0,21.6,2.4,20.6);g.stroke();
}
// ---- 4.3 머리카락 ----
function drawHairBack(g,J,P){
  g.save();g.translate(J.head.x,J.head.y);g.rotate(J.head.ang);g.scale(P.headSx,P.headSy);
  // 뒷머리 실루엣 (두상보다 살짝 크게)
  blob(g,[[-29,-9],[-27,9],[-15,24],[0,27],[15,24],[27,9],[29,-9],[17,-25],[0,-28],[-17,-25]]);
  g.fillStyle=HAIR.base;g.fill();g.strokeStyle=HAIR.line;g.lineWidth=LW+0.3;g.lineJoin='round';g.stroke();
  // 목덜미 그림자 톤
  g.save();g.clip();
  g.fillStyle='rgba(150,40,20,0.35)';
  g.beginPath();g.ellipse(0,20,24,12,0,0,TAU);g.fill();
  g.restore();
  // 낮은 사이드 트윈테일 ×2 (스프링 지연 체인 3마디)
  for(var s=-1;s<=1;s+=2)drawTail(g,s,P);
  g.restore();
}
function drawTail(g,s,P){
  var ax=s*26,ay=9;
  var L=[15,13,12],R=[7.5,6,4.2];
  var a1=Math.PI/2+s*(0.62+P.tailSpread)+P.tailD1;
  var a2=a1+s*0.22+(P.tailD2-P.tailD1);
  var a3=a2+s*0.26+(P.tailD3-P.tailD2);
  var p0={x:ax,y:ay};
  var p1={x:p0.x+Math.cos(a1)*L[0],y:p0.y+Math.sin(a1)*L[0]};
  var p2={x:p1.x+Math.cos(a2)*L[1],y:p1.y+Math.sin(a2)*L[1]};
  var p3={x:p2.x+Math.cos(a3)*L[2],y:p2.y+Math.sin(a3)*L[2]};
  limb(g,p0.x,p0.y,p1.x,p1.y,R[0],R[1]+1,HAIR.base,HAIR.line,LW);
  limb(g,p1.x,p1.y,p2.x,p2.y,R[1]+1,R[2]+1,HAIR.base,HAIR.line,LW);
  limb(g,p2.x,p2.y,p3.x,p3.y,R[2]+1,2.6,HAIR.base,HAIR.line,LW);
  // 뾰족 끝
  var tip={x:p3.x+Math.cos(a3)*9,y:p3.y+Math.sin(a3)*9};
  g.beginPath();
  g.moveTo(p3.x+Math.cos(a3+Math.PI/2)*2.6,p3.y+Math.sin(a3+Math.PI/2)*2.6);
  g.quadraticCurveTo(p3.x+Math.cos(a3)*5,p3.y+Math.sin(a3)*5,tip.x,tip.y);
  g.quadraticCurveTo(p3.x+Math.cos(a3)*5,p3.y+Math.sin(a3)*5,
    p3.x+Math.cos(a3-Math.PI/2)*2.6,p3.y+Math.sin(a3-Math.PI/2)*2.6);
  g.closePath();
  g.fillStyle=HAIR.base;g.fill();g.strokeStyle=HAIR.line;g.lineWidth=LW;g.stroke();
  // 하이라이트 줄기
  g.strokeStyle=HAIR.hi;g.lineWidth=2.2;g.lineCap='round';
  g.beginPath();
  g.moveTo(p0.x+Math.cos(a1)*4-s*2.5,p0.y+Math.sin(a1)*4);
  g.quadraticCurveTo(p1.x-s*3,p1.y,p2.x-s*2,p2.y);
  g.stroke();
  // 머리끈
  ell(g,ax,ay-1,4.6,4.6,'#ffd75e',HAIR.line,1.8);
  g.fillStyle='rgba(255,255,255,0.55)';
  g.beginPath();g.arc(ax-1.4,ay-2.6,1.4,0,TAU);g.fill();
}

  g.quadraticCurveTo(-11,-4,-17,7);

  var a=Math.atan2(y2-y1,x2-x1);

  g.arc(x2,y2,r2,a-Math.PI/2,a+Math.PI/2);
  g.closePath();
  g.fillStyle=av.stockA;g.fill();
  g.save();g.clip();

    g.lineTo(cx-Math.cos(a+Math.PI/2)*rr,cy-Math.sin(a+Math.PI/2)*rr);

  g.fillStyle=this.robeDk;
  g.beginPath();g.moveTo(-17,5.4);g.quadraticCurveTo(0,12.4,17,5.4);g.lineTo(17,13);g.lineTo(-17,13);g.closePath();g.fill();
  g.fillStyle=this.robeDk;g.globalAlpha=0.5;g.fillRect(-16,-20,5,32);g.globalAlpha=1;
  star5(g,6,-2,3,1.3,0.4);g.fillStyle=this.starc;g.fill();
  star5(g,-7,2.5,2.4,1,1.3);g.fill();
  g.restore();
  // 흰 칼라 + 리본
  g.fillStyle='#f4efff';g.strokeStyle=LINE;g.lineWidth=1.7;
  blob(g,[[-8,-19.5],[8,-19.5],[5,-15],[0,-13.6],[-5,-15]]);
  g.fill();g.stroke();
  g.fillStyle=this.hatBand;
  heartP(g,0,-16,2.6);g.fill();g.stroke();
  g.restore();
};
MAGE.hat=function(g,P){ // 챙 큰 보라 마녀모자 (끝 꺾임)
  var tilt=P.tailD1*0.3;
  g.save();g.rotate(tilt*0.4);
  // 크라운 (원뿔)
  g.beginPath();
  g.moveTo(-17,-19);
  g.quadraticCurveTo(-10,-40,-1,-48);
  g.quadraticCurveTo(4,-51,3,-46);
  g.quadraticCurveTo(9,-33,17,-19);
  g.closePath();
  g.fillStyle=this.hat;g.fill();g.strokeStyle=LINE;g.lineWidth=LW+0.2;g.lineJoin='round';g.stroke();
  // 꺾인 끝
  g.beginPath();
  g.moveTo(-2.5,-46);
  g.quadraticCurveTo(0,-54,10+P.tailD2*6,-56);
  g.quadraticCurveTo(16+P.tailD3*8,-56.5,14,-51);
  g.quadraticCurveTo(10,-46.5,3.5,-45.5);
  g.closePath();
  g.fillStyle=this.hatDk;g.fill();g.stroke();
  // 밴드 + 별 버클
  g.fillStyle=this.hatBand;
  g.beginPath();g.moveTo(-15.5,-24);g.quadraticCurveTo(0,-29.5,15.5,-24);g.lineTo(14,-19.5);g.quadraticCurveTo(0,-24.5,-14,-19.5);g.closePath();
  g.fill();g.strokeStyle=LINE;g.lineWidth=1.7;g.stroke();
  star5(g,0,-24.5,3.6,1.5,0);g.fillStyle='#fff3c8';g.fill();g.stroke();
  // 챙 (타원)
  g.beginPath();g.ellipse(0,-16.5,35,9.5,0.02,0,TAU);
  g.fillStyle=this.hat;g.fill();g.strokeStyle=LINE;g.lineWidth=LW+0.2;g.stroke();
  g.save();g.clip();
  g.fillStyle=this.hatDk;
  g.beginPath();g.ellipse(0,-13.5,35,7,0,0,Math.PI);g.fill();
  g.restore();
  g.restore();
};
MAGE.weapon=function(g,x,y,ang,P){ // 별 지팡이 (보석 발광)
  g.save();g.translate(x,y);g.rotate(ang);
  limb(g,-14,0,66,0,2.8,2.2,this.staff,LINE,1.9);
  g.strokeStyle=this.staffDk;g.lineWidth=1.1;
  g.beginPath();g.moveTo(-10,-1);g.lineTo(58,-0.6);g.stroke();
  ell(g,-15,0,3,3,this.hatBand,LINE,1.6);
  // 발광 보석 + 금별
  var gl=g.createRadialGradient(76,0,2,76,0,26);
  gl.addColorStop(0,'rgba(126,240,232,0.85)');gl.addColorStop(0.4,'rgba(255,231,120,0.35)');gl.addColorStop(1,'rgba(255,231,120,0)');
  g.fillStyle=gl;g.beginPath();g.arc(76,0,26,0,TAU);g.fill();
  star5(g,76,0,15,6.3,-ang);
  g.fillStyle='#ffd75e';g.fill();g.strokeStyle=LINE;g.lineWidth=2;g.lineJoin='round';g.stroke();
  ell(g,76,0,4.6,4.6,this.gem,LINE,1.6);
  g.fillStyle='rgba(255,255,255,0.85)';
  g.beginPath();g.arc(74.6,-1.4,1.6,0,TAU);g.fill();
  // 작은 리본
  g.fillStyle='#f2b64a';
  g.beginPath();g.moveTo(56,2);g.quadraticCurveTo(52,8+P.tailD2*5,47,10+P.tailD3*7);g.quadraticCurveTo(53,7,56,4.6);g.closePath();g.fill();
  g.restore();
};
// ---- 4.8 이펙트 ----
function drawFX(g,list){
  for(var i=0;i<list.length;i++){
    var f=list[i],al=clamp(f.al===undefined?1:f.al,0,1);
    if(al<=0)continue;
    g.save();g.globalAlpha=al;g.lineJoin='round';
    if(f.type==='smear'){
      var grd=g.createRadialGradient(f.x,f.y,f.r0,f.x,f.y,f.r1);
      grd.addColorStop(0,'rgba(255,255,255,0)');
      grd.addColorStop(0.6,'rgba(255,255,255,0.4)');
      grd.addColorStop(1,'rgba(255,240,160,0.05)');
      g.beginPath();
      g.arc(f.x,f.y,f.r1,f.a0,f.a1,false);
      g.arc(f.x,f.y,f.r0,f.a1,f.a0,true);
      g.closePath();
      g.fillStyle=grd;g.fill();
      g.strokeStyle='rgba(255,255,255,0.75)';g.lineWidth=2.2;
      g.beginPath();g.arc(f.x,f.y,(f.r0+f.r1)/2,f.a0+0.15,f.a1,false);g.stroke();
    }else if(f.type==='star'){
      star5(g,f.x,f.y,f.r,f.r*0.42,f.rot||0);
      g.fillStyle=f.col||'#ffe066';g.fill();
      g.strokeStyle='rgba(120,80,0,0.5)';g.lineWidth=1;g.stroke();
    }else if(f.type==='ring'){
      g.strokeStyle='#ffffff';g.lineWidth=3;
      g.beginPath();g.arc(f.x,f.y,f.r,0,TAU);g.stroke();
    }else if(f.type==='burst'){
      sparkle4(g,f.x,f.y,f.r,0.3);
      g.fillStyle='#fff8c8';g.fill();
      g.strokeStyle='#ffd23e';g.lineWidth=2;g.stroke();
      sparkle4(g,f.x,f.y,f.r*0.5,0.3+Math.PI/4);
      g.fillStyle='#ffffff';g.fill();
    }else if(f.type==='dust'){
      ell(g,f.x,f.y,f.r,f.r*0.8,'#efe9da','rgba(120,110,90,0.4)',1.2);
    }else if(f.type==='heart'){
      heartP(g,f.x,f.y,f.r);
      g.fillStyle='#ff7ba3';g.fill();
      g.strokeStyle='#d84a7e';g.lineWidth=1.3;g.stroke();
    }else if(f.type==='sparkle'){
      sparkle4(g,f.x,f.y,f.r,f.rot||0);
      g.fillStyle='#ffffff';g.fill();
      g.strokeStyle='rgba(255,215,94,0.8)';g.lineWidth=1;g.stroke();
    }else if(f.type==='puff'){
      ell(g,f.x,f.y,f.r,f.r,'rgba(255,255,255,0.92)','rgba(180,190,210,0.6)',1.5);
    }
    g.restore();
  }
}
function drawShadow(g,P){
  var off=Math.max(0,-(P.py+40));
  var k=clamp(1-off/130,0.35,1);
  g.fillStyle='rgba(40,90,40,'+(0.22*k)+')';
  g.beginPath();g.ellipse(P.px,0.5,23*k*P.sx,5.5*k,0,0,TAU);g.fill();
}
// ---- 4.9 캐릭터 조립 (아바타 = draw 콜백 세트 스왑) ----
function renderChar(g,P,av,opt){
  opt=opt||{};
  var J=solve(P);
  drawShadow(g,P);
  g.save();
  // 전신 스쿼시&스트레치 (지면 기준 스케일 채널)
  g.translate(P.px,0);g.scale(P.sx*P.spinSx,P.sy);g.translate(-P.px,0);
  if(opt.alpha!==undefined)g.globalAlpha=opt.alpha;
  av.back(g,J,P);
  drawHairBack(g,J,P);
  if(P.grip.layer==='back')av.weapon(g,J.weapon.x,J.weapon.y,J.weapon.ang,P);
  drawArm(g,J.shL,J.elbL,J.handL,av,-1);
  drawLeg(g,J.hipL,J.kneeL,J.ankL,P.lFoot,av);
  drawLeg(g,J.hipR,J.kneeR,J.ankR,P.rFoot,av);
  drawNeck(g,J);
  av.torso(g,J,P);
  drawHead(g,J,P,av);
  drawArm(g,J.shR,J.elbR,J.handR,av,1);
  if(P.grip.layer==='front'){
    av.weapon(g,J.weapon.x,J.weapon.y,J.weapon.ang,P);
    drawMitt(g,J.handR,av);
    if(P.grip.both)drawMitt(g,J.handL,av);
  }
  g.globalAlpha=1;
  if(opt.bones)drawBones(g,J,P);
  g.restore();
  drawFX(g,P.fx);
  return J;
}
// ---- 4.10 뼈대 오버레이 (본 · IK 타깃 · 접지 락 · 스쿼시) ----
function drawBones(g,J,P){
  g.save();g.lineCap='round';
  var links=[['pelvis','chest'],['chest','neck'],['neck','head'],
    ['chest','shL'],['chest','shR'],
    ['shL','elbL'],['elbL','handL'],['shR','elbR'],['elbR','handR'],
    ['pelvis','hipL'],['pelvis','hipR'],
    ['hipL','kneeL'],['kneeL','ankL'],['hipR','kneeR'],['kneeR','ankR']];
  g.strokeStyle='rgba(0,229,255,0.95)';g.lineWidth=1.7;
  for(var i=0;i<links.length;i++){
    var a=J[links[i][0]],b=J[links[i][1]];
    g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();
  }
  // 머리 본 (원)
  g.beginPath();g.arc(J.head.x,J.head.y,6,0,TAU);g.stroke();
  g.beginPath();g.moveTo(J.head.x,J.head.y);
  g.lineTo(J.head.x+Math.sin(J.head.ang)*10,J.head.y-Math.cos(J.head.ang)*10);g.stroke();
  // 관절 점
  g.fillStyle='#fff';
  var names=['pelvis','chest','neck','head','shL','shR','elbL','elbR','handL','handR','hipL','hipR','kneeL','kneeR','ankL','ankR'];
  for(var k=0;k<names.length;k++){var j2=J[names[k]];
    g.beginPath();g.arc(j2.x,j2.y,2.1,0,TAU);g.fill();}
  // IK 타깃 (발) — X 마커 + 접지 락
  var feet=[[P.lFoot,J.ankL],[P.rFoot,J.ankR]];
  for(var m=0;m<2;m++){
    var ft=feet[m][0];
    g.strokeStyle='#ff4081';g.lineWidth=1.8;
    g.beginPath();
    g.moveTo(ft.x-4,ft.y-CH.ankleH-4);g.lineTo(ft.x+4,ft.y-CH.ankleH+4);
    g.moveTo(ft.x+4,ft.y-CH.ankleH-4);g.lineTo(ft.x-4,ft.y-CH.ankleH+4);
    g.stroke();
    if(ft.planted){
      g.strokeStyle='#4dff6d';g.lineWidth=2;
      g.strokeRect(ft.x-6,-2.6,12,5.2);
    }
  }
  // 무기 그립 IK 타깃
  g.strokeStyle='#ffb020';g.lineWidth=1.8;
  g.beginPath();g.arc(J.weapon.x,J.weapon.y,4.6,0,TAU);g.stroke();
  g.beginPath();g.moveTo(J.weapon.x,J.weapon.y);
  g.lineTo(J.weapon.x+Math.cos(J.weapon.ang)*17,J.weapon.y+Math.sin(J.weapon.ang)*17);g.stroke();
  // 스쿼시 스케일 기즈모 (골반): 실선=현재 스케일, 점선=기준 원
  g.strokeStyle='#ffe14d';g.lineWidth=1.6;
  g.beginPath();g.ellipse(J.pelvis.x,J.pelvis.y,11,11,0,0,TAU);g.stroke();
  g.setLineDash([2.5,2.5]);
  var isx=clamp(1/Math.max(0.2,Math.abs(P.sx*P.spinSx)),0.3,3),isy=clamp(1/P.sy,0.3,3);
  g.beginPath();g.ellipse(J.pelvis.x,J.pelvis.y,11*isx,11*isy,0,0,TAU);g.stroke();
  g.setLineDash([]);
  g.restore();
}
