// ==== 0. 에러 핸들러 / 유틸 ====
function showErr(m){var e=document.getElementById('err');e.style.display='block';e.textContent+=m+"\n";}
window.onerror=function(msg,src,ln){showErr("ERR: "+msg+" @"+ln);return false;};
window.addEventListener('unhandledrejection',function(ev){showErr("REJ: "+ev.reason);});

var TAU=Math.PI*2;
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function lerp(a,b,t){return a+(b-a)*t;}
function seg01(t,a,b){return clamp((t-a)/(b-a),0,1);}
function ease(t){t=clamp(t,0,1);return t*t*(3-2*t);}
function easeOut(t){t=clamp(t,0,1);return 1-(1-t)*(1-t);}
function easeIn(t){t=clamp(t,0,1);return t*t;}
function hash(n){var x=Math.sin(n*127.1+31.7)*43758.5453;return x-Math.floor(x);}
function dirv(a){return {x:Math.cos(a),y:Math.sin(a)};}

// 부드러운 닫힌 블롭 경로 (중점 quadratic)
function blob(g,pts){
  var n=pts.length;
  g.beginPath();
  g.moveTo((pts[0][0]+pts[n-1][0])/2,(pts[0][1]+pts[n-1][1])/2);
  for(var i=0;i<n;i++){var p=pts[i],q=pts[(i+1)%n];
    g.quadraticCurveTo(p[0],p[1],(p[0]+q[0])/2,(p[1]+q[1])/2);}
  g.closePath();
}
// 테이퍼 캡슐 (팔다리)
function limb(g,x1,y1,x2,y2,r1,r2,fill,line,lw){
  var a=Math.atan2(y2-y1,x2-x1);
  g.beginPath();
  g.arc(x1,y1,r1,a+Math.PI/2,a-Math.PI/2);
  g.arc(x2,y2,r2,a-Math.PI/2,a+Math.PI/2);
  g.closePath();
  if(fill){g.fillStyle=fill;g.fill();}
  if(line){g.strokeStyle=line;g.lineWidth=lw||LW;g.stroke();}
}
function star5(g,x,y,R,r,rot){
  g.beginPath();
  for(var i=0;i<10;i++){var a=rot+i*Math.PI/5-Math.PI/2,rr=(i%2===0)?R:r;
    if(i===0)g.moveTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);
    else g.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}
  g.closePath();
}
function heartP(g,x,y,s){
  g.beginPath();
  g.moveTo(x,y+s*0.9);
  g.bezierCurveTo(x-s*1.3,y-s*0.1,x-s*0.7,y-s*1.0,x,y-s*0.35);
  g.bezierCurveTo(x+s*0.7,y-s*1.0,x+s*1.3,y-s*0.1,x,y+s*0.9);
  g.closePath();
}
function sparkle4(g,x,y,r,rot){
  g.beginPath();
  for(var i=0;i<8;i++){var a=rot+i*Math.PI/4,rr=(i%2===0)?r:r*0.32;
    if(i===0)g.moveTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);
    else g.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}
  g.closePath();
}

// ==== 1. 팔레트 ====
