<style>

 #panel{position:fixed;right:14px;top:14px;width:212px;background:rgba(18,14,28,.88);border:1px solid rgba(138,118,232,.25);border-radius:10px;padding:12px 14px;z-index:10;color:#cfc6ec;font-size:12px;backdrop-filter:blur(4px)}

 #exprs button{background:#1e1830;color:#cfc6ec;border:1px solid rgba(138,118,232,.3);border-radius:5px;padding:4px 8px;margin:0 4px 4px 0;font-size:12px;cursor:pointer;font-family:inherit}
 #exprs button.on{background:#4a3a8c;color:#fff;border-color:#8a76e8}
 .srow{display:flex;align-items:center;margin:3px 0}
 .srow label{width:56px;color:#9a90bc;font-size:11px}

 <div class="hint">캔버스 위에서 마우스를 움직이면 고개와 시선이 따라옵니다. 슬라이더를 드래그하는 동안은 수동 제어.</div>

<canvas id="cv"></canvas>
<script>
'use strict';
// ============================================================
// ==== 섹션 맵 ================================================
// 1. 팔레트·유틸        2. 텍스처 페인트(아트 코어: 얼굴/눈/머리)
// 3. 레이어·메시 리그    4. 디포머 (파라미터 → 정점 변형)
// 5. 애니 (스프링/깜빡임/표정/호흡)   6. 렌더 (배경/위스프/씬)
// 7. UI·입력            8. 몽타주 (?montage 동기 렌더)   9. 부트
// ============================================================
var errBox=document.getElementById('err');
window.onerror=function(m,s,l,c){errBox.textContent+='ERR: '+m+' @'+l+':'+c+'\n';return false};
window.addEventListener('unhandledrejection',function(e){errBox.textContent+='REJ: '+e.reason+'\n'});

// ==== 1. 팔레트 · 유틸 ====
var C={
 line:'#1a1520',
 skin:'#f6e8dc', skinSh:'#d8c4bc', skinSh2:'#c4a8a4', blush:'#efab9e',
 hair:'#241d2e', hairF:'#2a2236', hairSh:'#141019', hairRim:'#8a76e8', hairHi:'#b3a6f0',
 iris:'#e8b34a', irisHi:'#f6d98a', irisDk:'#7d4d16',
 coat:'#171420', coatSh:'#0e0b16', silver:'#c9ccd6', silverDk:'#878ca0',
 crimson:'#7e2231', crimsonHi:'#a53347',
 white:'#f8f2e8', bg:'#0d0a14', ember:'#7c5cff', ember2:'#b39aff'
};
var TAU=Math.PI*2;
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function lerp(a,b,t){return a+(b-a)*t}
function ease(t){return t*t*(3-2*t)}
function rng(seed){var s=seed>>>0;return function(){s=(s+0x6D2B79F5)|0;var t=Math.imul(s^(s>>>15),1|s);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
// 캐릭터 공간: 1000 × 1150. 머리중심 (500,405), 목 피벗 (500,585)
var CW=1000, CH=1150, HCX=500, HCY=405, NKX=500, NKY=585;

// ==== 2. 텍스처 페인트 (아트 코어) ====
// 테이퍼 머리카락 가닥: 2차 베지어 중심선 + 폭 감쇠 → 닫힌 도형
function strandPts(p,w0,w1,k){
 var N=16,L=[],R=[],i,t,mt,x,y,dx,dy,dl,w;
 w1=w1==null?0.7:w1; k=k==null?0.8:k;
 for(i=0;i<=N;i++){t=i/N;mt=1-t;
  x=mt*mt*p[0]+2*mt*t*p[2]+t*t*p[4]; y=mt*mt*p[1]+2*mt*t*p[3]+t*t*p[5];
  dx=2*(mt*(p[2]-p[0])+t*(p[4]-p[2])); dy=2*(mt*(p[3]-p[1])+t*(p[5]-p[3]));
  dl=Math.hypot(dx,dy)||1; w=w0*Math.pow(1-t,k)+w1*t;
  L.push(x-dy/dl*w,y+dx/dl*w); R.push(x+dy/dl*w,y-dx/dl*w);}
 return [L,R,N];
}
function strandPath(g,p,w0,w1,k){
 var s=strandPts(p,w0,w1,k),L=s[0],R=s[1],N=s[2],i;
 g.beginPath(); g.moveTo(L[0],L[1]);
 for(i=1;i<=N;i++)g.lineTo(L[i*2],L[i*2+1]);
 for(i=N;i>=0;i--)g.lineTo(R[i*2],R[i*2+1]);
 g.closePath();
}
function strandSideStroke(g,p,w0,w1,k){ // 뿌리 캡 없이 양측 엣지만 스트로크
 var s=strandPts(p,w0,w1,k),L=s[0],R=s[1],N=s[2],i;
 g.beginPath(); g.moveTo(L[0],L[1]);
 for(i=1;i<=N;i++)g.lineTo(L[i*2],L[i*2+1]);
 for(i=N;i>=0;i--)g.lineTo(R[i*2],R[i*2+1]);
 g.stroke();
}
function softEllipse(g,x,y,rx,ry,col,a){
 var gr=g.createRadialGradient(x,y,0,x,y,Math.max(rx,ry));
 gr.addColorStop(0,col); gr.addColorStop(1,'rgba(0,0,0,0)');
 g.save(); g.globalAlpha=a; g.translate(x,y); g.scale(1,ry/rx); g.translate(-x,-y);
 g.fillStyle=gr; g.beginPath(); g.arc(x,y,rx,0,TAU); g.fill(); g.restore();
}
// 두상: 계란형 + V라인 턱
function headPath(g){
 g.beginPath();
 g.moveTo(500,557);
 g.bezierCurveTo(481,554,450,537,433,506);   // 좌 턱→볼 (V라인)
 g.bezierCurveTo(415,477,404,452,400,424);   // 좌 볼→관자
 g.bezierCurveTo(395,390,396,356,406,326);   // 좌 관자→이마
 g.bezierCurveTo(421,286,454,264,500,263);   // 좌상 두정
 g.bezierCurveTo(546,264,579,286,594,326);   // 우상
 g.bezierCurveTo(604,356,605,390,600,424);
 g.bezierCurveTo(596,452,585,477,567,506);
 g.bezierCurveTo(550,537,519,554,500,557);
 g.closePath();
}
// 눈 기하: side s=-1(뷰어 좌), +1(뷰어 우). 아몬드 2.2:1, 눈꼬리 살짝 올림
function eyeGeo(s){
 var ex=500+s*59, ey=415;
 return {ex:ex,ey:ey, inx:ex-s*34,iny:ey+8, outx:ex+s*36,outy:ey-7,
  tcx:ex+s*1,tcy:ey-19, bcx:ex-s*2,bcy:ey+16.5};
}
// 눈꺼풀 개구부 샘플 폴리곤 (위 커브 + 아래 커브)
function apPoly(s){
 var e=eyeGeo(s),pts=[],i,t,mt;
 for(i=0;i<=10;i++){t=i/10;mt=1-t;
  pts.push([mt*mt*e.inx+2*mt*t*e.tcx+t*t*e.outx, mt*mt*e.iny+2*mt*t*e.tcy+t*t*e.outy]);}
 for(i=1;i<=10;i++){t=i/10;mt=1-t;
  pts.push([mt*mt*e.outx+2*mt*t*e.bcx+t*t*e.inx, mt*mt*e.outy+2*mt*t*e.bcy+t*t*e.iny]);}
 return pts;
}
function tracePoly(g,pts){g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(var i=1;i<pts.length;i++)g.lineTo(pts[i][0],pts[i][1]);g.closePath()}
// 얼굴 베이스
function paintFace(g){
 headPath(g); g.fillStyle=C.skin; g.fill();
 g.save(); headPath(g); g.clip();
 var gr=g.createLinearGradient(0,380,0,560);
 gr.addColorStop(0,'rgba(216,196,188,0)'); gr.addColorStop(1,'rgba(216,196,188,.26)');
 g.fillStyle=gr; g.fillRect(360,300,280,280);
 // 이마 헤어 캐스트 섀도 (은은히)
 softEllipse(g,500,300,118,40,'rgba(200,176,196,1)',.12);
 // 눈꼬리 쪽 아주 옅은 쿨섀도
 softEllipse(g,412,408,16,8,'rgba(190,160,200,1)',.13);
 softEllipse(g,588,408,16,8,'rgba(190,160,200,1)',.13);
 // 볼 혈색: 작고 옅게 + 사선 하이라이트 2획 (애니식)
 softEllipse(g,447,463,19,8.5,'#f6b8be',.17);
 softEllipse(g,553,463,19,8.5,'#f6b8be',.17);
 g.strokeStyle='rgba(244,168,176,.30)'; g.lineWidth=1.7; g.lineCap='round';
 [[438,468,450,458],[448,470,460,460],[540,460,552,468],[550,458,562,466]].forEach(function(q){
  g.beginPath(); g.moveTo(q[0],q[1]); g.lineTo(q[2],q[3]); g.stroke();});
 softEllipse(g,500,458,8,5,'#f6b8be',.12);
 // 턱밑 셀셰이딩 1톤
 g.fillStyle='rgba(216,196,188,.5)';
 g.beginPath(); g.moveTo(468,540); g.quadraticCurveTo(500,566,532,540);
 g.quadraticCurveTo(500,552,468,540); g.closePath(); g.fill();
 g.restore();
 // 귀
 [-1,1].forEach(function(s){
  var x=500+s*106,y=436;
  g.beginPath(); g.moveTo(x,y-16);
  g.bezierCurveTo(x+s*16,y-20,x+s*20,y+2,x+s*11,y+18);
  g.bezierCurveTo(x+s*6,y+26,x-s*2,y+26,x-s*3,y+16); g.closePath();
  g.fillStyle=C.skin; g.fill(); g.strokeStyle=C.line; g.lineWidth=2.4; g.lineJoin='round'; g.stroke();
  g.beginPath(); g.moveTo(x+s*10,y-8); g.quadraticCurveTo(x+s*13,y+4,x+s*5,y+10);
  g.strokeStyle='rgba(180,140,140,.7)'; g.lineWidth=1.6; g.stroke();
  softEllipse(g,x+s*6,y+4,9,11,C.blush,.22);
 });
 // 코: 콧대 생략, 코끝 짧은 획 + 점그림자
 g.strokeStyle='rgba(88,58,66,.6)'; g.lineWidth=1.8; g.lineCap='round';
 g.beginPath(); g.moveTo(504,448); g.quadraticCurveTo(505,455,500,458); g.stroke();
 softEllipse(g,499,461,5.5,2.6,'rgba(198,158,156,1)',.35);
 // 외곽선 (실루엣 굵게)
 headPath(g); g.strokeStyle=C.line; g.lineWidth=3.4; g.lineJoin='round'; g.stroke();
}
// 흰자 + 아래 속눈썹 + 눈매 그림자
function paintEyeWhite(g,s){
 var p=apPoly(s), e=eyeGeo(s);
 tracePoly(g,p); g.fillStyle=C.white; g.fill();
 g.save(); tracePoly(g,p); g.clip();
 // 윗꺼풀이 드리우는 소켓 그림자
 var gr=g.createLinearGradient(0,e.ey-16,0,e.ey-2);
 gr.addColorStop(0,'rgba(150,120,150,.55)'); gr.addColorStop(1,'rgba(150,120,150,0)');
 g.fillStyle=gr; g.fillRect(e.ex-40,e.ey-20,80,22);
 g.restore();
 // 아래 라인: 얇고 연하게 바깥 2/3만
 g.beginPath(); g.moveTo(e.ex-s*10,e.ey+14.5);
 g.quadraticCurveTo(e.ex+s*16,e.ey+12,e.outx-s*1,e.outy+3);
 g.strokeStyle='rgba(70,48,66,.6)'; g.lineWidth=2.2; g.lineCap='round'; g.stroke();
 // 눈물샘 핑크 틱
 g.beginPath(); g.arc(e.inx-s*1,e.iny-1,2.2,0,TAU); g.fillStyle='rgba(230,150,150,.5)'; g.fill();
}
// 홍채: 3톤 세로 그라데이션 + 동공 + 링 + 하이라이트 2
function paintIris(g,s){
 var e=eyeGeo(s), cx=e.ex, cy=e.ey+2, rx=13.6, ry=17;
 g.save(); g.translate(cx,cy); g.scale(rx/ry,1); g.translate(-cx,-cy);
 var gr=g.createLinearGradient(0,cy-ry,0,cy+ry);
 gr.addColorStop(0,C.irisDk); gr.addColorStop(.45,C.iris); gr.addColorStop(1,C.irisHi);
 g.beginPath(); g.arc(cx,cy,ry,0,TAU); g.fillStyle=gr; g.fill();
 g.lineWidth=2; g.strokeStyle='rgba(60,34,10,.85)'; g.stroke(); // 림발 링
 // 하단 밝은 링 하이라이트
 g.beginPath(); g.arc(cx,cy,ry*.62,Math.PI*.15,Math.PI*.85);
 g.strokeStyle='rgba(246,217,138,.9)'; g.lineWidth=2.6; g.stroke();
 // 위 눈꺼풀 캐스트 어두운 띠
 g.beginPath(); g.arc(cx,cy-ry*.55,ry*.9,0,TAU); g.fillStyle='rgba(60,34,20,.30)'; g.fill();
 g.restore();
 // 동공 (세로 타원)
 g.save(); g.translate(cx,cy+1); g.scale(.6,1); g.translate(-cx,-(cy+1));
 g.beginPath(); g.arc(cx,cy+1,7,0,TAU); g.fillStyle='#231407'; g.fill(); g.restore();
 // 상단 큰 하이라이트 + 하단 작은 반사광 2
 g.beginPath(); g.ellipse(cx-4.6,cy-6.6,5.2,6.2,-.3,0,TAU); g.fillStyle='rgba(255,252,244,.97)'; g.fill();
 g.beginPath(); g.arc(cx+5,cy+9.2,2.4,0,TAU); g.fillStyle='rgba(255,240,200,.9)'; g.fill();
 g.beginPath(); g.arc(cx-1.5,cy+12.6,1.3,0,TAU); g.fillStyle='rgba(246,217,138,.75)'; g.fill();
}
// 윗속눈썹(굵게·뭉침) + 쌍꺼풀 라인
function paintLash(g,s){
 var e=eyeGeo(s),N=18,i,t,mt,x,y,dx,dy,dl,w,Lp=[],Rp=[];
 // 위 커브를 따라 아래로 두툼, 바깥쪽으로 갈수록 굵게
 for(i=0;i<=N;i++){t=i/N;mt=1-t;
  x=mt*mt*e.inx+2*mt*t*e.tcx+t*t*e.outx; y=mt*mt*e.iny+2*mt*t*e.tcy+t*t*e.outy;
  w=1.5+8.2*Math.pow(t,1.35)*(t<.92?1:(1-(t-.92)*8));
  if(w<0.5)w=0.5;
  Lp.push(x,y-w*0.35); Rp.push(x,y+w*0.65);}
 g.beginPath(); g.moveTo(Lp[0],Lp[1]);
 for(i=1;i<=N;i++)g.lineTo(Lp[i*2],Lp[i*2+1]);
 for(i=N;i>=0;i--)g.lineTo(Rp[i*2],Rp[i*2+1]);
 g.closePath(); g.fillStyle=C.line; g.fill();
 // 눈꼬리 뭉친 속눈썹 2가닥 (치켜올림 → 요염)
 strandPath(g,[e.outx-s*2,e.outy+1, e.outx+s*8,e.outy-4, e.outx+s*13,e.outy-9],2.6,.4,.9);
 g.fillStyle=C.line; g.fill();
 strandPath(g,[e.outx-s*4,e.outy+3, e.outx+s*7,e.outy+1, e.outx+s*11,e.outy-1],1.9,.3,.9);
 g.fill();
 // 안쪽 끝 가는 틱
 strandPath(g,[e.inx+s*2,e.iny-2, e.inx-s*3,e.iny-3, e.inx-s*5,e.iny-1],1.2,.3,.9); g.fill();
 // 쌍꺼풀 라인 (얇게)
 g.beginPath(); g.moveTo(e.inx+s*6,e.iny-9);
 g.quadraticCurveTo(e.tcx,e.tcy-6,e.outx-s*4,e.outy-6.5);
 g.strokeStyle='rgba(120,84,100,.55)'; g.lineWidth=1.4; g.lineCap='round'; g.stroke();
 // 속눈썹 위 은은한 보라 광
 g.beginPath(); g.moveTo(e.inx+s*8,e.iny-4);
 g.quadraticCurveTo(e.tcx,e.tcy+2.5,e.outx-s*5,e.outy-1);
 g.strokeStyle='rgba(179,166,240,.35)'; g.lineWidth=1.2; g.stroke();
}
// 눈썹: 얇고 긴 곡선, 눈보다 살짝 길게
function paintBrow(g,s){
 var ex=500+s*59;
 strandPath(g,[ex-s*33,388, ex+s*3,373.5, ex+s*44,385],2.1,.4,.55);
 g.fillStyle='#221a2b'; g.fill();
 g.save(); g.globalAlpha=.4; strandPath(g,[ex-s*33,390.5, ex+s*3,376, ex+s*44,387],.9,.3,.5);
 g.fillStyle=C.hairRim; g.fill(); g.restore();
}
// 입 텍스처 4종 (0기본 1미소 2진지 3놀람) — 공용 bbox (455~545, 480~540)
function paintMouth(g,idx){
 g.lineCap='round'; g.lineJoin='round';
 if(idx===3){ // 놀람: 작은 o
  g.beginPath(); g.ellipse(500,503,6,8,0,0,TAU); g.fillStyle='#5b2b34'; g.fill();
  g.beginPath(); g.ellipse(500,506,4.2,5,0,0,TAU); g.fillStyle='#3d1b23'; g.fill();
  g.beginPath(); g.ellipse(500,512,4.6,1.8,0,0,TAU); g.fillStyle='rgba(240,170,160,.6)'; g.fill();
  g.beginPath(); g.ellipse(500,496,5.4,1.6,0,0,TAU); g.fillStyle='rgba(140,80,90,.5)'; g.fill();
 }else{
  g.strokeStyle='#6d3a44'; g.lineWidth=2.4;
  g.beginPath();
  if(idx===1){ g.moveTo(479,498); g.quadraticCurveTo(500,508.5,521,495); }
  else if(idx===2){ g.moveTo(481,502); g.quadraticCurveTo(500,501,519,503); }
  else{ g.moveTo(481,500); g.quadraticCurveTo(500,505,519,500); }
  g.stroke();
  if(idx===1){ // 입꼬리 딤플
   g.beginPath(); g.arc(483,497.4,1.4,0,TAU); g.arc(517,495.4,1.4,0,TAU); g.fillStyle='rgba(109,58,68,.8)'; g.fill();
  }
  // 아랫입술 하이라이트
  g.beginPath(); g.moveTo(493,509); g.quadraticCurveTo(500,511.5,507,509);
  g.strokeStyle='rgba(255,235,225,.5)'; g.lineWidth=2; g.stroke();
 }
 // 아랫입술 밑 옅은 그림자 1획
 g.beginPath(); g.moveTo(494,517); g.quadraticCurveTo(500,519.5,506,517);

// ==== 4. 디포머: 파라미터 P -> 정점 (순수함수, 실시간/몽타주 공용) ====
var APH=35; // 눈 개구부 높이

 }else if(L.kind==='eyew'){
  var b2=side==='L'?P.blinkL:P.blinkR;
  y+=b2*APH*((1-nv)*.8-nv*.2);
 }else if(L.kind==='lash'){
  var b3=side==='L'?P.blinkL:P.blinkR;

  var lift=P.browLift[side]||0, tilt=P.browTilt[side]||0,

 }else if(L.kind==='ear'){
  var ax=612,ay=458,edx=x-ax,edy=y-ay,eca=Math.cos(P.earAng),esa=Math.sin(P.earAng);
  x=ax+edx*eca-edy*esa; y=ay+edx*esa+edy*eca;

 if(hf>0){
  var yawN=P.yaw/30, pitN=P.pitch/20, d=L.depth==null?.5:L.depth;
  x+=yawN*40*d*hf;
  y-=pitN*30*(d*.75+.12)*hf;
  var un=clamp((x0-HCX)/130,-1.3,1.3);
  x=HCX+(x-HCX)*(1+yawN*un*.055*hf);

function deformLayer(L,P){

}
// 텍스처 삼각형 렌더: clip + setTransform + drawImage. 0.65px 팽창으로 실금 방지
function drawMesh(ctx,L,P,view,alpha,tex){

      x0=out[t0*2]*s+ox,y0=out[t0*2+1]*s+oy,
      x1=out[t1*2]*s+ox,y1=out[t1*2+1]*s+oy,
      x2=out[t2*2]*s+ox,y2=out[t2*2+1]*s+oy,
      u0=verts[t0].u,v0=verts[t0].v,u1=verts[t1].u,v1=verts[t1].v,u2=verts[t2].u,v2=verts[t2].v,
      den=u0*(v1-v2)+u1*(v2-v0)+u2*(v0-v1);

  var cx=(x0+x1+x2)/3,cy=(y0+y1+y2)/3,EX=EXPAND,
      d0=Math.hypot(x0-cx,y0-cy)||1,d1=Math.hypot(x1-cx,y1-cy)||1,d2=Math.hypot(x2-cx,y2-cy)||1,

      e1x=x1+(x1-cx)/d1*EX,e1y=y1+(y1-cy)/d1*EX,
      e2x=x2+(x2-cx)/d2*EX,e2y=y2+(y2-cy)/d2*EX,

      c=(x0*(u2-u1)+x1*(u0-u2)+x2*(u1-u0))/den,
      e=x0-a*u0-c*v0,
      b=(y0*(v1-v2)+y1*(v2-v0)+y2*(v0-v1))/den,

       sw=Math.min(Math.max(u0,u1,u2)-su+28,tex.width-su),

}
function drawWire(ctx,L,P,view){

// ==== 5. 애니: 스프링 · 깜빡임 · 표정 · 호흡 ====
function Spring(k,d){this.x=0;this.v=0;this.k=k;this.d=d}

var EXPRS=[
 {name:'기본', m:0, lidL:.09,lidR:.09, blL:0,blR:0, btL:0,btR:0},

 {name:'진지', m:2, lidL:.1,lidR:.1, blL:-.1,blR:-.1, btL:1,btR:1},
 {name:'놀람', m:3, lidL:-.14,lidR:-.14, blL:1,blR:1, btL:-.3,btR:-.3},

var anim={

function stepAnim(dt,w,h,manual){
 var a=anim; a.t+=dt;

 var yT,pT,rT,exT,eyT;
 if(a.mouse.has&&a.mouse.idle<4){
  yT=clamp((a.mouse.x-.5)*2.4*30,-30,30);
  pT=clamp((.45-a.mouse.y)*2.6*20,-20,20);
  exT=clamp((a.mouse.x-.5)*3,-1,1);
  eyT=clamp((a.mouse.y-.45)*2.6,-1,1);

 if(manual.angleY!=null)pT=manual.angleY;

 if(manual.eyeY!=null)eyT=manual.eyeY;

// 흑염 위스프: 티어드롭 + additive 글로우

(function(){

 var view=liveView();
 ctx.setTransform(1,0,0,1,0,0);
 drawBG(ctx,cv.width,cv.height,anim.t);
 drawWisps(ctx,anim.t,view,false);
 renderScene(ctx,P,view,{mesh:meshOn});
 drawWisps(ctx,anim.t,view,true);
 // 슬라이더 표시 동기화
 var vals={angleX:P.yaw,angleY:P.pitch,angleZ:P.roll,blink:P.blinkL,eyeX:P.eyeX,eyeY:P.eyeY,hairSway:P.sway};
 SDEFS.forEach(function(sd){
  var el=sliderEls[sd[0]]; if(!el)return;
  if(dragging!==sd[0])el.inp.value=vals[sd[0]];
  el.vs.textContent=(+vals[sd[0]]).toFixed(1);
 });
 requestAnimationFrame(frame);
}

// ==== 8. 몽타주 (?montage — 로드 즉시 동기 렌더, 결정론) ====
function cellView(cx0,cy0,cw2,ch2,fx,fy,charH){
 var s=ch2/charH;
 return {s:s,ox:cx0+cw2/2-fx*s,oy:cy0+ch2/2-fy*s};
}
function exprP(i,extra){
 var e=EXPRS[i],o={blinkL:clamp(e.lidL,-.15,1.15),blinkR:clamp(e.lidR,-.15,1.15),
  browLift:{L:e.blL,R:e.blR},browTilt:{L:e.btL,R:e.btR},mouthA:e.m,mouthB:e.m},k;
 if(extra)for(k in extra)o[k]=extra[k];
 return defaultP(o);
}
function drawMontage(){
 ['panel','hud','back'].forEach(function(id){document.getElementById(id).style.display='none'});
 cv.width=1680; cv.height=1500; cv.style.width='1680px'; cv.style.height='1500px';
 ctx.fillStyle='#0b0912'; ctx.fillRect(0,0,1680,1500);
 var mt=13.4; // 고정 시각 (위스프 결정론)
 function cell(x,y,w,h,label,P,fx,fy,charH,opts){
  ctx.save();
  ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
  var gr=ctx.createRadialGradient(x+w/2,y+h*.36,h*.06,x+w/2,y+h*.5,h*.9);
  gr.addColorStop(0,'#2e2352'); gr.addColorStop(1,'#151022');
  ctx.fillStyle=gr; ctx.fillRect(x,y,w,h);
  var v=cellView(x,y,w,h,fx,fy,charH);
  if(!/[?&]bare/.test(location.search)){
   if(opts&&opts.wisps)drawWisps(ctx,mt,v,false);
   renderScene(ctx,P,v,opts);
   if(opts&&opts.wisps)drawWisps(ctx,mt,v,true);
  }
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='rgba(10,8,16,.72)'; ctx.fillRect(x,y+h-24,w,24);
  ctx.fillStyle='#f2eefc'; ctx.font='13px "Segoe UI","Malgun Gothic",sans-serif';
  ctx.textAlign='center'; ctx.fillText(label,x+w/2,y+h-7);
  ctx.restore();
  ctx.strokeStyle='#2a2342'; ctx.lineWidth=1; ctx.strokeRect(x+.5,y+.5,w-1,h-1);
 }
 var i,cw6=270,gap=8,x0=8;
 // Row A: 고개/시선 6포즈 (시차 증명)
 var yaws=[-30,-15,0,15,30];
 for(i=0;i<5;i++){
  var yv=yaws[i];
  cell(x0+i*(cw6+gap),8,cw6,450,'요 '+(yv>0?'+':'')+yv+'°',
   defaultP({yaw:yv,roll:yv*.2,eyeX:yv/30*.8,sway:yv*-.25}),500,430,640);
 }
 cell(x0+5*(cw6+gap),8,cw6,450,'피치 업 +18°',
  defaultP({pitch:18,eyeY:-.55,sway:2}),500,430,640);
 // Row B: 표정 5 + 블링크 중간
 for(i=0;i<5;i++){
  cell(x0+i*(cw6+gap),466,cw6,450,'표정 · '+EXPRS[i].name,
   exprP(i,{yaw:i%2?-7:7,roll:i%2?-2:2}),500,430,640);
 }
 cell(x0+5*(cw6+gap),466,cw6,450,'블링크 0.55',
  defaultP({blinkL:.55,blinkR:.55,yaw:4}),500,430,640);
 // Row C: 뷰티샷 / 클로즈업 / 와이어프레임 / 극단 변형
 var cw4=410;
 cell(8,924,cw4,568,'버스트 뷰티샷',defaultP({yaw:8,roll:2.5,eyeX:.25,sway:5}),500,560,1080,{wisps:true});
 cell(8+(cw4+gap),924,cw4,568,'얼굴 클로즈업 (머리 세로 527px)',
  defaultP({yaw:-6,roll:-2,eyeX:-.2,sway:4}),500,390,380);
 cell(8+2*(cw4+gap),924,cw4,568,'리깅: 삼각 메시 와이어프레임',
  defaultP({yaw:12,sway:6}),500,430,640,{mesh:true});
 cell(8+3*(cw4+gap),924,cw4,568,'극단 변형: 요+30 피치+16 롤+9 헤어스윙',
  exprP(2,{yaw:30,pitch:16,roll:9,sway:26,swayTip:20,eyeX:.9}),500,420,620);
 // 캡션
 ctx.fillStyle='#8a76e8'; ctx.font='12px "Segoe UI","Malgun Gothic",sans-serif';
 ctx.textAlign='left';
 ctx.fillText('카이렌 — 메시 디포메이션(Live2D式) 몽타주 · 22레이어 · 격자 삼각 메시 변형',14,1497);
}

// ==== 9. 부트 ====
var isMontage=/[?&]montage/.test(location.search);
buildTextures();
if(isMontage){
 drawMontage();
}else{
 initUI(); resize();
 window.addEventListener('resize',resize);
 requestAnimationFrame(function(n){lastT=n;requestAnimationFrame(frame)});
}
</script>
