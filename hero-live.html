<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>카이렌 — 흑염의 마검사 · 메시 디포메이션</title>
<style>
 html,body{margin:0;height:100%;overflow:hidden;background:#0d0a14;font-family:"Segoe UI","Malgun Gothic",sans-serif}
 #cv{display:block}
 #err{position:fixed;top:4px;left:4px;color:#ff5566;font:12px Consolas,monospace;white-space:pre-wrap;z-index:99;pointer-events:none;max-width:60vw}
 #back{position:fixed;top:10px;left:14px;color:#b3a6f0;text-decoration:none;font-size:13px;z-index:10;opacity:.75}
 #back:hover{opacity:1}
 #hud{position:fixed;top:36px;left:16px;color:#ece6f8;z-index:10;pointer-events:none}
 #hud h1{font-size:26px;margin:0;letter-spacing:3px;font-weight:600;text-shadow:0 0 14px rgba(124,92,255,.55)}
 #hud .sub{font-size:12.5px;color:#8a76e8;margin-top:3px;letter-spacing:1px}
 #hud .badge{display:inline-block;margin-top:8px;font-size:11px;color:#b3a6f0;border:1px solid rgba(138,118,232,.4);border-radius:4px;padding:2px 9px;background:rgba(26,20,40,.5)}
 #panel{position:fixed;right:14px;top:14px;width:212px;background:rgba(18,14,28,.88);border:1px solid rgba(138,118,232,.25);border-radius:10px;padding:12px 14px;z-index:10;color:#cfc6ec;font-size:12px;backdrop-filter:blur(4px)}
 #panel .pt{font-size:11px;color:#8a76e8;letter-spacing:2px;margin:10px 0 5px}
 #panel .pt:first-child{margin-top:0}
 #exprs button{background:#1e1830;color:#cfc6ec;border:1px solid rgba(138,118,232,.3);border-radius:5px;padding:4px 8px;margin:0 4px 4px 0;font-size:12px;cursor:pointer;font-family:inherit}
 #exprs button.on{background:#4a3a8c;color:#fff;border-color:#8a76e8}
 .srow{display:flex;align-items:center;margin:3px 0}
 .srow label{width:56px;color:#9a90bc;font-size:11px}
 .srow input{flex:1;height:14px;accent-color:#8a76e8}
 .srow span{width:34px;text-align:right;font-size:10px;color:#8a76e8}
 .chk{display:flex;align-items:center;gap:6px;margin-top:10px;cursor:pointer;font-size:12px}
 .hint{margin-top:10px;font-size:10.5px;color:#6a608c;line-height:1.5}
</style>
</head>
<body>
<div id="err"></div>
<a id="back" href="heroes.html">← 용사 전시관</a>
<div id="hud"><h1>카이렌</h1><div class="sub">黑焰 — 흑염의 마검사</div><br><span class="badge">메시 디포메이션 · Live2D式</span></div>
<div id="panel">
 <div class="pt">표정</div>
 <div id="exprs"></div>
 <div class="pt">파라미터</div>
 <div id="sliders"></div>
 <label class="chk"><input type="checkbox" id="meshChk"> 메시 보기</label>
 <div class="hint">캔버스 위에서 마우스를 움직이면 고개와 시선이 따라옵니다. 슬라이더를 드래그하는 동안은 수동 제어.</div>
</div>
<canvas id="cv"></canvas>
<script>
'use strict';
// ============================================================
// ==== 섹션 맵 ================================================
// 1. 팔레트·유틸        2. 텍스처 페인트(아트 코어: 얼굴/눈/머리)
// 3. 레이어·메시 리그    4. 디포머 (파라미터 → 정점 변형)
// 5. 애니 (스프링/깜빡임/표정/호흡)   6. 렌더 (배경/위스프/씬)
// 7. UI·입력            8. 몽타주 (?montage 동기 렌더)   9. 부트
// ============================================================
var errBox=document.getElementById('err');
window.onerror=function(m,s,l,c){errBox.textContent+='ERR: '+m+' @'+l+':'+c+'\n';return false};
window.addEventListener('unhandledrejection',function(e){errBox.textContent+='REJ: '+e.reason+'\n'});

// ==== 1. 팔레트 · 유틸 ====
var C={
 line:'#1a1520',
 skin:'#f6e8dc', skinSh:'#d8c4bc', skinSh2:'#c4a8a4', blush:'#efab9e',
 hair:'#241d2e', hairF:'#2a2236', hairSh:'#141019', hairRim:'#8a76e8', hairHi:'#b3a6f0',
 iris:'#e8b34a', irisHi:'#f6d98a', irisDk:'#7d4d16',
 coat:'#171420', coatSh:'#0e0b16', silver:'#c9ccd6', silverDk:'#878ca0',
 crimson:'#7e2231', crimsonHi:'#a53347',
 white:'#f8f2e8', bg:'#0d0a14', ember:'#7c5cff', ember2:'#b39aff'
};
var TAU=Math.PI*2;
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function lerp(a,b,t){return a+(b-a)*t}
function ease(t){return t*t*(3-2*t)}
function rng(seed){var s=seed>>>0;return function(){s=(s+0x6D2B79F5)|0;var t=Math.imul(s^(s>>>15),1|s);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
// 캐릭터 공간: 1000 × 1150. 머리중심 (500,405), 목 피벗 (500,585)
var CW=1000, CH=1150, HCX=500, HCY=405, NKX=500, NKY=585;
