<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>아스렐 — 銀月의 검성 · 절차적 스켈레톤 + IK</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#0b0e1a;overflow:hidden;
    font-family:"Segoe UI","Malgun Gothic",sans-serif;}
  #cv{display:block;position:absolute;inset:0;}
  #err{position:fixed;top:4px;left:4px;z-index:99;color:#ff5b5b;font:13px/1.4 "Segoe UI","Malgun Gothic",sans-serif;
    white-space:pre-wrap;max-width:90vw;pointer-events:none;text-shadow:0 1px 2px #000;}
  #back{position:fixed;top:10px;left:12px;z-index:10;color:#8fa3c8;text-decoration:none;
    font-size:13px;opacity:.85}

  #hud{position:fixed;top:30px;left:12px;z-index:10;color:#e8ecf2;pointer-events:none}

  #hud .sub{font-size:12px;color:#8fa3c8;margin-top:2px}
  #hud .badge{display:inline-block;margin-top:6px;padding:2px 10px;border:1px solid #46608f;
    border-radius:10px;font-size:11px;color:#9fc0ef;background:rgba(20,30,55,.55)}
  #panel{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:10;
    display:flex;gap:8px;align-items:center;padding:8px 12px;border-radius:12px;
    background:rgba(13,18,34,.78);border:1px solid #26314f;backdrop-filter:blur(3px)}
  #panel button{font-family:inherit;font-size:13px;color:#c9d6ee;background:#1a2340;
    border:1px solid #33436e;border-radius:8px;padding:6px 12px;cursor:pointer}
  #panel button:hover{background:#243157}
  #panel button.on{background:#3a548f;color:#fff;border-color:#6f8fd0}
  #panel label{color:#9fb0d4;font-size:12px;display:flex;align-items:center;gap:5px;cursor:pointer}
  #panel input[type=range]{width:90px}
  .montage #back,.montage #hud,.montage #panel{display:none}
</style>
</head>
<body>
<a id="back" href="heroes.html">← 용사 전시관</a>
<div id="hud">
  <h1>아스렐</h1>
  <div class="sub">銀月의 검성 — 은백의 장발, 청강의 코트</div>
  <div class="badge">절차적 스켈레톤 · IK</div>
</div>
<canvas id="cv"></canvas>
<div id="panel">
  <button data-anim="idle" class="on">대기</button>
  <button data-anim="walk">걷기</button>
  <button data-anim="run">달리기</button>
  <button data-anim="slash">베기</button>
  <button data-anim="battou">발도</button>
  <label><input type="checkbox" id="bones">뼈대 보기</label>
  <label>속도<input type="range" id="speed" min="0.2" max="2" step="0.05" value="1"></label>
</div>
<div id="err"></div>
<script>
"use strict";
// ==== 섹션 맵 =====================================================
// 1. 팔레트/상수   2. 수학·커브 유틸   3. 리그(FK/IK)
// 4. 포즈 pose(anim,t) — 순수함수      5. 드로잉(얼굴/머리/몸/검/이펙트)
// 6. 배경/씬       7. UI·실시간 루프    8. 몽타주(?montage)
// =================================================================
window.onerror=function(m,s,l,c){showErr("ERR "+m+" @"+l+":"+c);};
window.addEventListener("unhandledrejection",e=>showErr("REJ "+e.reason));
function showErr(t){var d=document.getElementById("err");d.textContent+=t+"\n";
  try{var g=document.getElementById("cv").getContext("2d");g.save();
  g.setTransform(1,0,0,1,0,0);g.fillStyle="#ff5b5b";g.font="13px sans-serif";
  g.fillText(t,8,16);g.restore();}catch(e){}}

// ==== 1. 팔레트/상수 ==============================================
const PAL={
  bg0:"#0b0e1a", bg1:"#121830", moon:"#e8ecf2", moonHalo:"rgba(210,222,240,",
  line:"#191624", lineSoft:"#2a2740",
  skin:"#f7eae2", skinSh:"#e6cbc0", blush:"#f0a8a2",
  hair:"#eef1f6", hairSh:"#b9c3d4", hairDeep:"#8b97ad", hairRim:"#ffffff",
  hairCap:"#d7dee9",
  coat:"#2c3e63", coatSh:"#1e2b47", trim:"#cfd6e4", lining:"#1b2a55",
  pants:"#232a3e", boots:"#1b2133", glove:"#1d2436",
  steel0:"#e6ecf4", steel1:"#98a4b8", steelDark:"#5d6878", guard:"#39415a",
  saya:"#202839", trail0:"#9fd8ff", trail1:"#ffffff",
  eyeTop:"#24476e", eyeMid:"#5c8cc2", eyeLow:"#bfe3fa", pupil:"#13233a",
  brow:"#8b93a6", ground:"#10121f"
};
// 신체 치수 (모델 단위, y-down, 지면 y=0)
const B={
  hipY:-176, thigh:86, shin:84, ankleH:7, footL:17,
  s1:18, s2:22, s3:28,            // pelvis→spine1→spine2→chest
  neck:18, headOff:37,            // chest→neck top, neck top→head center
  headRX:21, headRY:23,
  shNX:24, shNY:2, shFX:-26, shFY:0,   // 어깨 오프셋(가슴 기준)
  upArm:44, foArm:42, hand:18,
  swordBlade:118, swordHilt:22
};

// ==== 2. 수학·커브 유틸 ===========================================
const TAU=Math.PI*2, RAD=Math.PI/180;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,u)=>a+(b-a)*u;
const fract=v=>v-Math.floor(v);
const hash=n=>fract(Math.sin(n*127.1+311.7)*43758.5453);
const E={
  lin:u=>u,
  in2:u=>u*u, out2:u=>1-(1-u)*(1-u),
  io2:u=>u<.5?2*u*u:1-2*(1-u)*(1-u),
  in3:u=>u*u*u, out3:u=>1-Math.pow(1-u,3),
  io3:u=>u<.5?4*u*u*u:1-4*Math.pow(1-u,3),
  in4:u=>u*u*u*u, out4:u=>1-Math.pow(1-u,4),
  out5:u=>1-Math.pow(1-u,5),
  outB:u=>{const s=1.55;u-=1;return u*u*((s+1)*u+s)+1},   // back overshoot
  io5:u=>u<.5?16*u*u*u*u*u:1-16*Math.pow(1-u,5)
};
// 키프레임 채널: keys=[[t,v,ease?],...] — ease는 "그 키로 들어가는 구간"에 적용
function ch(keys){
  return function(t){
    if(t<=keys[0][0])return keys[0][1];
    for(let i=1;i<keys.length;i++){
      if(t<=keys[i][0]){
        const a=keys[i-1],b=keys[i];
        const u=(t-a[0])/Math.max(1e-6,b[0]-a[0]);
        return lerp(a[1],b[1],(E[b[2]||"io2"])(u));
      }
    }
    return keys[keys.length-1][1];
  };
}
// 결정적 깜빡임 (몽타주 재현 가능)
function blinkAmt(t){
  const P=3.1, seq=Math.floor(t/P), r=hash(seq);
  const st=seq*P+r*1.6;
  let b=pulse(t-st);
  if(hash(seq+7)>0.72)b=Math.max(b,pulse(t-st-0.24)); // 더블 블링크
  return b;
  function pulse(u){if(u<0||u>0.17)return 0;
    return u<0.055?u/0.055:1-(u-0.055)/0.115;}
}
// 2본 해석적 IK — a=시작관절, t=목표, bend=+1(무릎 앞) / -1(팔꿈치 뒤)
function ik2(ax,ay,tx,ty,l1,l2,bend){
  let dx=tx-ax,dy=ty-ay,d=Math.hypot(dx,dy)||1e-4;
  const dc=clamp(d,Math.abs(l1-l2)+0.01,l1+l2-0.01);
  dx*=dc/d;dy*=dc/d;
  const a=Math.atan2(dy,dx);
  const c=Math.acos(clamp((l1*l1+dc*dc-l2*l2)/(2*l1*dc),-1,1));
  return {mx:ax+Math.cos(a-bend*c)*l1,my:ay+Math.sin(a-bend*c)*l1,
          ex:ax+dx,ey:ay+dy};
}

// ==== 3. 리그 — 본 계층 조립 ======================================
// pose 채널 → buildSkeleton → 관절 월드좌표 j.* (드로잉은 전부 여기서 파생)
function basePose(){
  return {
    t:0, px:0, py:B.hipY, pelvisA:0,
    spineA:[0,0,0], neckA:0, headA:0, shoulderDX:0,
    footN:{x:14,y:0,pitch:0}, footF:{x:-16,y:0,pitch:0},
    groundedN:true, groundedF:true,
    armN:{mode:"fk",a1:0.30,a2:0.28}, armF:{mode:"fk",a1:-0.10,a2:0.22},
    sword:{hold:"none",angle:100*RAD,gripX:0,gripY:0,drawn:1,showSaya:false,sayaA:200*RAD},
    hairSway:1, hairFlow:0, coatSway:1, coatFlap:0,
    face:{blink:0,brow:0,narrow:0,mouth:0,px:0.4,py:0},
    fx:{trail:0,ghosts:[],arc:0,flash:0,spark:0,shakeX:0,shakeY:0,speed:0},
    j:{}
  };
}
function buildSkeleton(P){
  const j=P.j;
  j.pelvis={x:P.px,y:P.py};
  // 척추 FK — 위쪽(-y)으로 누적 회전
  let a=P.pelvisA, x=P.px, y=P.py;
  const segs=[[B.s1,P.spineA[0]],[B.s2,P.spineA[1]],[B.s3,P.spineA[2]]];
  const names=["spine1","spine2","chest"];
  for(let i=0;i<3;i++){
    a+=segs[i][1];
    x+=Math.sin(a)*segs[i][0]; y-=Math.cos(a)*segs[i][0];
    j[names[i]]={x,y};
  }
  j.chestA=a;
  a+=P.neckA; const nx=x+Math.sin(a)*B.neck, ny=y-Math.cos(a)*B.neck;
  j.neckTop={x:nx,y:ny};
  const ha=a+P.headA;
  j.head={x:nx+Math.sin(ha)*B.headOff, y:ny-Math.cos(ha)*B.headOff};
  j.headA=ha;
  // 골반 좌우 힙
  j.hipN={x:P.px+7+P.shoulderDX*-0.25, y:P.py+3};
  j.hipF={x:P.px-9+P.shoulderDX*0.25,  y:P.py+4};
  // 다리 IK — 발 목표에 발목 스냅(미끄러짐 0)
  for(const s of ["N","F"]){
    const hip=j["hip"+s], f=P["foot"+s];
    const tx=f.x, ty=f.y-B.ankleH;
    const r=ik2(hip.x,hip.y,tx,ty,B.thigh,B.shin,1);
    j["knee"+s]={x:r.mx,y:r.my};
    j["ankle"+s]={x:r.ex,y:r.ey};
    j["toe"+s]={x:r.ex+Math.cos(f.pitch)*B.footL,
                y:r.ey+B.ankleH-2+Math.sin(f.pitch)*B.footL*0.55};
    j["heel"+s]={x:r.ex-Math.cos(f.pitch)*5,
                 y:r.ey+B.ankleH-1-Math.sin(f.pitch)*4};
  }
  // 어깨 (역회전 오프셋 shoulderDX)
  const ca=j.chestA, cx=j.chest.x, cy=j.chest.y;
  function rotC(ox,oy){const c=Math.cos(ca),s=Math.sin(ca);
    return {x:cx+ox*c-oy*s, y:cy+ox*s+oy*c};}
  j.shN=rotC(B.shNX+P.shoulderDX, B.shNY-2);
  j.shF=rotC(B.shFX-P.shoulderDX, B.shFY-1);
  // 검 그립 월드 (채널은 가슴 기준 상대)
  if(P.sword.hold!=="none"){
    j.grip={x:cx+P.sword.gripX, y:cy+P.sword.gripY};
  }
  // 팔 — FK 또는 IK(그립/타깃)
  for(const s of ["N","F"]){
    const sh=j["sh"+s], arm=P["arm"+s];
    let tx,ty;
    if(arm.mode==="ik"){
      tx=arm.tx; ty=arm.ty;
      if(arm.grip!==undefined && j.grip){ // 검 그립점(칼자루 위 오프셋)
        tx=j.grip.x+Math.cos(P.sword.angle)*arm.grip;
        ty=j.grip.y+Math.sin(P.sword.angle)*arm.grip;
      }
      const r=ik2(sh.x,sh.y,tx,ty,B.upArm,B.foArm,arm.bend||-1);
      j["el"+s]={x:r.mx,y:r.my}; j["wr"+s]={x:r.ex,y:r.ey};
    }else{
      const a1=arm.a1, a2=arm.a1+arm.a2; // 수직 아래 기준
      j["el"+s]={x:sh.x+Math.sin(a1)*B.upArm, y:sh.y+Math.cos(a1)*B.upArm};
      j["wr"+s]={x:j["el"+s].x+Math.sin(a2)*B.foArm,
                 y:j["el"+s].y+Math.cos(a2)*B.foArm};
    }
  }
  // 검 실좌표 — near 손이 잡으면 그 손목에 스냅
  const S=P.sword;
  if(S.hold==="near"||S.hold==="both"){
    const g=j.grip||j.wrN;
    j.swordGrip={x:g.x,y:g.y};
  }else if(S.hold==="fkNear"){ // FK 손끝에 부착 (대기 등)
    j.swordGrip={x:j.wrN.x+Math.cos(S.angle)*2, y:j.wrN.y+Math.sin(S.angle)*2};
  }
  if(j.swordGrip){
    const c=Math.cos(S.angle), s=Math.sin(S.angle);
    j.swordTip={x:j.swordGrip.x+c*B.swordBlade*S.drawn,
                y:j.swordGrip.y+s*B.swordBlade*S.drawn};
    j.swordButt={x:j.swordGrip.x-c*B.swordHilt, y:j.swordGrip.y-s*B.swordHilt};
  }
  return P;
}

// ==== 4. 포즈 — pose(anim,t) 순수함수 =============================
// 보행 발 사이클: 접지(등속 후진·y=0) → 스윙(전진·리프트)
function gaitFoot(ph,S1,S2,lift,stance){
  ph=fract(ph);
  if(ph<stance){ const u=ph/stance;
    return {x:lerp(S1,-S2,u), y:0, pitch:lerp(-0.20,0.42,E.in2(u)), st:true};
  }
  const u=(ph-stance)/(1-stance);
  return {x:lerp(-S2,S1,E.io3(u)), y:-lift*Math.sin(Math.PI*u),
          pitch:lerp(0.42,-0.20,E.io2(u)), st:false};
}
function poseIdle(P,t){
  const br=Math.sin(t*TAU/3.4), sway=Math.sin(t*0.52);
  P.px=sway*2.0; P.py=B.hipY+br*1.1;
  P.pelvisA=0.02+sway*0.012;
  P.spineA=[0.010+br*0.006, 0.008+br*0.010, -0.012+br*0.012];
  P.neckA=-0.02-br*0.008; P.headA=-0.012+sway*0.010;
  P.footN={x:15,y:0,pitch:0}; P.footF={x:-17,y:0,pitch:0};
  // 검을 쥔 오른손(near)은 아래로 늘어뜨림 + 검끝 미세 흔들림
  P.armN={mode:"fk",a1:0.34+br*0.015,a2:0.30+br*0.02};
  P.armF={mode:"fk",a1:-0.13+br*0.012,a2:0.20+br*0.015};
  P.sword={hold:"fkNear",angle:(96+br*1.3+Math.sin(t*1.7)*1.1)*RAD,
           gripX:0,gripY:0,drawn:1,showSaya:true,sayaA:196*RAD};
  P.hairSway=1; P.coatSway=1;
  P.face={blink:blinkAmt(t),brow:0,narrow:0,mouth:0,px:0.45,py:0.05};
  return P;
}
function poseWalk(P,t){
  const p=fract(t/1.05);
  const fN=gaitFoot(p,     34,28,15,0.60);
  const fF=gaitFoot(p+0.5, 34,28,15,0.60);
  P.footN={x:fN.x,y:fN.y,pitch:fN.pitch};
  P.footF={x:fF.x,y:fF.y,pitch:fF.pitch};
  P.groundedN=fN.st; P.groundedF=fF.st;
  P.py=B.hipY-2.6*Math.cos(2*TAU*(p-0.27));      // 골반 상하 (중간지지 최고점)
  P.px=1.5*Math.sin(TAU*p);
  P.pelvisA=0.05+0.02*Math.sin(TAU*p);
  P.spineA=[0.02,0.025,0.005];
  P.neckA=-0.05; P.headA=-0.015+0.012*Math.cos(2*TAU*p);
  P.shoulderDX=-5.5*Math.sin(TAU*p);             // 어깨 역회전
  const sw=Math.sin(TAU*p);
  P.armN={mode:"fk",a1:-0.52*sw,a2:0.28+0.15*Math.max(0,-sw)};
  P.armF={mode:"fk",a1: 0.52*sw,a2:0.28+0.15*Math.max(0, sw)};
  P.sword={hold:"none",angle:0,gripX:0,gripY:0,drawn:0,showSaya:true,sayaA:200*RAD};
  P.hairSway=1.2; P.coatSway=1.4;
  P.face={blink:blinkAmt(t),brow:0,narrow:0,mouth:0,px:0.5,py:0};
  return P;
}
function poseRun(P,t){
  const p=fract(t/0.70);
  const fN=gaitFoot(p,     50,42,26,0.34);
  const fF=gaitFoot(p+0.5, 50,42,26,0.34);
  P.footN={x:fN.x+8,y:fN.y,pitch:fN.pitch*1.2};
  P.footF={x:fF.x+8,y:fF.y,pitch:fF.pitch*1.2};
  P.groundedN=fN.st; P.groundedF=fF.st;
  const air=(!fN.st&&!fF.st)?1:0;
  P.py=B.hipY-5.5*Math.cos(2*TAU*(p-0.30))-air*3;
  P.px=2.5*Math.sin(TAU*p);
  P.pelvisA=0.16; P.spineA=[0.06,0.07,0.05];     // 상체 전경
  P.neckA=-0.16; P.headA=-0.04;
  P.shoulderDX=-8*Math.sin(TAU*p);
  const sw=Math.sin(TAU*p);
  P.armN={mode:"fk",a1:0.35-0.75*sw,a2:1.15+0.25*sw};
  P.armF={mode:"fk",a1:0.35+0.75*sw,a2:1.15-0.25*sw};
  P.sword={hold:"none",angle:0,gripX:0,gripY:0,drawn:0,showSaya:true,sayaA:206*RAD};
  P.hairSway=0.6; P.hairFlow=1; P.coatSway=1; P.coatFlap=1;
  P.fx.speed=0.6;
  P.face={blink:0,brow:-0.3,narrow:0.35,mouth:0.15,px:0.7,py:0};
  return P;
}

// --- 베기: 3연격 콤보 (횡베기→반전 올려베기→내려찍기), 루프 3.6s ----
const SL={T:3.6};
SL.ang=ch([ // 검 각도(도) — 예비 느리게 → 타격 급가속(out5/out4) → 홀드(중복키) → 회수
  [0.00,  75,"io2"],[0.34, 196,"io3"],[0.42, 205,"out2"],   // S1 예비: 등뒤로
  [0.55,   8,"out5"],[0.70,   8,"lin"],                     // S1 타격→홀드
  [0.98,  62,"io3"],[1.20, 118,"io2"],                      // 회수→S2 예비(하단)
  [1.34, -112,"out5"],[1.50,-112,"lin"],                    // S2 올려베기→홀드
  [1.86, -95,"io3"],[2.10, -78,"io2"],                      // S3 예비: 머리 위
  [2.24,  86,"out4"],[2.52,  86,"lin"],                     // S3 내려찍기→홀드
  [3.55,  75,"io3"]]);
SL.gx=ch([[0,20],[0.42,-12,"io3"],[0.55,30,"out5"],[0.70,30,"lin"],
  [1.20,6,"io3"],[1.34,20,"out5"],[1.50,20,"lin"],
  [2.10,4,"io3"],[2.24,26,"out4"],[2.52,26,"lin"],[3.55,20,"io3"]]);
SL.gy=ch([[0,12],[0.42,-20,"io3"],[0.55,8,"out5"],[0.70,8,"lin"],
  [1.20,26,"io3"],[1.34,-16,"out5"],[1.50,-16,"lin"],
  [2.10,-34,"io3"],[2.24,30,"out4"],[2.52,30,"lin"],[3.55,12,"io3"]]);
SL.px=ch([[0,0],[0.42,-9,"io3"],[0.55,14,"out5"],[0.70,14,"lin"],
  [1.20,2,"io3"],[1.34,10,"out5"],[1.50,10,"lin"],
  [2.10,-6,"io3"],[2.24,16,"out4"],[2.52,16,"lin"],[3.55,0,"io3"]]);

function stepLift(t,windows){ // 스텝 창에서만 발 리프트
  for(const w of windows){ if(t>=w[0]&&t<=w[1]){

  return 0;
}

  P.footF={x:SL.ffx(t),y:stepLift(t,[[1.60,1.78],[2.90,3.30]]),pitch:0};
  P.groundedN=P.footN.y===0; P.groundedF=P.footF.y===0;

           drawn:1,showSaya:true,sayaA:198*RAD};

  const strike=(t>0.42&&t<0.60)||(t>1.20&&t<1.40)||(t>2.10&&t<2.30);
  if(strike)P.fx.ghosts=[0.022,0.048,0.078];
  if(t>2.24&&t<2.42){P.fx.spark=1-(t-2.24)/0.18;

// 부드럽게 휘는 테이퍼 캡슐 — 관절에서 곡선으로 휘는 사지 (컷아웃과의 차별점)
function limb(g,A,M,B2,w0,w1,w2,fill,lw){
  const n=(p,q)=>{const dx=q.x-p.x,dy=q.y-p.y,l=Math.hypot(dx,dy)||1;
    return {x:-dy/l,y:dx/l};};
  const n0=n(A,M), n2=n(M,B2);
  let nm={x:n0.x+n2.x,y:n0.y+n2.y};
  const l=Math.hypot(nm.x,nm.y)||1; nm.x/=l; nm.y/=l;
  const k=1.12; // 관절 볼륨 보정
  g.beginPath();
  g.moveTo(A.x+n0.x*w0,A.y+n0.y*w0);
  g.quadraticCurveTo(M.x+nm.x*w1*k,M.y+nm.y*w1*k,B2.x+n2.x*w2,B2.y+n2.y*w2);
  g.arc(B2.x,B2.y,w2,Math.atan2(n2.y,n2.x),Math.atan2(-n2.y,-n2.x));
  g.quadraticCurveTo(M.x-nm.x*w1*k,M.y-nm.y*w1*k,A.x-n0.x*w0,A.y-n0.y*w0);
  g.arc(A.x,A.y,w0,Math.atan2(-n0.y,-n0.x),Math.atan2(n0.y,n0.x));
  g.closePath();
  g.fillStyle=fill; g.fill();
  if(lw){g.strokeStyle=PAL.line;g.lineWidth=lw;g.lineJoin="round";g.stroke();}
}
// 테이퍼 머리카락 가닥: 스파인 폴리라인 + 뿌리→끝 폭 감소, 닫힌 도형
function strand(g,pts,w0,w1,fill,outline,olw){
  if(pts.length<3)return;
  const L=[],R=[];
  for(let i=0;i<pts.length;i++){
    const p0=pts[Math.max(0,i-1)],p1=pts[Math.min(pts.length-1,i+1)];
    let dx=p1.x-p0.x,dy=p1.y-p0.y;const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;
    const w=lerp(w0,w1,E.io2(i/(pts.length-1)));
    L.push({x:pts[i].x-dy*w,y:pts[i].y+dx*w});
    R.push({x:pts[i].x+dy*w,y:pts[i].y-dx*w});
  }
  g.beginPath();
  g.moveTo(L[0].x,L[0].y);
  for(let i=1;i<L.length-1;i++)
    g.quadraticCurveTo(L[i].x,L[i].y,(L[i].x+L[i+1].x)/2,(L[i].y+L[i+1].y)/2);
  g.lineTo(pts[pts.length-1].x,pts[pts.length-1].y); // 뾰족한 끝
  for(let i=R.length-2;i>0;i--)
    g.quadraticCurveTo(R[i].x,R[i].y,(R[i].x+R[i-1].x)/2,(R[i].y+R[i-1].y)/2);
  g.closePath();
  g.fillStyle=fill;g.fill();
  if(outline){g.strokeStyle=outline;g.lineWidth=olw||0.45;g.lineJoin="round";g.stroke();}
}
function bez(g,pts){ // moveTo + 이어지는 스무드 콰드 폴리라인
  g.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i+=2){
    if(i+1<pts.length)
      g.quadraticCurveTo(pts[i][0],pts[i][1],pts[i+1][0],pts[i+1][1]);
    else g.lineTo(pts[i][0],pts[i][1]);
  }
}

// --- 얼굴: 미소년의 급소. 헤드 로컬(중심 원점, 머리높이 46, +x=진행방향) ---
function drawHead(g,P){
  const j=P.j, F=P.face, t=P.t;

    [19.6,-0.5],[19.0,2.5],[18.6,5],[18.2,8],
    [15.5,17.5],[7.2,22.4],       // 뺨 → 턱끝 V
    [2.5,23.2],[-2.2,20.2],
    [-7.5,15.5],[-10.8,10.2],
    [-12.2,7],[-12.4,4.5],[-14.2,-4],[-14.5,-16]]);

  g.fillStyle=PAL.skin; g.fill();
  g.strokeStyle=PAL.line; g.lineWidth=0.75; g.lineJoin="round"; g.stroke();

  for(const bp of[[8.2,9.6,3.2],[17.2,8.8,2.0]]){

    bg2.addColorStop(1,"rgba(240,168,162,0)");

  g.beginPath(); g.moveTo(11.6,-2.6+bl);
  g.quadraticCurveTo(15.6,-4.4+bl*0.4, 19.6,-3.0+bl*1.2); g.stroke();

  g.beginPath(); g.moveTo(19.0,8.0); g.quadraticCurveTo(19.9,8.9,19.3,9.8); g.stroke();
  // 입: 작고 절제된 입매
  g.strokeStyle="#b06a63"; g.lineWidth=0.55; g.lineCap="round";
  g.beginPath(); g.moveTo(11.2,15.1+F.mouth*0.5);

    g.beginPath(); g.moveTo(11.5,15.5);

// 아몬드 눈: 눈꼬리 상승, 3톤 홍채 + 이중 하이라이트. far=원안(폭 축소)
function eye(g,cx,cy,hw,hh,far,F){
  const open=1-clamp(F.blink,0,1);
  const nr=1-F.narrow*0.38;
  const H=hh*open*nr;
  const inn=far?-1:1;              // 내안각: 근안 +x(코쪽) / 원안 -x
  const ix=cx+hw*inn, ox=cx-hw*inn;
  if(open<0.14){ // 감은 눈
    g.strokeStyle=PAL.line; g.lineWidth=1.0; g.lineCap="round";
    g.beginPath(); g.moveTo(ix,cy+0.7);
    g.quadraticCurveTo(cx,cy+1.9,ox,cy-0.2); g.stroke();
    return;
  }
  const topY=cy-H, outY=cy-H*0.55;
  g.save();
  g.beginPath();
  g.moveTo(ix,cy+0.5);
  g.quadraticCurveTo(cx+hw*inn*0.22, topY-0.7, ox, outY);   // 윗꺼풀
  g.quadraticCurveTo(cx-hw*inn*0.42, cy+H*0.85, ix, cy+0.5); // 아랫라인
  g.closePath();
  g.clip();
  // 흰자
  g.fillStyle="#fbfcfe"; g.fillRect(cx-hw-2,cy-hh-3,hw*2+4,hh*2+5);
  // 홍채 (세로 타원, 3톤)
  const px=cx+F.px*inn*0.8, py=cy+F.py+0.25;
  const irx=hw*0.44, iry=H*1.15;
  const gr=g.createLinearGradient(px,py-iry,px,py+iry);
  gr.addColorStop(0,PAL.eyeTop); gr.addColorStop(0.5,PAL.eyeMid);
  gr.addColorStop(1,PAL.eyeLow);
  g.beginPath(); g.ellipse(px,py,irx,iry,0,0,TAU);
  g.fillStyle=gr; g.fill();
  // 동공
  g.beginPath(); g.ellipse(px,py+0.15,irx*0.40,iry*0.42,0,0,TAU);
  g.fillStyle=PAL.pupil; g.fill();
  // 상단 큰 하이라이트 + 하단 반사광
  g.beginPath(); g.ellipse(px+irx*0.34,py-iry*0.40,irx*0.40,irx*0.40,0,0,TAU);
  g.fillStyle="rgba(255,255,255,0.96)"; g.fill();
  g.beginPath(); g.ellipse(px-irx*0.36,py+iry*0.48,irx*0.19,irx*0.19,0,0,TAU);
  g.fillStyle="rgba(205,238,255,0.85)"; g.fill();
  // 윗꺼풀 그림자 (얇게)
  g.fillStyle="rgba(45,58,90,0.16)";
  g.fillRect(cx-hw-2,topY-1,hw*2+4,H*0.24);
  g.restore();
  // 윗눈꺼풀 라인 — 두껍게, 눈꼬리 올림
  g.strokeStyle=PAL.line; g.lineCap="round"; g.lineWidth=1.15;
  g.beginPath();
  g.moveTo(ix,cy+0.5);
  g.quadraticCurveTo(cx+hw*inn*0.22, topY-0.8, ox, outY);
  g.stroke();
  // 속눈썹 뭉침 (눈꼬리 플릭, 위로)
  g.beginPath();
  g.moveTo(ox,outY);
  g.quadraticCurveTo(ox-inn*1.2, outY-1.1, ox-inn*2.0, outY-2.0);
  g.quadraticCurveTo(ox-inn*0.7, outY-0.6, ox+inn*0.5, outY+0.5);
  g.closePath(); g.fillStyle=PAL.line; g.fill();
  // 아랫라인: 바깥 2/3, 얇고 연하게
  g.strokeStyle="rgba(25,22,36,0.40)"; g.lineWidth=0.45;
  g.beginPath();
  g.moveTo(cx-hw*inn*0.20,cy+H*0.85);
  g.quadraticCurveTo(cx-hw*inn*0.62,cy+H*0.80, ox,cy+H*0.10);
  g.stroke();
  // 쌍꺼풀 라인
  g.strokeStyle="rgba(25,22,36,0.26)"; g.lineWidth=0.38;
  g.beginPath();
  g.moveTo(cx+hw*inn*0.5,topY-1.2);
  g.quadraticCurveTo(cx-hw*inn*0.05,topY-1.9, ox+inn*0.6,outY-1.0);
  g.stroke();
}
// --- 머리카락: 뒷머리 실루엣 → (얼굴) → 앞머리 12가닥 ------------------
function hairBack(g,P){
  const j=P.j, t=P.t;
  // 낮은 포니테일: 목덜미에서 아래로, S웨이브 + 오버랩 지연
  const ha=j.headA, lx=-11, ly=9;

function hairFront(g,P){

  const S=[ // [x0,y0, cx,cy, x1,y1, w]

    [-5.5,-15,  -6.8,-7,  -7.2,-0.5,4.3],
    [-1.8,-16,  -2.8,-8,  -3.2,-1.5,4.1],
    [ 1.8,-16.5, 1.2,-9,   0.6,-0.8,4.0],
    [ 5.2,-16.5, 5.4,-9,   5.2,-1.8,3.9],
    [ 8.8,-16,   9.6,-8.5, 9.7,-0.6,3.9],
    [12.2,-15,  13.8,-8,  14.2,-0.2,3.7],

      s[6],1.0,PAL.hair,null);

  strand(g,[{x:12.4,y:-14.8},{x:13.2,y:-5},{x:13.2+tip(2.6),y:4.4}],1.3,0.5,PAL.hair,null);
  g.globalAlpha=1;

  strand(g,[{x:7.0,y:-16.2},{x:7.4,y:-10},{x:7.4,y:-2.2}],1.4,0.5,PAL.hair,null);
  g.strokeStyle="rgba(139,151,173,0.55)"; g.lineWidth=0.5; g.lineCap="round";

  g.restore();
}

function drawSword(g,P){
  const j=P.j, S=P.sword;
  if(!j.swordGrip||S.drawn<=0.01)return;
  const a=S.angle, c=Math.cos(a), s=Math.sin(a);
  const gx=j.swordGrip.x, gy=j.swordGrip.y;
  const L=B.swordBlade*S.drawn;
  g.save();
  g.translate(gx,gy); g.rotate(a);
  // 칼자루(뒤로) — 은사 다이아 감기
  g.fillStyle="#232a3c";
  g.beginPath(); g.rect(-B.swordHilt,-2.6,B.swordHilt-2,5.2); g.fill();
  g.strokeStyle=PAL.line; g.lineWidth=0.7; g.stroke();
  g.strokeStyle=PAL.trim; g.lineWidth=0.7;
  for(let i=1;i<5;i++){const x=-i*4.2;
    g.beginPath();g.moveTo(x-2,-2.6);g.lineTo(x+2,2.6);g.stroke();
    g.beginPath();g.moveTo(x+2,-2.6);g.lineTo(x-2,2.6);g.stroke();}
  g.beginPath(); g.rect(-B.swordHilt-2.5,-3,3,6); g.fillStyle=PAL.trim; g.fill();
  // 코등이
  g.beginPath(); g.ellipse(-1,0,2.6,5.6,0,0,TAU);
  g.fillStyle=PAL.guard; g.fill();
  g.strokeStyle=PAL.trim; g.lineWidth=0.8; g.stroke();
  // 도신: 완만한 커브 + 그라데이션 + 날/스펙큘러
  const gr=g.createLinearGradient(0,-3,0,3);
  gr.addColorStop(0,"#ffffff"); gr.addColorStop(0.42,PAL.steel0);
  gr.addColorStop(0.75,PAL.steel1); gr.addColorStop(1,PAL.steelDark);
  g.beginPath();
  g.moveTo(2,-2.6);
  g.quadraticCurveTo(L*0.55,-4.6, L-7,-3.4);
  g.quadraticCurveTo(L+1.5,-2.6, L, 0.6);         // 킷사키
  g.quadraticCurveTo(L*0.5, 1.9, 2, 2.2);
  g.closePath();
  g.fillStyle=gr; g.fill();
  g.strokeStyle="#3c4658"; g.lineWidth=0.6; g.stroke();
  // 하몬/스펙큘러 획
  g.strokeStyle="rgba(255,255,255,0.9)"; g.lineWidth=0.9; g.lineCap="round";
  g.beginPath(); g.moveTo(L*0.18,-2.6); g.quadraticCurveTo(L*0.5,-3.6,L*0.86,-2.5);
  g.stroke();
  g.restore();
}

function drawLegs(g,P,side){

  const f=P["foot"+side];
  const col=far?shade(PAL.pants,-14):PAL.pants;
  limb(g,hip,knee,ank,12.5,8.5,5.2,col,1.0);
  // 부츠 (정강이 하부 덮기)
  const bootTop={x:lerp(knee.x,ank.x,0.42),y:lerp(knee.y,ank.y,0.42)};
  limb(g,bootTop,{x:lerp(bootTop.x,ank.x,0.5),y:lerp(bootTop.y,ank.y,0.5)},ank,
    7.2,6.2,5.4,far?shade(PAL.boots,-10):PAL.boots,1.0);
  g.strokeStyle=PAL.trim; g.lineWidth=1.1;
  g.beginPath(); g.moveTo(bootTop.x-6,bootTop.y+1); g.lineTo(bootTop.x+6.4,bootTop.y-1);
  g.stroke();

  g.moveTo(ank.x-4.5,ank.y-3);
  g.quadraticCurveTo(ank.x+f.x*0+8*Math.cos(f.pitch)-2, ank.y+3+Math.sin(f.pitch)*2,
    j["toe"+side].x, j["toe"+side].y);
  g.lineTo(j["toe"+side].x-2, j["toe"+side].y+2.6);
  g.lineTo(j["heel"+side].x, j["heel"+side].y+3.4);
  g.quadraticCurveTo(ank.x-5.6,ank.y+2, ank.x-4.5,ank.y-3);
  g.closePath();
  g.fillStyle=far?shade(PAL.boots,-10):PAL.boots; g.fill();
  g.strokeStyle=PAL.line; g.lineWidth=1.0; g.lineJoin="round"; g.stroke();
}
function drawArm(g,P,side){
  const j=P.j, far=side==="F";

  const col=far?shade(PAL.coat,-16):PAL.coat;
  limb(g,sh,el,wr,9.8,7.2,5.6,col,1.0);
  // 커프스
  const cu={x:lerp(el.x,wr.x,0.72),y:lerp(el.y,wr.y,0.72)};
  limb(g,cu,{x:lerp(cu.x,wr.x,0.5),y:lerp(cu.y,wr.y,0.5)},wr,6.4,6.0,5.8,
    far?shade("#3a4c74",-14):"#3a4c74",0.9);
  // 장갑 손 (라운드 미튼 + 엄지 힌트)
  const dx=wr.x-el.x, dy=wr.y-el.y, l=Math.hypot(dx,dy)||1;
  const hx=wr.x+dx/l*B.hand*0.55, hy=wr.y+dy/l*B.hand*0.55;

function shade(hex,d){ // #rrggbb 명도 시프트
  const n=parseInt(hex.slice(1),16);
  const r=clamp((n>>16)+d,0,255),g2=clamp(((n>>8)&255)+d,0,255),b=clamp((n&255)+d,0,255);
  return "rgb("+r+","+g2+","+b+")";
}
// 코트 자락(뒤) — 스프링 스웨이하는 2장 플랩
function coatTails(g,P){
  const j=P.j, t=P.t;
  const w=j.pelvis, sway=Math.sin(t*2.3)*3*P.coatSway, flap=P.coatFlap;
  for(const[s,off,col]of[[1,-4,PAL.coatSh],[0,3,shade(PAL.coat,-6)]]){
    const lag=Math.sin(t*2.3-0.6-s*0.5)*4*P.coatSway;
    const bx=w.x-14+off, ex=bx-16-lag-flap*26, ey=w.y+92-flap*20;
    g.beginPath();
    g.moveTo(w.x+10+off,w.y+6);
    g.quadraticCurveTo(w.x+14+off, w.y+52, w.x+6+off+sway*0.4, w.y+88-flap*8);
    g.lineTo(ex+16, ey+4);
    g.quadraticCurveTo(ex-6-lag*0.5, ey-18, bx-8-lag, w.y+34);
    g.quadraticCurveTo(bx+2, w.y+12, w.x-12+off, w.y+4);
    g.closePath();
    g.fillStyle=col; g.fill();
    g.strokeStyle=PAL.line; g.lineWidth=1.0; g.stroke();
    if(s===0){ // 안감 힌트
      g.beginPath();
      g.moveTo(ex+16,ey+4);
      g.quadraticCurveTo(ex+6,ey-6, bx-4-lag, w.y+50);
      g.strokeStyle=PAL.lining; g.lineWidth=3; g.globalAlpha=0.8; g.stroke();
      g.globalAlpha=1;
    }
  }
}

  g.quadraticCurveTo(nt.x,nt.y+19.5, nt.x+8.6,nt.y+16.5);
  g.closePath();
  g.fillStyle=shade(PAL.coat,12); g.fill();
  g.strokeStyle=PAL.line; g.lineWidth=0.9; g.stroke();
  g.strokeStyle=PAL.trim; g.lineWidth=0.8;
  g.beginPath(); g.moveTo(nt.x-6.8,nt.y+6.6); g.lineTo(nt.x+6.6,nt.y+7.4); g.stroke();
}
// --- 캐릭터 합성 (페인터 순서) --------------------------------------
function drawChar(g,P){
  drawArm(g,P,"F");
  drawLegs(g,P,"F");
  coatTails(g,P);
  hairBack(g,P);
  drawSaya(g,P);
  drawLegs(g,P,"N");
  drawTorso(g,P);
  drawHead(g,P);
  hairFront(g,P);
  drawSword(g,P);
  drawArm(g,P,"N");
}

// --- 이펙트: 잔상 / 검 트레일 / 일섬 아크 / 스파크 --------------------
let gCv=null,gCtx=null;
function drawGhostInline(g,P,alpha){ // 현재 변환=모델공간 가정
  if(!gCv){gCv=document.createElement("canvas");
    gCv.width=760;gCv.height=540;gCtx=gCv.getContext("2d");}
  gCtx.setTransform(1,0,0,1,0,0);
  gCtx.clearRect(0,0,760,540);
  gCtx.globalCompositeOperation="source-over";
  gCtx.translate(240,500);
  drawChar(gCtx,P);
  gCtx.globalCompositeOperation="source-in";
  gCtx.fillStyle="rgb(122,168,214)";
  gCtx.fillRect(-240,-500,760,540);
  g.save();
  g.globalAlpha=alpha;
  g.drawImage(gCv,-240,-500);
  g.restore();
}
function drawTrail(g,anim,t,strength){
  if(strength<=0.02)return;
  const N=15,DT=0.013;
  const tips=[],guards=[];
  for(let k=0;k<N;k++){
    const P=pose(anim,t-k*DT);
    if(!P.j.swordTip){tips.push(null);guards.push(null);continue;}
    tips.push(P.j.swordTip);
    guards.push({x:lerp(P.j.swordGrip.x,P.j.swordTip.x,0.22),
                 y:lerp(P.j.swordGrip.y,P.j.swordTip.y,0.22)});
  }
  g.save();
  g.globalCompositeOperation="lighter";
  for(let k=0;k<N-1;k++){
    if(!tips[k]||!tips[k+1])continue;
    const u=k/(N-1), a=(1-u)*(1-u)*0.5*strength;
    if(a<=0.01)continue;
    const cr=Math.round(lerp(255,159,u)), cg=Math.round(lerp(255,216,u));
    g.beginPath();
    g.moveTo(tips[k].x,tips[k].y); g.lineTo(tips[k+1].x,tips[k+1].y);
    g.lineTo(guards[k+1].x,guards[k+1].y); g.lineTo(guards[k].x,guards[k].y);
    g.closePath();
    g.fillStyle="rgba("+cr+","+cg+",255,"+a.toFixed(3)+")";
    g.fill();
  }
  g.restore();
}
function drawArc(g,P){ // 발도 일섬: 화면 가로지르는 흰-청 아크
  const a=P.fx.arc; if(a<=0.02)return;
  const j=P.j; if(!j.swordGrip)return;
  const cx=j.swordGrip.x-60, cy=j.swordGrip.y-8;
  g.save();
  g.globalCompositeOperation="lighter";
  for(const AR of [[150,196,0.5],[120,150,0.30],[196,214,0.16]]){
    const r0=AR[0],r1=AR[1],al=AR[2];
    g.beginPath();
    g.arc(cx,cy,r1,-0.34,0.30);
    g.arc(cx,cy,r0,0.30,-0.34,true);
    g.closePath();
    const gr=g.createRadialGradient(cx,cy,r0,cx,cy,r1);
    gr.addColorStop(0,"rgba(159,216,255,0)");
    gr.addColorStop(0.7,"rgba(190,230,255,"+(al*a).toFixed(3)+")");
    gr.addColorStop(1,"rgba(255,255,255,"+Math.min(1,al*a*1.5).toFixed(3)+")");
    g.fillStyle=gr; g.fill();
  }
  g.strokeStyle="rgba(255,255,255,"+(0.9*a).toFixed(3)+")";
  g.lineWidth=2.2; g.lineCap="round";
  g.beginPath(); g.arc(cx,cy,206,-0.30,0.26); g.stroke();
  g.restore();
}
function drawSparks(g,P){
  const s=P.fx.spark; if(s<=0.02)return;
  const j=P.j;
  const ox=j.swordTip?j.swordTip.x:P.px+40;
  const oy=j.swordTip?Math.min(-2,j.swordTip.y):-4;
  g.save(); g.globalCompositeOperation="lighter";
  for(let i=0;i<10;i++){
    const a=hash(i*3.7)*TAU, r=6+hash(i*9.1)*30*(1-s*0.5);
    const x=ox+Math.cos(a)*r, y=oy-Math.abs(Math.sin(a))*r*0.8;
    g.strokeStyle="rgba(200,235,255,"+(s*(0.4+hash(i)*0.5)).toFixed(2)+")";
    g.lineWidth=1.4;
    g.beginPath(); g.moveTo(ox,oy); g.lineTo(x,y); g.stroke();
  }
  g.restore();
}
// --- 뼈대 오버레이 ----------------------------------------------------
function drawBones(g,P){
  const j=P.j;
  g.save(); g.lineCap="round";
  const seg=(a,b)=>{g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();};
  g.strokeStyle="rgba(80,255,200,0.9)"; g.lineWidth=1.6;
  seg(j.pelvis,j.spine1);seg(j.spine1,j.spine2);seg(j.spine2,j.chest);
  seg(j.chest,j.neckTop);seg(j.neckTop,j.head);
  for(const s of["N","F"]){
    seg(j.pelvis,j["hip"+s]);seg(j["hip"+s],j["knee"+s]);
    seg(j["knee"+s],j["ankle"+s]);seg(j["ankle"+s],j["toe"+s]);
    seg(j.chest,j["sh"+s]);seg(j["sh"+s],j["el"+s]);seg(j["el"+s],j["wr"+s]);
  }
  if(j.swordGrip&&j.swordTip){
    g.strokeStyle="rgba(255,220,90,0.8)";seg(j.swordGrip,j.swordTip);
  }
  g.fillStyle="#5cffd0";
  for(const k of["pelvis","spine1","spine2","chest","neckTop","head",
    "hipN","kneeN","ankleN","toeN","hipF","kneeF","ankleF","toeF",
    "shN","elN","wrN","shF","elF","wrF"]){
    const p=j[k]; if(!p)continue;
    g.beginPath();g.arc(p.x,p.y,2.4,0,TAU);g.fill();
  }
  g.strokeStyle="#ff6fd8"; g.lineWidth=1.5;
  const cross=(x,y)=>{g.beginPath();g.moveTo(x-5,y);g.lineTo(x+5,y);
    g.moveTo(x,y-5);g.lineTo(x,y+5);g.stroke();};
  cross(P.footN.x,P.footN.y-B.ankleH); cross(P.footF.x,P.footF.y-B.ankleH);
  if(P.armN.mode==="ik")cross(j.wrN.x,j.wrN.y);
  if(P.armF.mode==="ik")cross(j.wrF.x,j.wrF.y);
  g.strokeStyle="#6dff6d"; g.lineWidth=1.6;
  if(P.groundedN)g.strokeRect(P.footN.x-7,-4,14,4);
  if(P.groundedF)g.strokeRect(P.footF.x-7,-4,14,4);
  g.restore();
}

// ==== 6. 배경/씬 ==================================================
function drawBG(g,W,H,t,gy,full){
  const grd=g.createLinearGradient(0,0,0,H);
  grd.addColorStop(0,"#0a0d18"); grd.addColorStop(0.62,"#121830");
  grd.addColorStop(1,"#0e1224");
  g.fillStyle=grd; g.fillRect(0,0,W,H);
  // 보름달 — 캐릭터 뒤 크게
  const mx=W*0.56, my=H*0.31, mr=Math.min(W,H)*(full?0.28:0.33);
  for(const HL of [[1.55,0.045],[1.25,0.075],[1.06,0.11]]){
    g.beginPath();g.arc(mx,my,mr*HL[0],0,TAU);
    g.fillStyle=PAL.moonHalo+HL[1]+")";g.fill();
  }
  g.beginPath(); g.arc(mx,my,mr,0,TAU);
  const mg=g.createRadialGradient(mx-mr*0.3,my-mr*0.3,mr*0.1,mx,my,mr);
  mg.addColorStop(0,"#f4f7fb"); mg.addColorStop(0.8,PAL.moon); mg.addColorStop(1,"#cfd8e6");
  g.fillStyle=mg; g.fill();
  g.globalAlpha=0.10; g.fillStyle="#b9c3d4";
  g.beginPath();g.arc(mx-mr*0.3,my+mr*0.2,mr*0.16,0,TAU);g.fill();
  g.beginPath();g.arc(mx+mr*0.25,my-mr*0.28,mr*0.1,0,TAU);g.fill();
  g.beginPath();g.arc(mx+mr*0.1,my+mr*0.4,mr*0.08,0,TAU);g.fill();
  g.globalAlpha=1;
  // 별 + 떠다니는 입자
  const NS=full?70:24;
  for(let i=0;i<NS;i++){
    const x=hash(i*1.3)*W, y=hash(i*2.7)*gy*0.9;
    const tw=0.35+0.5*Math.sin(t*1.4+i*2.2);
    g.fillStyle="rgba(210,225,250,"+(0.14+0.3*hash(i)*tw).toFixed(2)+")";
    g.fillRect(x,y,1.6,1.6);
  }
  const NP=full?26:10;
  for(let i=0;i<NP;i++){
    const sp=0.5+hash(i*5.1)*1.2;
    const x=fract(hash(i*7.7)+t*0.016*sp)*W;
    const y=gy-10-hash(i*3.3)*gy*0.72+Math.sin(t*0.8+i)*8;
    g.fillStyle="rgba(159,216,255,"+(0.10+0.22*hash(i+40)).toFixed(2)+")";
    g.beginPath(); g.arc(x,y,1.1+hash(i)*1.6,0,TAU); g.fill();
  }
  // 안개층
  for(let i=0;i<3;i++){
    const y=gy-8-i*20, a=0.05-i*0.012;
    g.fillStyle="rgba(160,180,215,"+a.toFixed(3)+")";
    g.beginPath();
    g.ellipse(W*0.5+Math.sin(t*0.2+i*2)*40, y, W*0.62, 14+i*7, 0,0,TAU);
    g.fill();
  }
  // 바닥
  const fg=g.createLinearGradient(0,gy,0,H);
  fg.addColorStop(0,"#151a2e"); fg.addColorStop(1,"#0b0e1a");
  g.fillStyle=fg; g.fillRect(0,gy,W,H-gy);
  g.strokeStyle="rgba(140,160,200,0.25)"; g.lineWidth=1;
  g.beginPath(); g.moveTo(0,gy); g.lineTo(W,gy); g.stroke();
}
// 씬 1프레임 렌더 (실시간/몽타주 공용)
function renderScene(g,anim,t,W,H,scale,opts){
  opts=opts||{};
  const P=pose(anim,t);
  let camX=(opts.camX!==undefined?opts.camX:W*0.5);
  if(opts.follow)camX-=P.px*scale*opts.follow;
  camX+=(P.fx.shakeX||0)*scale;
  const gy=(opts.gy!==undefined?opts.gy:H*0.86);
  const camY=gy+(P.fx.shakeY||0)*scale;
  drawBG(g,W,H,t,gy,!!opts.full);
  g.save();
  g.translate(camX,camY); g.scale(scale,scale);
  // 바닥 그림자 + 은은한 반사
  g.beginPath(); g.ellipse(P.px+3,-1,46,7,0,0,TAU);
  g.fillStyle="rgba(0,0,0,0.42)"; g.fill();
  if(!opts.noReflect){
    g.save(); g.scale(1,-1); g.globalAlpha=0.07;
    drawChar(g,P); g.restore();
  }
  if(P.fx.ghosts&&P.fx.ghosts.length&&!opts.noGhost){
    for(let i=P.fx.ghosts.length-1;i>=0;i--){
      const gp=pose(anim,t-P.fx.ghosts[i]);
      drawGhostInline(g,gp,0.13+0.11*(1-i/P.fx.ghosts.length));
    }
  }
  drawTrail(g,anim,t,P.fx.trail);
  drawChar(g,P);
  drawArc(g,P);
  drawSparks(g,P);
  if(opts.bones)drawBones(g,P);
  g.restore();
  if(P.fx.flash>0.02&&!opts.noFlash){
    g.fillStyle="rgba(230,245,255,"+(P.fx.flash*0.5).toFixed(3)+")";
    g.fillRect(0,0,W,H);
  }
  return P;
}

// ==== 7. UI·실시간 루프 / 8. 몽타주 ================================
const cv=document.getElementById("cv"), ctx=cv.getContext("2d");
const MONTAGE=/[?&]montage/.test(location.search);
if(MONTAGE){
  document.body.classList.add("montage");
  drawMontage();
}else{
  startLive();
}
function startLive(){
  let anim="idle", animT=0, last=performance.now(), speed=1, showBones=false;
  const dpr=Math.min(2,window.devicePixelRatio||1);
  function resize(){
    cv.width=innerWidth*dpr; cv.height=innerHeight*dpr;
    cv.style.width=innerWidth+"px"; cv.style.height=innerHeight+"px";
  }
  addEventListener("resize",resize); resize();
  document.querySelectorAll("#panel button").forEach(b=>{
    b.addEventListener("click",()=>{
      document.querySelectorAll("#panel button").forEach(x=>x.classList.remove("on"));
      b.classList.add("on"); anim=b.dataset.anim; animT=0;
    });
  });
  document.getElementById("bones").addEventListener("change",e=>showBones=e.target.checked);
  document.getElementById("speed").addEventListener("input",e=>speed=+e.target.value);
  function frame(now){
    const dt=Math.min(0.05,(now-last)/1000); last=now;
    animT+=dt*speed;
    const W=innerWidth,H=innerHeight;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const scale=Math.min(H*0.78/380, W*0.5/380);
    renderScene(ctx,anim,animT,W,H,scale,
      {full:true,gy:H*0.85,follow:anim==="battou"?0.75:0,bones:showBones});
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
// --- 몽타주: 1680×1500, 로드 즉시 동기 렌더 ------------------------
function drawMontage(){
  const W=1680,H=1500;
  cv.width=W; cv.height=H;
  cv.style.width=W+"px"; cv.style.height=H+"px";
  ctx.fillStyle="#0d1120"; ctx.fillRect(0,0,W,H);
  const rowAH=395,rowBH=395,rowCH=H-rowAH-rowBH-90;
  function cell(x,y,w,h,label,fn){
    ctx.save();
    ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
    ctx.translate(x,y);
    fn(w,h);
    ctx.restore();
    ctx.strokeStyle="#2a3050"; ctx.lineWidth=1;
    ctx.strokeRect(x+0.5,y+0.5,w,h);
    ctx.fillStyle="#ffffff";
    ctx.font='13px "Segoe UI","Malgun Gothic",sans-serif';
    ctx.textAlign="center";
    ctx.fillText(label,x+w/2,y+h+17);
  }
  function head(y,txt){
    ctx.fillStyle="#9fb0d4"; ctx.textAlign="left";
    ctx.font='bold 14px "Segoe UI","Malgun Gothic",sans-serif';
    ctx.fillText(txt,10,y);
  }
  // Row A: 걷기 6위상
  head(18,"Row A — 걷기 사이클 6위상 (접지 IK · 미끄러짐 0)");
  const cw=W/6;
  for(let i=0;i<6;i++){
    const t=i/6*1.05;
    const lbl="t="+i+"/6 · "+(i===0?"접지(근)":i===3?"접지(원)":i===1||i===4?"교차":"지지");
    cell(i*cw,26,cw,rowAH-45,lbl,(w,h)=>{
      renderScene(ctx,"walk",t,w,h,(h*0.82)/380,{gy:h*0.9,noReflect:false});
    });
  }
  // Row B: 발도 6키
  const yB=rowAH+8;
  head(yB+12,"Row B — 발도 시퀀스 (납도→예비→섬광→극점→잔심→납도)");
  const btT=[0.5,1.02,1.24,1.365,1.9,3.9];
  const btL=["납도","예비","섬광 스텝","극점 일섬","잔심","납도(찰칵)"];
  for(let i=0;i<6;i++){
    cell(i*cw,yB+20,cw,rowBH-45,btL[i]+" (t="+btT[i]+"s)",(w,h)=>{
      renderScene(ctx,"battou",btT[i],w,h,(h*0.80)/390,
        {gy:h*0.9,follow:1,camX:w*0.5,noFlash:true});
    });
  }
  // Row C: 뷰티샷 / 얼굴 클로즈업 / 리깅 오버레이 / 트레일 컷
  const yC=rowAH+rowBH+16;
  head(yC+12,"Row C — ①뷰티샷 ②얼굴 클로즈업 ③리깅 오버레이(뼈·IK 타깃·접지 락) ④베기 트레일+잔상");
  const cw4=W/4, ch4=rowCH;
  cell(0,yC+20,cw4,ch4,"① 전신 뷰티샷 (대기)",(w,h)=>{
    renderScene(ctx,"idle",0.8,w,h,(h*0.86)/380,{gy:h*0.92,full:true});
  });
  cell(cw4,yC+20,cw4,ch4,"② 얼굴 클로즈업 (머리 세로 460px+)",(w,h)=>{
    // 헤드 클로즈업: 머리높이 46 → scale 10, 얼굴(로컬 +5,-1) 중심 프레이밍
    const t=0.8, P=pose("idle",t);
    drawBG(ctx,w,h,t,h*0.97,false);
    const sc=10;
    ctx.save();
    ctx.translate(w*0.5-(P.j.head.x+5)*sc, h*0.50-(P.j.head.y-1)*sc);
    ctx.scale(sc,sc);
    drawChar(ctx,P);
    ctx.restore();
  });
  cell(cw4*2,yC+20,cw4,ch4,"③ 리깅 오버레이 (걷기)",(w,h)=>{
    renderScene(ctx,"walk",0.30,w,h,(h*0.84)/380,{gy:h*0.92,bones:true});
  });
  cell(cw4*3,yC+20,cw4,ch4,"④ 베기 — 트레일+잔상 (S1 임팩트)",(w,h)=>{
    renderScene(ctx,"slash",0.56,w,h,(h*0.80)/390,{gy:h*0.92});
  });
  // 타이틀
  ctx.fillStyle="#e8ecf2"; ctx.textAlign="right";
  ctx.font='bold 15px "Segoe UI","Malgun Gothic",sans-serif';
  ctx.fillText("아스렐 · 銀月의 검성 — 절차적 스켈레톤 + IK",W-12,18);
}
