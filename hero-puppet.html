<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>루시엘 — 황금 사자의 왕자 · 컷아웃 리깅</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#1c1410;
    font-family:"Segoe UI","Malgun Gothic",sans-serif;}
  #cv{display:block;width:100vw;height:100vh;cursor:grab;}
  #cv.grabbing{cursor:grabbing;}
  #err{position:fixed;top:4px;left:4px;color:#ff5252;font:bold 13px "Segoe UI","Malgun Gothic",sans-serif;
    z-index:99;white-space:pre-wrap;max-width:90vw;pointer-events:none;text-shadow:0 1px 2px #000;}
  #back{position:fixed;top:10px;left:12px;z-index:10;color:#d4af5a;text-decoration:none;
    font-size:13px;opacity:.85;}
  #back:hover{opacity:1;text-decoration:underline;}
  #badge{position:fixed;top:10px;right:14px;z-index:10;color:#f7f3e9;background:rgba(212,175,90,.16);
    border:1px solid rgba(212,175,90,.45);border-radius:20px;padding:4px 14px;font-size:12px;letter-spacing:.5px;}
  #title{position:fixed;top:34px;left:0;right:0;text-align:center;pointer-events:none;z-index:5;}
  #title h1{margin:0;color:#f4de9c;font-size:26px;font-weight:600;letter-spacing:2px;
    text-shadow:0 2px 12px rgba(212,175,90,.35);}
  #title p{margin:2px 0 0;color:#c9b28a;font-size:12px;letter-spacing:1px;}
  #ui{position:fixed;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:8px;
    flex-wrap:wrap;z-index:10;align-items:center;}
  #ui button{background:rgba(43,58,92,.55);color:#f7f3e9;border:1px solid rgba(212,175,90,.5);
    border-radius:8px;padding:8px 16px;font-family:inherit;font-size:14px;cursor:pointer;
    transition:background .15s,transform .1s;}
  #ui button:hover{background:rgba(212,175,90,.35);}
  #ui button.on{background:#d4af5a;color:#241a10;font-weight:600;}
  #ui .sep{width:1px;height:24px;background:rgba(212,175,90,.4);margin:0 4px;}
  #ui label{color:#c9b28a;font-size:12px;display:flex;align-items:center;gap:6px;}
  #ui input[type=range]{width:110px;accent-color:#d4af5a;}
  #hint{position:fixed;bottom:64px;left:0;right:0;text-align:center;color:rgba(201,178,138,.75);
    font-size:12px;pointer-events:none;z-index:5;letter-spacing:.5px;}
</style>
</head>
<body>
<div id="err"></div>
<a id="back" href="heroes.html">← 용사 전시관</a>
<div id="badge">컷아웃 리깅 · Spine식 퍼펫</div>
<div id="title"><h1>루시엘</h1><p>황금 사자의 왕자 · 왕실 검사</p></div>
<canvas id="cv"></canvas>
<div id="hint">손 · 검끝 · 발 · 머리를 드래그해 보세요 — 놓으면 스프링으로 복귀합니다</div>
<div id="ui">
  <button data-anim="idle" class="on">대기</button>
  <button data-anim="greet">인사</button>
  <button data-anim="lunge">찌르기</button>
  <button data-anim="jump">점프</button>
  <button data-anim="victory">승리</button>
  <div class="sep"></div>
  <button id="btnBones">뼈대 보기</button>
  <button id="btnExplode">부품 분해</button>
  <div class="sep"></div>
  <label>속도 <input id="spd" type="range" min="0.2" max="2" step="0.1" value="1"></label>
</div>
<script>
"use strict";
// ============================================================================
// ==== 섹션 맵 ==============================================================
// ==== 1. 팔레트/유틸  2. 파트 베이크(오프스크린)  3. 리그(씬그래프)      ====
// ==== 4. 애니메이션(키프레임 트랙 + pose 순수함수)  5. 렌더/이펙트       ====
// ==== 6. IK/드래그 인터랙션  7. UI  8. 몽타주(?montage)                  ====
// ============================================================================
const errBox=document.getElementById('err');
window.onerror=function(m,s,l,c){errBox.textContent+='ERR: '+m+' @'+(s||'').split('/').pop()+':'+l+'\n';};
window.addEventListener('unhandledrejection',e=>{errBox.textContent+='REJ: '+e.reason+'\n';});

// ==== 1. 팔레트 / 유틸 ======================================================
const PAL={
  outline:'#241a20', outThin:'#3a2b30',
  skin:'#ffe9da', skinSh:'#f0c9ad', blush:'rgba(255,140,120,.28)',
  hair:'#f4de9c', hairSh:'#d9b45e', hairDp:'#a9823a', hairRim:'#fff3c9', hairLine:'#6b5426',
  ivory:'#f7f3e9', ivorySh:'#ddd2be', gold:'#d4af5a', goldD:'#a9823a', goldL:'#f2dfa8',
  navy:'#2b3a5c', navyD:'#1d2940', navyL:'#3d5480',
  cape:'#b03042', capeD:'#7e2231', capeL:'#cf4c5e',
  steel:'#cfd6e2', steelL:'#f5f8ff', steelD:'#8a93a6',
  bg:'#1c1410'
};
const TAU=Math.PI*2, D=Math.PI/180;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=t=>t*t*(3-2*t);
function path(c,d){c.beginPath();c.moveTo(d[0],d[1]);
  for(let i=2;i<d.length;i++){const s=d[i];
    if(s.length===6)c.bezierCurveTo(s[0],s[1],s[2],s[3],s[4],s[5]);
    else if(s.length===4)c.quadraticCurveTo(s[0],s[1],s[2],s[3]);
    else c.lineTo(s[0],s[1]);}}
// 테이퍼 머리카락 가닥: 뿌리(x0,y0,폭w) → 제어(cx,cy) → 뾰족한 끝(x1,y1)
function lockShape(c,x0,y0,cx,cy,x1,y1,w){
  const dx=cx-x0,dy=cy-y0,L=Math.hypot(dx,dy)||1,nx=-dy/L*w*.5,ny=dx/L*w*.5;
  c.beginPath();c.moveTo(x0+nx,y0+ny);
  c.quadraticCurveTo(cx+nx*.55,cy+ny*.55,x1,y1);
  c.quadraticCurveTo(cx-nx*.55,cy-ny*.55,x0-nx,y0-ny);
  c.closePath();}
function ell(c,x,y,rx,ry,rot){c.beginPath();c.ellipse(x,y,rx,ry,rot||0,0,TAU);}
function cap(c,x,y,r,fill){ell(c,x,y,r,r,0);c.fillStyle=fill;c.fill();} // 관절 은폐 캡

// ==== 2. 파트 베이크 ========================================================
// 각 파트는 초기화 때 딱 한 번 오프스크린 캔버스에 그려진다.
// makePart(이름, x0,y0,x1,y1 [디자인 좌표 bbox], bs 베이크배율, drawFn(ctx))
// 피벗은 디자인 좌표 (0,0). 매 프레임은 리지드 트랜스폼만 적용.
const PARTS={};
function makePart(name,x0,y0,x1,y1,bs,fn){
  const w=Math.ceil((x1-x0)*bs)+4,h=Math.ceil((y1-y0)*bs)+4;
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;
  const c=cv.getContext('2d');
  c.translate(-x0*bs+2,-y0*bs+2);c.scale(bs,bs);
  c.lineJoin='round';c.lineCap='round';
  fn(c);
  PARTS[name]={cv,bs,ox:x0*bs-2,oy:y0*bs-2,w,h,x0,y0,x1,y1};
  return PARTS[name];
}

// ---- 2a. 두상 (피벗 = 목 위 지점, 얼굴은 3/4 우향) ----
makePart('head',-46,-112,52,6,5,c=>{
  // 두상: 계란형 + V라인 턱
  path(c,[-38,-52, [-44,-84,-30,-104,0,-104], [26,-104,42,-88,43,-60],
    [44,-38,35,-16,16,-5], [4,-1,-12,-12,-25,-28], [-33,-38,-38,-44,-38,-52]]);
  c.closePath();
  c.fillStyle=PAL.skin;c.fill();
  c.lineWidth=1.6;c.strokeStyle=PAL.outline;c.stroke();
  // 귀 (이미지 좌측, 옆머리에 일부 가려짐)
  path(c,[-36,-56, [-44,-58,-46,-46,-40,-40], [-37,-37,-35,-42,-36,-50]]);
  c.closePath();c.fillStyle=PAL.skin;c.fill();c.lineWidth=1.3;c.stroke();
  path(c,[-40,-52,[-42,-48,-39,-44,-38,-46]]);c.lineWidth=.8;c.strokeStyle=PAL.skinSh;c.stroke();
  // 셀셰이딩: 턱밑 그림자 + 이마 왼쪽 음영
  c.fillStyle='rgba(214,160,125,.5)';
  path(c,[16,-5,[4,-1,-12,-12,-25,-28],[-18,-22,-4,-14,4,-12],[10,-9,14,-7,16,-5]]);
  c.closePath();c.fill();
  // 혈색: 뺨/코끝
  c.fillStyle=PAL.blush;
  ell(c,-20,-32,7,4,-.2);c.fill();ell(c,32,-32,5.5,3.5,.2);c.fill();
  // 코: 코끝 짧은 획만
  c.strokeStyle='rgba(160,105,80,.85)';c.lineWidth=1.4;
  c.beginPath();c.moveTo(23,-33);c.quadraticCurveTo(25,-30,22,-28);c.stroke();
  // 아랫입술 밑 그림자 힌트
  c.strokeStyle='rgba(190,130,105,.5)';c.lineWidth=1.1;
  c.beginPath();c.moveTo(11,-13);c.quadraticCurveTo(14,-11.6,17,-13);c.stroke();
});

// ---- 2b. 눈 (상태 3종 × 좌우) : dir=-1 왼눈(이미지 좌, 또렷) / +1 오른눈(3/4로 약간 좁게)
function bakeEye(name,dir,ew,state){
  makePart(name,-16,-12,16,12,5,c=>{
    const w=ew/2;             // 반폭
    const oc=dir*w, ic=-dir*w; // 바깥/안쪽 눈꼬리 x
    if(state==='closed'){     // 감은 눈: 아래로 살짝 처지는 부드러운 속눈썹 호
      c.strokeStyle=PAL.outline;c.lineWidth=2.2;
      c.beginPath();c.moveTo(ic,1.5);c.quadraticCurveTo(0,5.2,oc,2.2);c.stroke();
      c.lineWidth=1.1;c.strokeStyle='rgba(36,26,32,.55)';
      c.beginPath();c.moveTo(ic*.8,-2.5);c.quadraticCurveTo(0,-.5,oc*.8,-2);c.stroke(); // 쌍꺼풀 잔선
      c.beginPath();c.moveTo(oc,2.2);c.lineTo(oc+dir*2.4,3.8);c.lineWidth=1.8;c.strokeStyle=PAL.outline;c.stroke();
      return;
    }
    const lidY=state==='half'?-1.2:-6.2;   // 위 눈꺼풀 정점
    const openB=5.2;                        // 아래 라인
    // 흰자
    path(c,[ic,.8,[ic*.45,lidY-1, oc*.35,lidY-1, oc,-1],[oc*.6,openB, ic*.5,openB, ic,.8]]);
    c.closePath();c.fillStyle='#fdf6f0';c.fill();
    // 홍채: 세로 타원, 3톤 그라데이션 + 동공 + 하이라이트 2
    c.save();c.clip();
    const ix=.6,iy=state==='half'?1.6:.5;
    const g=c.createLinearGradient(ix,iy-6.4,ix,iy+6.4);
    g.addColorStop(0,'#53340f');g.addColorStop(.42,'#c98a2e');g.addColorStop(1,'#f6cf78');
    ell(c,ix,iy,5.3,6.4,0);c.fillStyle=g;c.fill();
    ell(c,ix,iy,5.3,6.4,0);c.lineWidth=.8;c.strokeStyle='#4a2e10';c.stroke();
    ell(c,ix,iy+.5,2.3,3,0);c.fillStyle='#31200c';c.fill();          // 동공
    c.fillStyle='rgba(60,38,14,.4)';                                  // 눈꺼풀이 드리운 그림자
    c.fillRect(ix-7,lidY-1.5,14,state==='half'?3.6:2.8);
    ell(c,ix-2.1,iy-2.9,2.2,2.2,0);c.fillStyle='#fff';c.fill();      // 상단 큰 하이라이트
    ell(c,ix+2.4,iy+3.4,1.1,1.1,0);c.fillStyle='rgba(255,233,192,.92)';c.fill(); // 하단 반사광
    c.restore();
    // 위 눈꺼풀: 굵은 라인 + 눈꼬리 속눈썹 뭉침
    c.strokeStyle=PAL.outline;c.lineCap='round';
    c.lineWidth=2.6;
    c.beginPath();c.moveTo(ic,.8);c.quadraticCurveTo(ic*.4,lidY-1.6,oc*.4,lidY-1.2);c.stroke();
    c.lineWidth=3.1;
    c.beginPath();c.moveTo(oc*.35,lidY-1.25);c.quadraticCurveTo(oc*.8,lidY,oc,-1);c.stroke();
    path(c,[oc,-1,[oc+dir*3.2,-3.2,oc+dir*3.6,-1.6,oc+dir*1.2,.6],[oc*.9,1.4,oc*.92,.2,oc,-1]]);
    c.closePath();c.fillStyle=PAL.outline;c.fill();                   // 속눈썹 플릭
    // 아래 라인: 얇고 연하게 안쪽 2/3
    c.strokeStyle='rgba(150,95,75,.6)';c.lineWidth=1.1;
    c.beginPath();c.moveTo(ic,1.2);c.quadraticCurveTo(ic*.2,openB+.6,oc*.35,openB-.6);c.stroke();
    // 쌍꺼풀 라인 얇게
    c.strokeStyle='rgba(36,26,32,.4)';c.lineWidth=.9;
    c.beginPath();c.moveTo(ic*.7,lidY-3.2);c.quadraticCurveTo(0,lidY-4.6,oc*.7,lidY-3.4);c.stroke();
  });
}
for(const[st,sf]of[['open',''],['half','_h'],['closed','_c']]){
  bakeEye('eyeL'+sf,-1,26,st);bakeEye('eyeR'+sf,1,22,st);
}

// ---- 2c. 눈썹 ----
function bakeBrow(name,dir){
  makePart(name,-17,-6,17,6,5,c=>{
    c.strokeStyle='#c79b4e';c.lineWidth=2.1;c.lineCap='round';
    c.beginPath();c.moveTo(-dir*14,1.5);
    c.quadraticCurveTo(0,-3.6,dir*14.5,-.5);c.stroke();
    c.strokeStyle='rgba(107,84,38,.8)';c.lineWidth=1;
    c.beginPath();c.moveTo(-dir*13,2.6);c.quadraticCurveTo(0,-2.2,dir*13.5,.6);c.stroke();
  });
}
bakeBrow('browL',-1);bakeBrow('browR',1);

// ---- 2d. 입 (상태 4종) ----
function bakeMouth(name,fn){makePart(name,-12,-8,12,10,5,fn);}
bakeMouth('m_smile',c=>{
  c.strokeStyle='#a05a48';c.lineWidth=1.7;c.lineCap='round';
  c.beginPath();c.moveTo(-6.5,-.5);c.quadraticCurveTo(0,3.2,7,-1.2);c.stroke();
  c.strokeStyle='rgba(160,90,72,.4)';c.lineWidth=1;
  c.beginPath();c.moveTo(-2,5.4);c.quadraticCurveTo(1,6.4,4,5);c.stroke();
});
bakeMouth('m_smirk',c=>{
  c.strokeStyle='#a05a48';c.lineWidth=1.7;c.lineCap='round';
  c.beginPath();c.moveTo(-5,1);c.quadraticCurveTo(2,2.6,7.5,-2.6);c.stroke();
  c.beginPath();c.moveTo(7.5,-2.6);c.lineTo(6.7,-.2);c.lineWidth=1.2;c.stroke();
});
bakeMouth('m_open',c=>{
  path(c,[-6,-1,[-2,-2.8,4,-2.8,7,-1.6],[6,5.8,-3,6.4,-6,-1]]);c.closePath();
  c.fillStyle='#7e3540';c.fill();c.lineWidth=1.3;c.strokeStyle='#8e4a42';c.stroke();
  path(c,[-3.5,3.6,[0,5.6,3,5.2,5,2.6],[2,4.4,-1,4.6,-3.5,3.6]]);c.closePath();
  c.fillStyle='#c96a6a';c.fill();
  c.fillStyle='#fff';c.fillRect(-4.2,-1.6,10,1.7);
});
bakeMouth('m_o',c=>{
  ell(c,.5,1,2.6,3.2,0);c.fillStyle='#7e3540';c.fill();
  c.lineWidth=1.2;c.strokeStyle='#8e4a42';c.stroke();
});

// ---- 2e. 뒷머리 실루엣 (피벗 = 머리 노드와 동일: 목 위) ----
makePart('hairBack',-60,-120,62,36,5,c=>{
  path(c,[-50,-50, [-58,-90,-30,-116,2,-116], [34,-116,56,-92,54,-56],
    [53,-38,50,-20,44,-6],        // 오른쪽 아래로
    [40,6,34,16,26,10],[30,22,22,32,14,22],[16,30,6,34,0,24], // 목덜미 톱니 가닥
    [-4,34,-14,32,-14,20],[-18,30,-28,28,-26,14],[-34,24,-44,16,-40,0],
    [-48,-14,-52,-32,-50,-50]]);
  c.closePath();
  c.fillStyle=PAL.hairSh;c.fill();
  c.lineWidth=1.8;c.strokeStyle=PAL.hairLine;c.stroke();
  // 안쪽 깊은 그림자
  c.fillStyle=PAL.hairDp;
  lockShape(c,-30,-30,-26,6,-20,26,16);c.fill();
  lockShape(c,20,-24,26,4,20,26,18);c.fill();
  lockShape(c,-4,-16,0,10,4,28,20);c.fill();
  // 정수리 림라이트 (톱니 활 모양)
  c.fillStyle='rgba(255,243,201,.28)';
  path(c,[-38,-84,[-20,-104,20,-106,44,-82],[30,-92,24,-84,18,-92],
    [10,-100,4,-88,-4,-97],[-12,-104,-16,-90,-24,-96],[-30,-99,-34,-90,-38,-84]]);
  c.closePath();c.fill();
});

// ---- 2f. 앞머리 (피벗 = 정수리 앞, head-local (2,-96)에 부착) ----
// 두피를 감싸는 캡 + 좌우로 흘러내리는 곡선 가닥. 끝은 눈썹~눈 위에서 멈춘다.
makePart('hairFront',-48,-20,50,60,5,c=>{
  // 두피 캡 (스컬을 살짝 감싸는 볼륨)
  path(c,[-42,22,[-46,-2,-30,-15,-2,-15],[28,-15,46,-2,44,20],[20,10,-20,10,-42,22]]);
  c.closePath();c.fillStyle=PAL.hair;c.fill();
  const L=[ // [뿌리x,y, 제어x,y, 끝x,y, 폭, 색, alpha]  가르마 x=+4, 좌우로 스윕
    [-8,-12, -30,4,  -41,30, 17, PAL.hairSh,1],   // 왼쪽 큰 옆쓸림
    [-2,-13, -18,8,  -27,40, 15, PAL.hair,1],
    [2,-13,  -6,12,  -11,42, 14, PAL.hair,1],
    [5,-13,  6,14,   3,40,  12, PAL.hairSh,1],
    [8,-13,  16,12,  17,38,  13, PAL.hair,1],
    [12,-12, 26,10,  30,36,  13, PAL.hair,1],
    [16,-11, 36,6,   42,30,  13, PAL.hairSh,1],
    [20,-9,  42,0,   47,20,  11, PAL.hair,1],
    [-14,-11,-38,0,  -45,22, 13, PAL.hair,1],
    [4,-13,  10,20,  8,48,   6, PAL.hair,.85],    // 눈을 스치는 반투명 가닥
    [-4,-13, -14,20, -16,50, 6, PAL.hair,.85]
  ];
  for(const[x0,y0,cx,cy,x1,y1,w,col,al]of L){
    c.globalAlpha=al;
    lockShape(c,x0,y0,cx,cy,x1,y1,w);
    c.fillStyle=col;c.fill();
    c.lineWidth=1.1;c.strokeStyle=PAL.hairLine;c.stroke();
    c.globalAlpha=1;
  }
  // 가닥 사이 깊은 그림자 선
  c.strokeStyle='rgba(169,130,58,.55)';c.lineWidth=1.4;
  for(const[x0,y0,cx,cy,x1,y1]of[[-6,-8,-22,6,-32,28],[3,-8,0,14,-4,36],[10,-8,20,8,25,30],[16,-6,34,2,40,22]]){
    c.beginPath();c.moveTo(x0,y0);c.quadraticCurveTo(cx,cy,x1,y1);c.stroke();
  }
  // 림라이트 밴드 (지그재그 톱니)
  c.fillStyle='rgba(255,243,201,.55)';
  path(c,[-34,-4,[-14,-13,18,-13,38,-2],[28,-5,24,2,17,-4],[10,-10,5,-2,-2,-7],[-9,-12,-13,-3,-20,-7],[-26,-9,-30,-6,-34,-4]]);
  c.closePath();c.fill();
  // 아호게 (장난기)
  lockShape(c,4,-14,14,-32,0,-40,6);c.fillStyle=PAL.hair;c.fill();
  c.lineWidth=1;c.strokeStyle=PAL.hairLine;c.stroke();
});

function bakeCape(name,w0,w1,h,last){
  makePart(name,-w1/2-8,-12,w1/2+8,h+10,4,c=>{
    path(c,[-w0/2,-10,[-w1/2-4,h*.4,-w1/2,h*.75,-w1/2+2,h],
      last?[-w1/4,h+8,-w1/8,h-4,0,h+6]:[-w1/4,h+2,0,h+3,0,h+3],
      last?[w1/8,h-2,w1/4,h+9,w1/2-2,h-2]:[w1/4,h+3,w1/2-2,h,w1/2-2,h],
      [w1/2,h*.7,w1/2+2,h*.35,w0/2,-10]]);
    c.closePath();
    const g=c.createLinearGradient(-w1/2,0,w1/2,h);
    g.addColorStop(0,PAL.capeD);g.addColorStop(.55,PAL.cape);g.addColorStop(1,PAL.capeL);
    c.fillStyle=g;c.fill();
    c.lineWidth=2;c.strokeStyle='#4a1420';c.stroke();
    // 주름 음영
    c.strokeStyle='rgba(74,20,32,.5)';c.lineWidth=2;
    for(const fx of[-.28,.02,.3]){
      c.beginPath();c.moveTo(w0*fx,4);c.quadraticCurveTo(w1*fx*1.1,h*.5,w1*fx,h-6);c.stroke();
    }
    if(last){ // 금 헴 + 사자 자수 힌트
      c.strokeStyle=PAL.gold;c.lineWidth=2.4;
      c.beginPath();c.moveTo(-w1/2+4,h-2);
      c.quadraticCurveTo(-w1/4,h+7,0,h+3);c.quadraticCurveTo(w1/4,h+8,w1/2-4,h-4);c.stroke();
    }
  });
}

// 계산 순서: 부모 먼저 오도록 위상 정렬
const ORDER=[];{
  const done=new Set();
  function visit(n){if(done.has(n.name))return;if(n.parent)visit(n.parent);done.add(n.name);ORDER.push(n);}
  RIG.forEach(visit);
}
const ZSORT=RIG.filter(n=>n.part).slice().sort((a,b)=>a.z-b.z);

const EXPL={
  hairFront:[-430,-330],hairSideL:[-270,-330],hairSideR:[-140,-330],head:[0,-330],hairBack:[160,-330],eyeL:[300,-350],
  eyeR:[400,-350],browL:[300,-280],browR:[400,-280],mouth:[350,-210],torso:[-380,-90],pelvis:[-200,-110],

function explScale(p){const w=(p.x1-p.x0),h=(p.y1-p.y0);return Math.min(1,150/Math.max(w,h));}

// 월드 변환 계산 (base + 애니 델타 + IK 오프셋)
function computeWorld(over,px,py,ps){
  for(const n of ORDER){
    const o=over[n.name]||{};
    n.lr=n.baseRot+(o.r||0); n.lx=n.x+(o.x||0); n.ly=n.y+(o.y||0); n.ls=(n.baseS||1)*(o.s||1);
    const p=n.parent;
    if(!p){n.wx=px+n.lx*ps;n.wy=py+n.ly*ps;n.wr=n.lr;n.ws=ps*n.ls;continue;}
    const cs=Math.cos(p.wr),sn=Math.sin(p.wr);
    n.wx=p.wx+(n.lx*cs-n.ly*sn)*p.ws;
    n.wy=p.wy+(n.lx*sn+n.ly*cs)*p.ws;
    n.wr=p.wr+n.lr; n.ws=p.ws*n.ls;
  }
}
function nodeWorldPoint(n,lx,ly){ // 노드 로컬 → 월드
  const cs=Math.cos(n.wr),sn=Math.sin(n.wr);
  return [n.wx+(lx*cs-ly*sn)*n.ws, n.wy+(lx*sn+ly*cs)*n.ws];
}

// 캐릭터 렌더 (실시간/몽타주 공용)
function renderCharacter(ctx,opts){
  const {px,py,ps}=opts, over=opts.over||{}, face=opts.face||{eL:'open',eR:'open',mo:'smile'};
  const g=opts.explode||0, fx=opts.fx||{};
  computeWorld(over,px,py,ps);
  const eg=sstep(g);
  for(const n of ZSORT){
    let pname=n.part;
    if(n.kind){const st=n.name==='eyeL'?face.eL:(n.name==='eyeR'?face.eR:face.mo);
      pname=n.kind[g>0.5?(n.name==='mouth'?'smile':'open'):st]||n.part;}
    const p=PARTS[pname];if(!p)continue;
    let wx=n.wx,wy=n.wy,wr=n.wr,ws=n.ws;
    if(eg>0){
      const s=EXPL[n.name]||[0,0];
      wx=lerp(wx,px+s[0]*ps,eg); wy=lerp(wy,py+s[1]*ps,eg);
      wr=lerp(wr,0,eg); ws=lerp(ws,ps*explScale(p)*1.1,eg);
    }
    ctx.save();
    ctx.translate(wx,wy);ctx.rotate(wr);ctx.scale(ws/p.bs,ws/p.bs);
    ctx.drawImage(p.cv,p.ox,p.oy);
    ctx.restore();
    if(eg>0.45){ // 분해도 이름표
      ctx.save();ctx.globalAlpha=clamp((eg-0.45)/0.55,0,1);
      const s=EXPL[n.name]||[0,0];
      const lx=px+s[0]*ps, ly=py+(s[1]+((p.y1-p.y0)*explScale(p)*0.62))*ps+14;
      ctx.fillStyle='rgba(212,175,90,.92)';
      ctx.font='11px "Segoe UI","Malgun Gothic",sans-serif';ctx.textAlign='center';
      ctx.fillText(n.label,lx,ly+8);
      ctx.strokeStyle='rgba(212,175,90,.3)';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(lx,ly-4);ctx.lineTo(lx,ly+((p.y0-p.y1)*explScale(p)*0.3)*ps);ctx.stroke();
      ctx.restore();
    }
  }
  if(fx.trail)drawTrailMontage(ctx,fx.trail);
  if(fx.sparkle)drawSparkles(ctx,fx.sparkle,opts.time||0);
  if(opts.bones&&eg<0.5)drawBones(ctx);
}

// 뼈대 오버레이: 금색 피벗 + 계층 라인 + 파트 외곽
function drawBones(ctx){
  ctx.save();
  for(const n of RIG){
    if(!n.part)continue;
    const p=PARTS[n.part.replace?n.part:'head']||PARTS[n.part];
    if(p){ // 파트 외곽 희미하게
      const c=[[p.x0,p.y0],[p.x1,p.y0],[p.x1,p.y1],[p.x0,p.y1]].map(q=>nodeWorldPoint(n,q[0],q[1]));
      ctx.beginPath();ctx.moveTo(c[0][0],c[0][1]);
      for(let i=1;i<5;i++)ctx.lineTo(c[i%4][0],c[i%4][1]);
      ctx.strokeStyle='rgba(212,175,90,.18)';ctx.lineWidth=1;ctx.stroke();
    }
  }
  for(const n of RIG){
    if(n.parent){
      ctx.beginPath();ctx.moveTo(n.parent.wx,n.parent.wy);ctx.lineTo(n.wx,n.wy);
      ctx.strokeStyle='rgba(255,220,130,.75)';ctx.lineWidth=2;ctx.stroke();
    }
  }
  for(const n of RIG){
    ctx.beginPath();ctx.arc(n.wx,n.wy,n.parent?4:6,0,TAU);
    ctx.fillStyle=n.parent?'#ffdd66':'#ff9d3a';ctx.fill();
    ctx.strokeStyle='#7a5a10';ctx.lineWidth=1.4;ctx.stroke();
  }
  ctx.restore();
}

// 트랙: 노드별 {r|x|y: [[t,값],...]}, 키 사이 큐빅(smoothstep) 이징.
function sampT(k,t){
  if(t<=k[0][0])return k[0][1];
  const L=k.length-1;
  if(t>=k[L][0])return k[L][1];
  for(let i=0;i<L;i++){
    if(t<=k[i+1][0]){
      const u=(t-k[i][0])/(k[i+1][0]-k[i][0]);
      return lerp(k[i][1],k[i+1][1],sstep(u));
    }
  }
  return k[L][1];
}

// pose(anim, t) — 순수함수. 실시간/몽타주 공용.
function pose(name,t){
  const A=ANIMS[name],d=A.dur;
  const tt=A.loop?((t%d)+d)%d:clamp(t,0,d);
  const over={};
  for(const nd in A.tracks){
    const tr=A.tracks[nd],o={};
    if(tr.r)o.r=sampT(tr.r,tt);
    if(tr.x)o.x=sampT(tr.x,tt);
    if(tr.y)o.y=sampT(tr.y,tt);
    over[nd]=o;
  }
  return {over,face:A.face?A.face(tt):{eL:'open',eR:'open',mo:'smile'},fx:A.fx?A.fx(tt):{}};
}
function mixOver(a,b,k){ // 크로스페이드 (a→b, k=0..1)
  const out={},keys=new Set([...Object.keys(a),...Object.keys(b)]);
  for(const n of keys){
    const oa=a[n]||{},ob=b[n]||{};
    out[n]={r:lerp(oa.r||0,ob.r||0,k),x:lerp(oa.x||0,ob.x||0,k),y:lerp(oa.y||0,ob.y||0,k)};
  }
  return out;
}

function drawTrailMontage(ctx,k){ // 찌르기 스미어: 검 잔상 + 스피드라인
  const rp=RIGM.rapier,ws=rp.ws,p=PARTS.rapier;
  for(let i=1;i<=3;i++){
    ctx.save();ctx.globalAlpha=k*(.3-i*.08);
    ctx.translate(rp.wx-i*34*k*ws,rp.wy);ctx.rotate(rp.wr);ctx.scale(ws/p.bs,ws/p.bs);
    ctx.drawImage(p.cv,p.ox,p.oy);ctx.restore();
  }
  const[tx,ty]=nodeWorldPoint(rp,0,-224);
  ctx.save();ctx.globalAlpha=k*.7;ctx.strokeStyle='#ffe9b0';ctx.lineCap='round';
  for(let i=0;i<4;i++){
    ctx.lineWidth=(2.5-i*.4)*ws;
    ctx.beginPath();ctx.moveTo(tx-(60+i*50)*ws*k,ty+(i-1.5)*26*ws);
    ctx.lineTo(tx-(190+i*60)*ws*k,ty+(i-1.5)*28*ws);ctx.stroke();
  }
  ctx.restore();
}
function drawSparkles(ctx,k,time){ // 승리: 검끝 금빛 반짝이

  ctx.save();
  for(let i=0;i<8;i++){
    const a=i*2.4+time*1.6,r=(14+(i*37%52))*ws;
    const x=tx+Math.cos(a)*r,y=ty+Math.sin(a)*r*.8;
    const s=(2.5+(i*13%9))*ws*k*(0.6+0.4*Math.sin(time*3+i*2));
    if(s<=0)continue;
    ctx.fillStyle=i%3?'rgba(255,236,170,.9)':'rgba(255,255,255,.95)';
    ctx.beginPath(); // 4각 별
    ctx.moveTo(x,y-s*2);ctx.quadraticCurveTo(x+s*.35,y-s*.35,x+s*2,y);
    ctx.quadraticCurveTo(x+s*.35,y+s*.35,x,y+s*2);
    ctx.quadraticCurveTo(x-s*.35,y+s*.35,x-s*2,y);
    ctx.quadraticCurveTo(x-s*.35,y-s*.35,x,y-s*2);
    ctx.fill();
  }
  ctx.restore();
}
function drawFloorShadow(ctx,px,py,ps,lift){
  ctx.save();ctx.globalAlpha=clamp(1-Math.abs(lift||0)/220,.25,1)*.5;
  const fy=py+346*ps;
  const g=ctx.createRadialGradient(px,fy,0,px,fy,150*ps);
  g.addColorStop(0,'rgba(0,0,0,.55)');g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;
  ctx.beginPath();ctx.ellipse(px,fy,150*ps,26*ps,0,0,TAU);ctx.fill();
  ctx.restore();
}
// 궁전 배경 (정적 부분은 리사이즈 때 1회 베이크)
let bgCv=null;
function bakeBG(w,h){
  bgCv=document.createElement('canvas');bgCv.width=w;bgCv.height=h;
  const c=bgCv.getContext('2d');
  const g=c.createLinearGradient(0,0,0,h);
  g.addColorStop(0,'#120c08');g.addColorStop(.55,'#241811');g.addColorStop(.85,'#32220f');g.addColorStop(1,'#1c1410');
  c.fillStyle=g;c.fillRect(0,0,w,h);
  // 궁전 아치 실루엣
  c.fillStyle='rgba(58,40,22,.5)';
  const aw=w/4.2;
  for(let i=0;i<5;i++){
    const ax=w*.5+(i-2)*aw,top=h*.16+Math.abs(i-2)*h*.03,bw=aw*.36;
    c.beginPath();c.moveTo(ax-bw,h*.86);c.lineTo(ax-bw,top+bw);
    c.arc(ax,top+bw,bw,Math.PI,0);c.lineTo(ax+bw,h*.86);
    c.lineWidth=aw*.11;c.strokeStyle='rgba(74,52,26,.55)';c.stroke();
  }
  // 뒤 광원 (금빛)
  const rg=c.createRadialGradient(w*.5,h*.42,0,w*.5,h*.42,Math.max(w,h)*.5);
  rg.addColorStop(0,'rgba(212,175,90,.20)');rg.addColorStop(.5,'rgba(212,175,90,.06)');rg.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle=rg;c.fillRect(0,0,w,h);
  // 바닥
  c.fillStyle='rgba(90,64,30,.28)';c.fillRect(0,h*.84,w,h*.16);
  c.strokeStyle='rgba(212,175,90,.25)';c.lineWidth=2;
  c.beginPath();c.moveTo(0,h*.84);c.lineTo(w,h*.84);c.stroke();
}
const BOKEH=[];for(let i=0;i<36;i++)BOKEH.push({x:Math.random(),y:Math.random(),r:2+Math.random()*7,s:.008+Math.random()*.02,p:Math.random()*TAU});
function drawBokeh(ctx,w,h,time){
  ctx.save();
  for(const b of BOKEH){
    const y=((b.y-time*b.s)%1+1)%1;
    const a=.12+.14*Math.sin(time*1.5+b.p);
    ctx.fillStyle='rgba(255,222,140,'+a.toFixed(3)+')';
    ctx.beginPath();ctx.arc(b.x*w,y*h,b.r,0,TAU);ctx.fill();
  }
  ctx.restore();
}

// ==== 6. IK / 드래그 인터랙션 ==============================================
// 2본 IK: 어깨(무릎)→목표. bend = 관절 굽는 방향.
function solveIK(sx,sy,tx,ty,L1,L2,parentRot,ps,bend){
  let dx=(tx-sx)/ps,dy=(ty-sy)/ps;
  let d=clamp(Math.hypot(dx,dy),Math.abs(L1-L2)+2,L1+L2-2);
  const base=Math.atan2(-dx,dy);
  const a1=Math.acos(clamp((L1*L1+d*d-L2*L2)/(2*L1*d),-1,1));
  const a2=Math.acos(clamp((L1*L1+L2*L2-d*d)/(2*L1*L2),-1,1));
  return [base+bend*a1-parentRot, -bend*(Math.PI-a2)];
}
const HANDLES=[
  {key:'handR',node:'handR',lx:0,ly:20,chain:['upArmR','foreArmR'],L:[UAL,FAL],bend:1},
  {key:'tip',node:'rapier',lx:0,ly:-224,chain:['upArmR','foreArmR'],L:[UAL,FAL],bend:1},
  {key:'handL',node:'handL',lx:0,ly:20,chain:['upArmL','foreArmL'],L:[UAL,FAL],bend:1},
  {key:'footR',node:'bootR',lx:12,ly:12,chain:['thighR','shinR'],L:[THL,SHL],bend:-1},
  {key:'footL',node:'bootL',lx:12,ly:12,chain:['thighL','shinL'],L:[THL,SHL],bend:-1},
  {key:'head',node:'head',lx:2,ly:-54,chain:null}
];
const ikState={}; // key → {w, vw, tx, ty, active}
let dragging=null,mouseX=0,mouseY=0;
function applyIK(over,ps){
  for(const h of HANDLES){
    const st=ikState[h.key];if(!st)continue;
    // 스프링 가중치
    if(st.active){st.w=Math.min(1,st.w+0.18);}
    else{const k=90,c=7;st.vw+=(-k*st.w-c*st.vw)*0.016;st.w+=st.vw*0.016;
      if(Math.abs(st.w)<.008&&Math.abs(st.vw)<.02){delete ikState[h.key];continue;}}
    const w=st.w;
    if(h.chain){
      computeWorld(over,st.px,st.py,ps); // 현재 포즈 기준 어깨 위치
      const sh=RIGM[h.chain[0]];
      let tx=st.tx,ty=st.ty;
      if(h.key==='tip'){ // 검끝→손목 타깃 변환
        const[wtx,wty]=nodeWorldPoint(RIGM.rapier,0,-224);
        const hn=RIGM.handR;
        tx=st.tx-(wtx-hn.wx);ty=st.ty-(wty-hn.wy);
      }
      const pr=sh.parent?sh.parent.wr:0;
      const[r1,r2]=solveIK(sh.wx,sh.wy,tx,ty,h.L[0],h.L[1],pr,ps,h.bend);
      const o1=over[h.chain[0]]||(over[h.chain[0]]={});
      const o2=over[h.chain[1]]||(over[h.chain[1]]={});
      o1.r=lerp(o1.r||0,r1-RIGM[h.chain[0]].baseRot,w);
      o2.r=lerp(o2.r||0,r2-RIGM[h.chain[1]].baseRot,w);
    }else{ // 머리 갸웃
      computeWorld(over,st.px,st.py,ps);
      const hd=RIGM.head;
      const ang=clamp(Math.atan2(st.tx-hd.wx,-(st.ty-hd.wy))*.45,-.55,.55);
      const o=over.head||(over.head={});
      o.r=lerp(o.r||0,ang,w);
    }
  }
}

// ==== 7. UI / 메인 루프 =====================================================
const cv=document.getElementById('cv');
const IS_MONTAGE=location.search.indexOf('montage')>=0;
if(!IS_MONTAGE)startLive();else montage();

function startLive(){
  const ctx=cv.getContext('2d');
  let W=0,H=0,dpr=1;
  function resize(){
    dpr=Math.min(window.devicePixelRatio||1,2);
    W=innerWidth;H=innerHeight;
    cv.width=W*dpr;cv.height=H*dpr;
    cv.style.width=W+'px';cv.style.height=H+'px';
    bakeBG(W,H);
  }
  addEventListener('resize',resize);resize();
  const st={cur:'idle',prev:null,t:0,tp:0,fade:1,speed:1,bones:false,explode:0,explodeOn:false,
    blinkAt:1.8,blinkT:-1,dbl:false};
  window.__setAnim=function(name){
    if(st.cur===name&&!ANIMS[name].loop){st.t=0;return;}
    st.prev=st.cur;st.tp=st.t;st.cur=name;st.t=0;st.fade=0;
    document.querySelectorAll('#ui button[data-anim]').forEach(b=>b.classList.toggle('on',b.dataset.anim===name));
  };
  document.querySelectorAll('#ui button[data-anim]').forEach(b=>b.onclick=()=>__setAnim(b.dataset.anim));
  const bB=document.getElementById('btnBones'),bE=document.getElementById('btnExplode');
  bB.onclick=()=>{st.bones=!st.bones;bB.classList.toggle('on',st.bones);};
  bE.onclick=()=>{st.explodeOn=!st.explodeOn;bE.classList.toggle('on',st.explodeOn);};
  document.getElementById('spd').oninput=e=>st.speed=+e.target.value;
  // 드래그
  function toXY(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left),(e.clientY-r.top)];}
  cv.addEventListener('pointerdown',e=>{
    const[mx,my]=toXY(e);mouseX=mx;mouseY=my;
    let best=null,bd=42;
    for(const h of HANDLES){
      const n=RIGM[h.node];const[hx,hy]=nodeWorldPoint(n,h.lx,h.ly);
      const d=Math.hypot(mx-hx,my-hy);
      if(d<bd){bd=d;best=h;}
    }
    if(best){dragging=best.key;cv.classList.add('grabbing');cv.setPointerCapture(e.pointerId);}
  });
  cv.addEventListener('pointermove',e=>{const[mx,my]=toXY(e);mouseX=mx;mouseY=my;});
  addEventListener('pointerup',()=>{
    if(dragging&&ikState[dragging]){ikState[dragging].active=false;ikState[dragging].vw=0;}
    dragging=null;cv.classList.remove('grabbing');
  });
  const trail=[];
  let last=performance.now(),time=0;
  function frame(now){
    requestAnimationFrame(frame);
    let dt=Math.min((now-last)/1000,.05);last=now;
    dt*=st.speed;time+=dt;
    st.t+=dt;st.tp+=dt;st.fade=Math.min(1,st.fade+dt/0.25);
    const A=ANIMS[st.cur];
    if(!A.loop&&st.t>A.dur+.1)__setAnim('idle');
    st.explode+=((st.explodeOn?1:0)-st.explode)*Math.min(1,dt*5);
    // 포즈 + 크로스페이드
    const po=pose(st.cur,st.t);
    let over=po.over,face=po.face,fx=po.fx;
    if(st.fade<1&&st.prev){over=mixOver(pose(st.prev,st.tp).over,over,sstep(st.fade));}
    // 깜빡임 (윙크/감은 상태가 아닐 때)
    st.blinkAt-=dt;
    if(st.blinkAt<=0){st.blinkT=0;st.dbl=Math.random()<.25;st.blinkAt=2+Math.random()*3;}
    if(st.blinkT>=0){
      st.blinkT+=dt;
      const bt=st.blinkT;
      const on=(bt<.09)||(st.dbl&&bt>.16&&bt<.25);
      if(on){if(face.eL==='open')face={...face,eL:'closed'};if(face.eR==='open')face=Object.assign({},face,{eR:'closed'});}
      if(bt>(st.dbl?.3:.14))st.blinkT=-1;
    }
    // 배치
    const ps=Math.min(H*.66/700,W*.5/700);
    const px=W*.5,py=H*.82-346*ps;
    // IK
    if(dragging){
      const stk=ikState[dragging]||(ikState[dragging]={w:0,vw:0});
      stk.active=true;stk.tx=mouseX;stk.ty=mouseY;stk.px=px;stk.py=py;
    }
    for(const k in ikState){ikState[k].px=px;ikState[k].py=py;}
    applyIK(over,ps);
    // 렌더
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.drawImage(bgCv,0,0);
    drawBokeh(ctx,W,H,time);
    const rootY=(over.root&&over.root.y)||0;
    drawFloorShadow(ctx,px+((over.root&&over.root.x)||0)*ps,py,ps,rootY);
    renderCharacter(ctx,{px,py,ps,over,face,bones:st.bones,explode:st.explode,fx:{},time});
    // 검끝 궤적 (실시간)
    const[tx,ty]=nodeWorldPoint(RIGM.rapier,0,-224);
    trail.push({x:tx,y:ty,t:time});
    while(trail.length&&time-trail[0].t>.22)trail.shift();
    if(trail.length>2){
      let fast=false;
      for(let i=1;i<trail.length;i++)if(Math.hypot(trail[i].x-trail[i-1].x,trail[i].y-trail[i-1].y)>26)fast=true;
      if(fast){
        ctx.save();ctx.lineCap='round';
        for(let i=1;i<trail.length;i++){
          const a=(i/trail.length)*.5;
          ctx.strokeStyle='rgba(255,236,170,'+a.toFixed(3)+')';
          ctx.lineWidth=1+i*.7;
          ctx.beginPath();ctx.moveTo(trail[i-1].x,trail[i-1].y);ctx.lineTo(trail[i].x,trail[i].y);ctx.stroke();
        }
        ctx.restore();
      }
    }
    if(fx.sparkle)drawSparkles(ctx,fx.sparkle,time);
    if(fx.trail)drawTrailMontage(ctx,fx.trail);
    // 드래그 핸들 힌트
    if(!dragging&&st.explode<.05){
      ctx.save();ctx.globalAlpha=.5;
      for(const h of HANDLES){
        const n=RIGM[h.node];const[hx,hy]=nodeWorldPoint(n,h.lx,h.ly);
        ctx.beginPath();ctx.arc(hx,hy,5,0,TAU);
        ctx.strokeStyle='#ffdd66';ctx.lineWidth=1.5;ctx.stroke();
      }
      ctx.restore();
    }
  }
  requestAnimationFrame(frame);
}

// ==== 8. 몽타주 (?montage) — 로드 즉시 동기 렌더 ============================
function montage(){
  ['ui','hint','title','badge'].forEach(id=>{const el=document.getElementById(id);if(el)el.style.display='none';});
  const MW=1680,MH=1500;
  cv.width=MW;cv.height=MH;cv.style.width=MW+'px';cv.style.height=MH+'px';
  const ctx=cv.getContext('2d');
  ctx.fillStyle='#14100c';ctx.fillRect(0,0,MW,MH);
  function cell(x,y,w,h,label,fn){
    ctx.save();
    ctx.fillStyle='#1d1712';ctx.fillRect(x,y,w,h);
    ctx.strokeStyle='rgba(212,175,90,.22)';ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,w,h);
    ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
    fn(x,y,w,h);
    ctx.restore();
    ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(x,y+h-24,w,24);
    ctx.fillStyle='#fff';ctx.font='13px "Segoe UI","Malgun Gothic",sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(label,x+w/2,y+h-12);
  }
  function charCell(x,y,w,h,label,anim,t,opt){
    opt=opt||{};
    cell(x,y,w,h,label,(cx,cy,cw,ch)=>{
      const po=pose(anim,t);
      const ps=opt.ps||Math.min(ch*.82/700,cw*.62/700);
      const px=cx+cw/2-((po.over.root&&po.over.root.x)||0)*ps*.5+(opt.dx||0);
      const py=cy+ch-40-346*ps+(opt.dy||0);
      drawFloorShadow(ctx,px+((po.over.root&&po.over.root.x)||0)*ps,py,ps,(po.over.root&&po.over.root.y)||0);
      renderCharacter(ctx,{px,py,ps,over:po.over,face:po.face,fx:opt.fx===false?{}:po.fx,
        bones:opt.bones,explode:opt.explode||0,time:t});
    });
  }
  const m=8,aw=(MW-m*7)/6,ah=444;
  // Row A: 대기 3위상 + 인사 3키
  const rowA=[['대기 t=0.0s','idle',0],['대기 t=1.3s','idle',1.33],['대기 t=2.7s (윙크)','idle',2.7],
    ['인사 ① 팔 스윕','greet',.42],['인사 ② 보우','greet',.95],['인사 ③ 홀드','greet',1.5]];
  rowA.forEach((r,i)=>charCell(m+i*(aw+m),m,aw,ah,r[0],r[1],r[2]));
  // Row B: 런지 6키
  const rowB=[['런지 ① 준비','lunge',.14],['런지 ② 재기','lunge',.5],['런지 ③ 발사','lunge',.63],
    ['런지 ④ 극점','lunge',.72],['런지 ⑤ 홀드','lunge',1.0],['런지 ⑥ 복귀','lunge',1.9]];
  rowB.forEach((r,i)=>charCell(m+i*(aw+m),m*2+ah,aw,ah,r[0],r[1],r[2]));
  // Row C: 뷰티샷 / 얼굴 클로즈업 / 리깅 오버레이 / 부품 분해도
  const cy0=m*3+ah*2,chh=MH-cy0-m,cwidth=(MW-m*5)/4;
  charCell(m,cy0,cwidth,chh,'① 뷰티샷 (승리)','victory',1.05,{ps:.5});
  cell(m*2+cwidth,cy0,cwidth,chh,'② 얼굴 클로즈업 (두상 460px)',(cx,cy,cw,ch)=>{
    const po=pose('idle',.6),ps=4.6;
    const px=cx+cw/2-10*ps,py=cy+ch/2+278*ps-10;
    renderCharacter(ctx,{px,py,ps,over:po.over,face:po.face,fx:{},time:.6});
  });
  charCell(m*3+cwidth*2,cy0,cwidth,chh,'③ 리깅 오버레이 (뼈/피벗)','idle',0,{bones:true});
  cell(m*4+cwidth*3,cy0,cwidth,chh,'④ 부품 분해도 (컷아웃 파트)',(cx,cy,cw,ch)=>{
    const po=pose('idle',0);
    const ps=Math.min(ch/1000,cw/1050);
    renderCharacter(ctx,{px:cx+cw/2,py:cy+ch/2+40,ps,over:po.over,face:po.face,explode:1,fx:{},time:0});
  });
}
