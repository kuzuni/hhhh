<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>리코 — 홍련의 꼬마 모험가 · 컷아웃 퍼펫 (3/4 뷰)</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#3a2415;
    font-family:"Segoe UI","Malgun Gothic",sans-serif;}
  #cv{display:block;width:100vw;height:100vh;cursor:grab;}
  #cv.grabbing{cursor:grabbing;}
  #err{position:fixed;top:4px;left:4px;color:#ff5252;font:bold 13px "Segoe UI","Malgun Gothic",sans-serif;
    z-index:99;white-space:pre-wrap;max-width:90vw;pointer-events:none;text-shadow:0 1px 2px #000;}
  #back{position:fixed;top:10px;left:12px;z-index:10;color:#ffc46e;text-decoration:none;font-size:13px;opacity:.85;}
  #back:hover{opacity:1;text-decoration:underline;}
  #badge{position:fixed;top:10px;right:14px;z-index:10;color:#fff4e2;background:rgba(255,170,80,.18);
    border:1px solid rgba(255,190,110,.5);border-radius:20px;padding:4px 14px;font-size:12px;letter-spacing:.5px;}
  #title{position:fixed;top:34px;left:0;right:0;text-align:center;pointer-events:none;z-index:5;}
  #title h1{margin:0;color:#ffd9a8;font-size:26px;font-weight:600;letter-spacing:2px;
    text-shadow:0 2px 12px rgba(255,150,60,.4);}
  #title p{margin:2px 0 0;color:#e8b57e;font-size:12px;letter-spacing:1px;}
  #ui{position:fixed;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:7px;
    flex-wrap:wrap;z-index:10;align-items:center;}
  #ui2{position:fixed;bottom:56px;left:0;right:0;display:flex;justify-content:center;gap:6px;
    flex-wrap:wrap;z-index:10;align-items:center;}
  #ui button,#ui2 button{background:rgba(90,50,26,.62);color:#fff2df;border:1px solid rgba(255,190,110,.55);
    border-radius:10px;padding:7px 14px;font-family:inherit;font-size:13px;cursor:pointer;
    transition:background .15s;}
  #ui button:hover,#ui2 button:hover{background:rgba(255,170,80,.35);}
  #ui button.on,#ui2 button.on{background:#ffb45e;color:#3a2010;font-weight:700;}
  #ui2 button.sl{border-color:rgba(150,220,255,.55);}
  #ui2 button.sl.on{background:#79d0ff;color:#0c2438;}
  #ui button.av{border-color:rgba(140,200,255,.6);}
  #ui button.av.on{background:#6ec1ff;color:#10263a;}
  #ui .sep,#ui2 .sep{width:1px;height:22px;background:rgba(255,190,110,.4);margin:0 4px;}
  #ui label{color:#e8b57e;font-size:12px;display:flex;align-items:center;gap:6px;}
  #ui input[type=range]{width:100px;accent-color:#ffb45e;}
  #ui2 .lbl{color:#e8b57e;font-size:12px;margin-right:2px;}
  #hint{position:fixed;bottom:96px;left:0;right:0;text-align:center;color:rgba(232,181,126,.8);
    font-size:12px;pointer-events:none;z-index:5;letter-spacing:.5px;}
  body.montage #ui,body.montage #ui2,body.montage #hint,body.montage #title,
  body.montage #badge,body.montage #back{display:none;}
</style>
</head>
<body>
<div id="err"></div>
<a id="back" href="heroes.html">← 용사 전시관</a>
<div id="badge">컷아웃 리깅 · 퍼펫 · 3/4 반측면 · 아바타 2벌</div>
<div id="title"><h1>리코</h1><p>홍련의 꼬마 모험가 · 같은 리그, 두 벌의 의상</p></div>
<canvas id="cv"></canvas>
<div id="hint">손 · 무기 · 트윈테일 · 머리를 드래그해 보세요 — 놓으면 탱글탱글 복귀</div>
<div id="ui2">
  <span class="lbl">베기</span>
  <button class="sl" data-anim="slashH">가로</button>
  <button class="sl" data-anim="slashDown">내려</button>
  <button class="sl" data-anim="slashUp">올려</button>
  <button class="sl" data-anim="slashSpin">회전</button>
  <span class="sep"></span>
  <button data-anim="victory">승리</button>
  <button data-anim="buff">버프</button>
  <button data-anim="death">죽기</button>
  <button data-anim="defeat">패배</button>
</div>
<div id="ui">
  <button data-anim="idle" class="on">대기</button>
  <button data-anim="walk">걷기</button>
  <button data-anim="run">달리기</button>
  <span class="sep"></span>
  <button id="avP" class="av on">해적</button>
  <button id="avM" class="av">마법사</button>
  <span class="sep"></span>
  <button id="btnBones">뼈대 보기</button>
  <button id="btnExplode">부품 분해</button>
  <span class="sep"></span>
  <label>속도 <input id="spd" type="range" min="0.2" max="2" step="0.1" value="1"></label>
</div>
<script>
"use strict";
// ============================================================================
// ==== 섹션 맵 ==============================================================
// ==== 1. 팔레트/유틸  2. 3/4 공통 파트 베이크(두상·눈·머리·테일·팔다리)   ====
// ==== 2P. 해적 스킨  2M. 마법사 스킨  3. 리그(3/4 씬그래프)+분해도        ====
// ==== 4. 애니메이션 11종  5. 렌더/이펙트/배경  6. IK/드래그               ====
// ==== 7. UI/메인루프  8. 몽타주                                          ====
// ---- 3/4 규약: 캐릭터는 화면 +x(오른쪽)를 향한다.                        ----
// ----   캐릭터의 '왼쪽' 팔다리 = 화면 왼쪽 = NEAR(앞, 밝음)               ----
// ----   캐릭터의 '오른쪽' 팔다리 = 화면 오른쪽 = FAR(뒤, 어둡게)          ----
// ----   얼굴 피처는 +x로 쏠리고, 화면 오른쪽 눈이 원근으로 납작해진다.    ----
// ============================================================================
const errBox=document.getElementById('err');
window.onerror=function(m,s,l,c){errBox.textContent+='ERR: '+m+' @'+(s||'').split('/').pop()+':'+l+'\n';};
window.addEventListener('unhandledrejection',e=>{errBox.textContent+='REJ: '+e.reason+'\n';});

// ==== 1. 팔레트 / 유틸 ======================================================
const PAL={
  outline:'#4a2338', outSoft:'#7a4055',
  skin:'#ffe6d2', skinSh:'#f3c3a2', skinLine:'#e8a988', blush:'rgba(255,112,104,.46)',
  hair:'#f05a2a', hairSh:'#c63d14', hairDp:'#98290a', hairHi:'#ff9a58', hairRim:'#ffd0a0',
  eyeD:'#0d4a86', eyeM:'#2b91d8', eyeLt:'#9fe4ff',
  band:'#3866cf', bandD:'#26489e', bandL:'#6a92e6',
  scarf:'#e0343f', scarfD:'#a81d2c', scarfL:'#ff6a63',
  top:'#fbf6ec', topD:'#ded2bc', topSh:'#c9bca4',
  short:'#5c4633', shortD:'#42311f', shortL:'#7a5f45',
  belt:'#7d4c26', buckle:'#f0c34e',
  sock:'#f6efe0', sockD:'#d8cdb6',
  pboot:'#8d5a30', pbootD:'#65401d', pbootL:'#b07c4c',
  steel:'#ced6de', steelL:'#f2f6fa', steelD:'#8b97a6', steelE:'#5f6a78',
  vio:'#8659d6', vioD:'#6238ab', vioL:'#a983ea', vioDeep:'#452486',
  star:'#ffd94e', starD:'#e8a821', pink:'#ff9fc4',
  stockA:'#6a48b8', stockB:'#d8c6f6', mboot:'#452486', mbootL:'#7a52c8',
  bg:'#3a2415'
};
const TAU=Math.PI*2, D=Math.PI/180;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const eOut=t=>1-Math.pow(1-clamp(t,0,1),3);
const eIn=t=>Math.pow(clamp(t,0,1),3);
const eBack=t=>{t=clamp(t,0,1);const s=1.9;return 1+(s+1)*Math.pow(t-1,3)+s*Math.pow(t-1,2);};
function rnd(i,k){const x=Math.sin(i*127.1+(k||0)*311.7+13.37)*43758.5453;return x-Math.floor(x);}
function pulse(t,a,w){const u=(t-a)/w;return u<0||u>1?0:Math.sin(u*Math.PI);}
// 색 유틸 — FAR(뒤쪽) 파츠를 어둡게 굽기 위한 셰이드
function hx(c){c=c.replace('#','');return[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)];}
function shade(c,f){ // f=0 원본, 1 완전 그림자색
  if(c.indexOf('#')!==0)return c;
  const a=hx(c), s=[62,44,84];
  const r=[0,1,2].map(i=>Math.round(lerp(a[i],lerp(a[i]*0.55,s[i],0.45),f)));
  return 'rgb('+r[0]+','+r[1]+','+r[2]+')';
}
function farPal(f){const o={};for(const k in PAL)o[k]=shade(PAL[k],f);return o;}
const FPAL=farPal(0.44);            // FAR 파츠용 팔레트
function path(c,d){c.beginPath();c.moveTo(d[0],d[1]);
  for(let i=2;i<d.length;i++){const s=d[i];
    if(s.length===6)c.bezierCurveTo(s[0],s[1],s[2],s[3],s[4],s[5]);
    else if(s.length===4)c.quadraticCurveTo(s[0],s[1],s[2],s[3]);
    else c.lineTo(s[0],s[1]);}}
function ell(c,x,y,rx,ry,rot){c.beginPath();c.ellipse(x,y,Math.abs(rx),Math.abs(ry),rot||0,0,TAU);}
function star5(c,x,y,r,rot){
  c.beginPath();
  for(let i=0;i<10;i++){const a=(rot||0)-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;
    const px=x+Math.cos(a)*rr,py=y+Math.sin(a)*rr;
    i?c.lineTo(px,py):c.moveTo(px,py);}
  c.closePath();}
function spark4(c,x,y,s){
  c.beginPath();
  c.moveTo(x,y-s*2);c.quadraticCurveTo(x+s*.32,y-s*.32,x+s*2,y);
  c.quadraticCurveTo(x+s*.32,y+s*.32,x,y+s*2);
  c.quadraticCurveTo(x-s*.32,y+s*.32,x-s*2,y);
  c.quadraticCurveTo(x-s*.32,y-s*.32,x,y-s*2);c.closePath();}

// ==== 2. 파트 베이크 ========================================================
// makePart(name, x0,y0,x1,y1, bakeScale, drawFn) — 피벗 = 디자인 (0,0)
const PARTS={};
function makePart(name,x0,y0,x1,y1,bs,fn){
  const w=Math.ceil((x1-x0)*bs)+6,h=Math.ceil((y1-y0)*bs)+6;
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;
  const c=cv.getContext('2d');
  c.translate(-x0*bs+3,-y0*bs+3);c.scale(bs,bs);
  c.lineJoin='round';c.lineCap='round';
  fn(c);
  PARTS[name]={cv,bs,ox:x0*bs-3,oy:y0*bs-3,w,h,x0,y0,x1,y1};
  return PARTS[name];
}
const OLW=4.4;                       // 치비 공용 외곽선 (굵고 균일한 스티커 느낌)
// 컷아웃 관절 처리: 부착부(위쪽 cut 이상)만 스트로크 → 소시지 마디 seam 제거
function strokeBelow(c,cut,mk,lw,col){
  c.save();
  c.beginPath();c.rect(-400,cut,800,900);c.clip();
  mk();c.lineWidth=lw;c.strokeStyle=col;c.stroke();
  c.restore();
}

// ---- 2a. 두상 (3/4) — 피벗=목. 얼굴면이 +x, 뒤통수 볼륨이 -x ----
const FCX=16;                        // 얼굴 중심선 (오른쪽으로 쏠림)
function bakeHead(nm,P){
  makePart(nm,-108,-206,116,12,2.2,c=>{
    // 두상 실루엣: 뒤통수(-x) 크게, 턱은 +x로 이동한 V라인
    path(c,[-104,-86,
      [-108,-156,-64,-200,4,-200],
      [62,-200,97,-158,99,-110],
      [104,-92,108,-74],
      [117,-60,101,-50],
      [96,-46,89,-36],
      [80,-18,60,-6],[46,3,32,3],
      [16,0,-6,-8],
      [-34,-22,-66,-38,-86,-56],
      [-99,-68,-104,-72,-104,-86]]);
    c.closePath();
    c.fillStyle=P.skin;c.fill();
    c.lineWidth=OLW;c.strokeStyle=P.outline;c.stroke();
    c.save();
    path(c,[-104,-86,
      [-108,-156,-64,-200,4,-200],
      [62,-200,97,-158,99,-110],
      [104,-92,108,-74],
      [117,-60,101,-50],
      [96,-46,89,-36],
      [80,-18,60,-6],[46,3,32,3],
      [16,0,-6,-8],
      [-34,-22,-66,-38,-86,-56],
      [-99,-68,-104,-72,-104,-86]]);
    c.closePath();c.clip();
    // 뒤통수 쪽 셀셰이딩 1톤 (광원 = 오른쪽 위)
    c.fillStyle='rgba(222,142,110,.38)';
    ell(c,-92,-92,52,100,-.10);c.fill();       // 뒤통수(-x) 그늘
    c.fillStyle='rgba(226,150,116,.20)';
    ell(c,-56,-84,34,92,-.06);c.fill();
    // 얼굴면(+x) 톱라이트
    c.fillStyle='rgba(255,255,255,.30)';
    ell(c,44,-132,34,20,-.28);c.fill();
    c.fillStyle='rgba(255,255,255,.18)';
    ell(c,-18,-118,20,13,-.35);c.fill();
    // 턱밑 셀셰이드
    c.fillStyle='rgba(232,150,116,.28)';
    ell(c,20,4,44,14,-.1);c.fill();
    c.restore();
    // 블러시: near(왼쪽) 크게 / far(오른쪽) 작고 납작
    c.fillStyle=P.blush;
    ell(c,-20,-40,20,11,.06);c.fill();
    ell(c,76,-46,11,7,-.16);c.fill();
    c.strokeStyle='rgba(238,92,82,.5)';c.lineWidth=1.7;
    for(let i=-1;i<=1;i++){c.beginPath();c.moveTo(-18+i*7-3,-46);c.lineTo(-18+i*7+3,-35);c.stroke();}
    for(let i=0;i<=1;i++){c.beginPath();c.moveTo(74+i*6-2,-51);c.lineTo(74+i*6+2,-42);c.stroke();}
    // 코: 아주 작은 점 (얼굴 중심선 +x)
    c.fillStyle='rgba(212,118,90,.9)';ell(c,96,-53,3.4,2.4,-.3);c.fill();
    // 콧대→턱 라인(반측면 입체 힌트)
    c.strokeStyle='rgba(228,150,118,.42)';c.lineWidth=2.4;
    c.beginPath();c.moveTo(96,-96);c.quadraticCurveTo(104,-72,88,-48);c.stroke();
    // 림라이트 (얼굴면 +x 가장자리)
    c.save();
    path(c,[-104,-86,
      [-108,-156,-64,-200,4,-200],
      [62,-200,97,-158,99,-110],
      [104,-92,108,-74],
      [117,-60,101,-50],
      [96,-46,89,-36],
      [80,-18,60,-6],[46,3,32,3],
      [16,0,-6,-8],
      [-34,-22,-66,-38,-86,-56],
      [-99,-68,-104,-72,-104,-86]]);
    c.closePath();c.clip();
    c.strokeStyle='rgba(255,238,206,.85)';c.lineWidth=7;c.lineCap='round';
    c.beginPath();c.moveTo(28,-198);
    c.bezierCurveTo(70,-196,97,-156,100,-108);
    c.bezierCurveTo(103,-88,106,-70,100,-54);
    c.stroke();
    c.restore();
    // 목선 힌트
    c.strokeStyle='rgba(230,150,115,.4)';c.lineWidth=2.6;
    c.beginPath();c.moveTo(-2,-6);c.quadraticCurveTo(20,4,46,-6);c.stroke();
  });
}
bakeHead('head',PAL);bakeHead('head_f',FPAL);

// ---- 2b. 엘프 귀 (near: 화면 왼쪽·뒤로 뻗음 / far: 화면 오른쪽·짧게) ----
makePart('earN',-52,-24,10,22,3,c=>{   // 피벗 = 머리 부착점, 왼쪽 뒤로 뾰족
  path(c,[2,-16,[-24,-22,-44,-11,-47,-5],[-36,10,-2,17,2,16]]);
  c.closePath();
  c.fillStyle=PAL.skin;c.fill();
  c.lineWidth=OLW*.82;c.strokeStyle=PAL.outline;c.stroke();
  path(c,[-8,-7,[-24,-10,-34,-4,-35,-3]]);
  c.strokeStyle='rgba(235,130,110,.62)';c.lineWidth=2.4;c.stroke();
});
makePart('earF',-8,-18,38,18,3,c=>{    // far: 짧고 살짝 작게 (원근)
  path(c,[-1,-12,[16,-16,30,-8,32,-3],[24,8,0,13,-1,12]]);
  c.closePath();
  c.fillStyle=FPAL.skin;c.fill();
  c.lineWidth=OLW*.75;c.strokeStyle=FPAL.outline;c.stroke();
  path(c,[7,-5,[16,-7,23,-3,24,-2]]);
  c.strokeStyle='rgba(190,105,90,.6)';c.lineWidth=2;c.stroke();
});

// ---- 2c. 눈 (near = 정면형, far = 가로 압축) × 상태 5종 ----
function eyeBody(c,st,dir,sqz){
  // dir: 속눈썹 플릭 방향(+1 = 화면 오른쪽), sqz: 가로 압축 (far=0.74)
  c.save();c.scale(sqz,1);
  if(st==='closed'){
    c.strokeStyle=PAL.outline;c.lineWidth=6.4/sqz*sqz;
    c.beginPath();c.moveTo(-24,0);c.quadraticCurveTo(0,13,24,0);c.stroke();
    c.beginPath();c.moveTo(dir*24,0);c.quadraticCurveTo(dir*31,-2,dir*33,-8);c.lineWidth=5;c.stroke();
    c.restore();return;
  }
  if(st==='happy'){
    c.strokeStyle=PAL.outline;c.lineWidth=6.8;
    c.beginPath();c.moveTo(-23,11);c.quadraticCurveTo(0,-17,23,11);c.stroke();
    c.beginPath();c.moveTo(dir*23,11);c.quadraticCurveTo(dir*30,8,dir*32,2);c.lineWidth=5;c.stroke();
    c.restore();return;
  }
  if(st==='x'){ // 죽음 ✕
    c.strokeStyle=PAL.outline;c.lineWidth=7.2;c.lineCap='round';
    c.beginPath();c.moveTo(-19,-19);c.lineTo(19,19);c.moveTo(19,-19);c.lineTo(-19,19);c.stroke();
    c.restore();return;
  }
  if(st==='sad'){ // 패배 — 아래로 처진 눈
    ell(c,0,4,25,26,0);c.fillStyle='#fff';c.fill();
    c.save();c.clip();
    const g0=c.createLinearGradient(0,-22,0,30);
    g0.addColorStop(0,PAL.eyeD);g0.addColorStop(.5,PAL.eyeM);g0.addColorStop(1,PAL.eyeLt);
    ell(c,0,8,22,24,0);c.fillStyle=g0;c.fill();
    ell(c,0,10,9,11,0);c.fillStyle='#08243f';c.fill();
    ell(c,-8,-2,7,7,0);c.fillStyle='rgba(255,255,255,.95)';c.fill();
    c.fillStyle='rgba(6,32,58,.34)';c.fillRect(-28,-24,56,10);
    c.restore();
    c.strokeStyle=PAL.outline;c.lineWidth=6.4;
    c.beginPath();c.moveTo(-25,-8);c.quadraticCurveTo(-20,-20,0,-20);
    c.quadraticCurveTo(20,-20,25,-4);c.stroke();
    c.restore();return;
  }
  const half=st==='half';
  const lidY=half?-8:-31;
  // 흰자
  path(c,[-27,-5,[-27,lidY-5,27,lidY-5,27,-5],[27,33,-27,33,-27,-5]]);
  c.closePath();c.fillStyle='#fff';c.fill();
  c.save();c.clip();
  const g=c.createLinearGradient(0,-30,0,32);
  g.addColorStop(0,PAL.eyeD);g.addColorStop(.52,PAL.eyeM);g.addColorStop(1,PAL.eyeLt);
  ell(c,0,2,24,30,0);c.fillStyle=g;c.fill();
  c.lineWidth=2.6;c.strokeStyle='#07304f';c.stroke();
  ell(c,0,5,10.5,13.5,0);c.fillStyle='#07223a';c.fill();          // 동공
  ell(c,0,23,15,8,0);c.fillStyle='rgba(200,246,255,.62)';c.fill(); // 아래 반사
  c.fillStyle='rgba(6,38,70,.34)';c.fillRect(-30,lidY-5,60,8);     // 눈꺼풀 그림자

  for(let i=1;i<keys.length;i++)if(t<=keys[i][0]){

  }

function applySnap(s){

function blendSnap(a,b,w){
  const loc=new Float32Array(a.loc.length);
  for(let i=0;i<loc.length;i++)loc[i]=lerp(a.loc[i],b.loc[i],w);
  const r={x:lerp(a.r.x,b.r.x,w),y:lerp(a.r.y,b.r.y,w),rot:lerp(a.r.rot,b.r.rot,w),
    sx:lerp(a.r.sx,b.r.sx,w),sy:lerp(a.r.sy,b.r.sy,w),fx:w<.5?a.r.fx:b.r.fx};
  return{r,loc,zf:w<.5?a.zf:b.zf,face:w<.5?a.face:b.face};
}

function drawSlashArc(c,S,t){
  if(!S||S.p<=0||S.al<=0)return;
  c.save();c.translate(S.cx,S.cy);c.globalCompositeOperation='lighter';c.globalAlpha=.88;
  const sweep=S.a1-S.a0, dir=sweep>=0?1:-1;
  const head=S.a0+sweep*(S.ring?S.p:sstep(S.p));
  const win=Math.min(Math.abs(sweep),S.ring?2.2:1.95);
  const tl=head-dir*win;
  const NP=26,rr=S.rr;
  const grd=c.createRadialGradient(0,0,rr*.42,0,0,rr*1.06);
  grd.addColorStop(0,'rgba(90,180,255,0)');
  grd.addColorStop(.72,'rgba(150,220,255,'+(.86*S.al)+')');
  grd.addColorStop(1,'rgba(240,252,255,'+(.36*S.al)+')');
  c.beginPath();
  for(let k=0;k<=NP;k++){const a=lerp(tl,head,k/NP);
    c[k?'lineTo':'moveTo'](Math.cos(a)*rr,Math.sin(a)*rr);}
  for(let k=NP;k>=0;k--){const a=lerp(tl,head,k/NP);
    const wgt=Math.sin(k/NP*Math.PI)*.36;
    c.lineTo(Math.cos(a)*rr*(1-wgt),Math.sin(a)*rr*(1-wgt));}
  c.closePath();c.fillStyle=grd;c.fill();
  c.lineWidth=5;c.strokeStyle='rgba(255,255,255,'+(.88*S.al)+')';
  c.beginPath();
  for(let k=0;k<=NP;k++){const a=lerp(tl,head,k/NP);
    c[k?'lineTo':'moveTo'](Math.cos(a)*rr*.985,Math.sin(a)*rr*.985);}
  c.stroke();
  c.lineWidth=2.6;
  for(let k=0;k<5;k++){
    const a=head-dir*(.10+k*.16), alk=S.al*(.7-k*.11)*(.45+.55*S.imp);
    if(alk<=0)continue;
    c.strokeStyle='rgba(190,235,255,'+alk+')';
    c.beginPath();c.moveTo(Math.cos(a)*rr*1.06,Math.sin(a)*rr*1.06);
    c.lineTo(Math.cos(a)*rr*(1.22+k*.03),Math.sin(a)*rr*(1.22+k*.03));c.stroke();
  }
  if(S.imp>0){
    const hx2=Math.cos(head)*rr,hy2=Math.sin(head)*rr;
    c.globalAlpha=S.imp;
    spark4(c,hx2,hy2,11+S.imp*9);c.fillStyle='#eafaff';c.fill();
    c.lineWidth=3.4;c.strokeStyle='rgba(160,225,255,.9)';
    c.beginPath();c.arc(hx2,hy2,20+(1-S.imp)*30,0,TAU);c.stroke();
    c.globalAlpha=1;
  }
  c.restore();
}

function drawFxBack(c,fx,t){   // 캐릭터 뒤에 깔리는 이펙트 (오라·지면 링)
  if(!(fx.aura>0||fx.burst>0))return;

      c.globalAlpha=Math.sin(u*Math.PI)*.85;
      c.lineWidth=6-k*1.4;c.strokeStyle=k?'rgba(255,210,110,.9)':'rgba(255,255,255,.95)';
      c.beginPath();c.ellipse(0,GY0-30,60+(1-u)*180,18+(1-u)*54,0,0,TAU);c.stroke();
    }

    bg.addColorStop(0,'rgba(255,240,170,.9)');bg.addColorStop(1,'rgba(255,180,60,0)');

    c.fillStyle=ag;c.beginPath();c.arc(4,-10,190,0,TAU);c.fill();

    for(let k=0;k<7;k++){
      const u=((t*.9+k*.143)%1);

      c.beginPath();c.moveTo(fx2-6,yy);
      c.quadraticCurveTo(fx2-2,yy-hh*.6,fx2+Math.sin(t*7+k)*5,yy-hh);
      c.quadraticCurveTo(fx2+4,yy-hh*.5,fx2+6,yy);c.closePath();c.fill();
    }
  }
  c.restore();
}
function drawFx(c,fx,t,skin){

      c.beginPath();c.moveTo(x0,y0);c.lineTo(x0-38-u*24,y0+4);c.stroke();

    for(let k=0;k<8;k++){

// -- 씬 합성 (실시간/몽타주 공용)
function drawScene(c,w,h,o){
  const t=o.time||0;
  drawGuild(c,w,h,t);
  const z=o.zoom||Math.min(w/760,h/700);
  const gy=o.gy!==undefined?o.gy:h*.84;
  applySnap(o.snap);
  const r=o.snap.r;
  c.save();
  c.translate(w*(o.cx||.5),gy);c.scale(z,z);c.translate(0,-GY0);
  computeRig(r.x,r.y,r.rot,r.sx,r.sy);
  if(o.drag)o.drag();
  const air=clamp(-r.y/60,0,1);
  c.fillStyle='rgba(30,12,4,'+(.34-air*.14)+')';
  ell(c,r.x+10,GY0,92*(1-air*.25)*Math.abs(r.sx),16*(1-air*.25),0);c.fill();
  const fx=r.fx||{};
  drawFxBack(c,fx,t);
  if(fx.fade>0)c.globalAlpha=1-fx.fade;
  drawRig(c,o.skin);
  c.globalAlpha=1;
  drawSlashArc(c,fx.slash,t);
  if(fx.slash&&fx.slash.ground)drawGroundHit(c,fx.slash.ground,t);
  drawFx(c,fx,t,o.skin);
  if(o.swapFx>0)drawSwapFx(c,o.swapFx);
  if(o.bones)drawBones(c);
  c.restore();
}

// ==== 6. IK / 드래그 ========================================================
const VIEW={cx:0,cy:0,z:1,gy:0};
const rotOf=m=>Math.atan2(m[1],m[0]);
const sclOf=m=>Math.hypot(m[0],m[1]);
const DRAG={grab:null,px:0,py:0};
const SPR={};
let curSnap=null;
function scenePos(mx,my){return{x:(mx-VIEW.cx)/VIEW.z, y:(my-VIEW.gy)/VIEW.z+GY0};}
function nodePos(n){return{x:n.m[4],y:n.m[5]};}
function solveArm(side,tx,ty){
  const up=N['armU_'+side], lo=N['armL_'+side];
  const sm=up.parent.m;
  const sx=sm[0]*up.x+sm[2]*up.y+sm[4], sy=sm[1]*up.x+sm[3]*up.y+sm[5];
  const sc=sclOf(sm), f=side==='F'?.9:1;
  const L1=48*f*sc,L2=42*f*sc;
  let dx=tx-sx, dy=ty-sy;
  let d=Math.hypot(dx,dy);d=clamp(d,Math.abs(L1-L2)+4,L1+L2-2);
  const at=Math.atan2(dy,dx);
  const a1=Math.acos(clamp((L1*L1+d*d-L2*L2)/(2*L1*d),-1,1));
  const cosB=clamp((L1*L1+L2*L2-d*d)/(2*L1*L2),-1,1);
  const bend=side==='F'?-1:1;
  const thU=at+a1*bend;
  const thL=thU+(Math.PI-Math.acos(cosB))*-bend;
  const pr=rotOf(sm);
  up.rot=thU-Math.PI/2-pr;
  lo.rot=thL-thU;
}
function applyDragIK(){
  const acts=[];
  if(DRAG.grab)acts.push({g:DRAG.grab,x:DRAG.px,y:DRAG.py,w:1});
  for(const k in SPR){const s=SPR[k];if(s&&s.w>.02)acts.push({g:k,x:s.x,y:s.y,w:s.w});}
  if(!acts.length)return;
  for(const a of acts){
    if(a.g==='armF'||a.g==='armN'){
      const side=a.g==='armF'?'F':'N';
      const up=N['armU_'+side],lo=N['armL_'+side];
      const cu=up.rot,cl=lo.rot;
      solveArm(side,a.x,a.y);
      if(a.w<1){up.rot=lerp(cu,up.rot,a.w);lo.rot=lerp(cl,lo.rot,a.w);}
    }else if(a.g==='head'){
      const hp=nodePos(N.head);
      const ang=clamp(Math.atan2(a.x-hp.x,-(a.y-hp.y))*.7,-.65,.65);
      N.head.rot=lerp(N.head.rot,ang,a.w);
      N.head.px=lerp(N.head.px,clamp((a.x-hp.x)*.1,-12,12),a.w);
    }else if(a.g==='tailN'||a.g==='tailF'){
      const t1=a.g==='tailN'?N.tailN1:N.tailF1;
      const t2=a.g==='tailN'?N.tailN2:N.tailF2;
      const tp=nodePos(t1);
      const ang=Math.atan2(a.x-tp.x,(a.y-tp.y));
      t1.rot=lerp(t1.rot,clamp(-ang*.85,-1.5,1.5),a.w);
      t2.rot=lerp(t2.rot,clamp(-ang*.65,-1.1,1.1),a.w);
    }
  }
  computeRig(curSnap.r.x,curSnap.r.y,curSnap.r.rot,curSnap.r.sx,curSnap.r.sy);
}
function grabAt(mx,my){
  const p=scenePos(mx,my);
  const wm=N.weapon.m;
  const cands=[
    ['armF',nodePos(N.handF),58],
    ['armF',{x:wm[2]*(-250)+wm[4],y:wm[3]*(-250)+wm[5]},96],
    ['armN',nodePos(N.handN),58],
    ['tailN',nodePos(N.tailN2),58],['tailF',nodePos(N.tailF2),52],
    ['head',nodePos(N.head),96]];
  for(const[g,pos,rad]of cands)
    if(Math.hypot(p.x-pos.x,p.y-pos.y)<rad)return g;
  return null;
}

// ==== 7. UI / 메인 루프 =====================================================
const IS_MONTAGE=/[?&]montage/.test(location.search);
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const state={anim:'idle',t:.3,skin:'pirate',speed:1,bones:false,explode:false,
  swapFx:0,prev:null,prevT:0,fadeW:0};
if(!IS_MONTAGE){
  let W=0,H=0,DPR=1;
  function resize(){
    DPR=Math.min(devicePixelRatio||1,2);
    W=innerWidth;H=innerHeight;
    cv.width=W*DPR;cv.height=H*DPR;
    cv.style.width=W+'px';cv.style.height=H+'px';
  }
  addEventListener('resize',resize);resize();
  const allBtns=document.querySelectorAll('button[data-anim]');
  allBtns.forEach(b=>{
    b.addEventListener('click',()=>{
      const a=b.dataset.anim;
      state.prev=state.anim;state.prevT=state.t;state.fadeW=1;
      state.anim=a;state.t=0;
      allBtns.forEach(x=>x.classList.toggle('on',x===b));
    });
  });
  const avP=document.getElementById('avP'),avM=document.getElementById('avM');
  function setSkin(s){if(state.skin===s)return;
    state.skin=s;state.swapFx=1;
    avP.classList.toggle('on',s==='pirate');avM.classList.toggle('on',s==='mage');}
  avP.onclick=()=>setSkin('pirate');avM.onclick=()=>setSkin('mage');
  const bB=document.getElementById('btnBones'),bE=document.getElementById('btnExplode');
  bB.onclick=()=>{state.bones=!state.bones;bB.classList.toggle('on',state.bones);};
  bE.onclick=()=>{state.explode=!state.explode;bE.classList.toggle('on',state.explode);};
  const spd=document.getElementById('spd');
  cv.addEventListener('pointerdown',e=>{
    const g=grabAt(e.clientX,e.clientY);
    if(g){DRAG.grab=g;cv.classList.add('grabbing');cv.setPointerCapture(e.pointerId);
      const p=scenePos(e.clientX,e.clientY);DRAG.px=p.x;DRAG.py=p.y;delete SPR[g];}
  });
  cv.addEventListener('pointermove',e=>{
    if(!DRAG.grab)return;
    const p=scenePos(e.clientX,e.clientY);DRAG.px=p.x;DRAG.py=p.y;
  });
  function release(){
    if(!DRAG.grab)return;
    SPR[DRAG.grab]={x:DRAG.px,y:DRAG.py,vx:0,vy:0,w:1};
    DRAG.grab=null;cv.classList.remove('grabbing');
  }
  cv.addEventListener('pointerup',release);
  cv.addEventListener('pointercancel',release);
  let last=performance.now();
  function loop(ts){
    requestAnimationFrame(loop);
    let dt=Math.min((ts-last)/1000,.05);last=ts;
    const sp=parseFloat(spd.value);
    const A=ANIMS[state.anim];
    state.t+=dt*sp/A.dur;
    const oneShot=/death|defeat|victory|buff/.test(state.anim);
    if(state.t>1)state.t=oneShot?1:state.t-1;
    if(state.fadeW>0)state.fadeW=Math.max(0,state.fadeW-dt/.22);
    if(state.swapFx>0)state.swapFx=Math.max(0,state.swapFx-dt/.55);
    for(const k in SPR){const s=SPR[k];if(!s)continue;
      let rest;
      if(k==='armF')rest=nodePos(N.handF);
      else if(k==='armN')rest=nodePos(N.handN);
      else if(k==='head')rest=nodePos(N.head);
      else rest=nodePos(k==='tailN'?N.tailN2:N.tailF2);
      const kk=170,dd=7.5;
      s.vx+=((rest.x-s.x)*kk-s.vx*dd)*dt;s.vy+=((rest.y-s.y)*kk-s.vy*dd)*dt;
      s.x+=s.vx*dt;s.y+=s.vy*dt;
      s.w-=dt/1.15;
      if(s.w<=.02&&Math.hypot(rest.x-s.x,rest.y-s.y)<6)delete SPR[k];
      else if(s.w<.02)s.w=.02;
    }
    ctx.setTransform(DPR,0,0,DPR,0,0);
    const tNow=ts/1000;
    if(state.explode){renderExplode(ctx,W,H);return;}
    let snap=evalPose(state.anim,state.t);
    if(state.fadeW>0&&state.prev){
      snap=blendSnap(snap,evalPose(state.prev,state.prevT),state.fadeW);
    }
    curSnap=snap;
    const z=Math.min(W/780,H/720)*1.00;
    VIEW.z=z;VIEW.cx=W*.56;VIEW.gy=H*.82;
    drawScene(ctx,W,H,{snap,skin:state.skin,time:tNow,zoom:z,gy:H*.82,cx:.56,
      bones:state.bones,swapFx:state.swapFx,drag:applyDragIK});
  }
  requestAnimationFrame(loop);
}

    g.save();g.translate(x,y);
    g.strokeStyle='rgba(255,220,170,.14)';g.lineWidth=1;g.strokeRect(.5,.5,w-1,h-1);
    g.save();g.beginPath();g.rect(1,1,w-2,h-2);g.clip();fn(w,h);g.restore();
    g.fillStyle='rgba(12,7,3,.78)';g.fillRect(1,h-25,w-2,24);
    g.fillStyle='#fff';g.font='13px '+FONT;g.textAlign='center';g.textBaseline='middle';
    g.fillText(label,w/2,h-13);
    g.restore();
  }
  function mcell(w,h,o){
    const snap=evalPose(o.anim,o.t);
    drawScene(g,w,h,{snap,skin:o.skin,time:o.time!==undefined?o.time:o.t*1.6,
      zoom:o.zoom,gy:o.gy!==undefined?o.gy:h*.80,cx:o.cx!==undefined?o.cx:.58,bones:o.bones});
  }
  const pad=8,cw=(MW-pad*7)/6,hA=436;
  // Row A: 대기/걷기/달리기 — 앞3 해적 / 뒤3 마법사 (같은 리그)
  const rowA=[
    {lb:'대기 · 해적 (3/4 · 우측 지향)',o:{anim:'idle',t:.30,skin:'pirate',zoom:.40}},
    {lb:'걷기 · 해적 (컨택트)',o:{anim:'walk',t:.06,skin:'pirate',zoom:.40}},
    {lb:'달리기 · 해적 (패싱·전방 기울임)',o:{anim:'run',t:.30,skin:'pirate',zoom:.40}},
    {lb:'대기 · 마법사',o:{anim:'idle',t:.55,skin:'mage',zoom:.44}},
    {lb:'걷기 · 마법사',o:{anim:'walk',t:.56,skin:'mage',zoom:.44}},
    {lb:'달리기 · 마법사',o:{anim:'run',t:.80,skin:'mage',zoom:.44}},
  ];
  rowA.forEach((c2,i)=>cell(pad+(cw+pad)*i,pad,cw,hA,c2.lb,(w,h)=>{
    c2.o.gy=h*.84;mcell(w,h,c2.o);}));
  // Row B: 베기 4종 임팩트 + 승리 + 버프
  const yB=pad+hA+pad,hB=436;
  const rowB=[
    {lb:'① 가로 베기 · 임팩트',o:{anim:'slashH',t:.385,skin:'pirate',zoom:.44}},
    {lb:'② 내려 베기 · 지면 임팩트',o:{anim:'slashDown',t:.405,skin:'pirate',zoom:.44}},
    {lb:'③ 올려 베기 · 부양',o:{anim:'slashUp',t:.40,skin:'pirate',zoom:.42}},
    {lb:'④ 회전 베기 · 스핀 슬래시',o:{anim:'slashSpin',t:.32,skin:'pirate',zoom:.42}},
    {lb:'승리 — 대검 번쩍 + 방방',o:{anim:'victory',t:.32,skin:'pirate',zoom:.40}},
    {lb:'버프 — 기 모으기 폭발 오라',o:{anim:'buff',t:.62,skin:'mage',zoom:.42}},
  ];
  rowB.forEach((c2,i)=>cell(pad+(cw+pad)*i,yB,cw,hB,c2.lb,(w,h)=>{
    c2.o.gy=h*.84;mcell(w,h,c2.o);}));
  // Row C
  const yC=yB+hB+pad,hC=MH-yC-pad-20,cwC=(MW-pad*5)/4;
  cell(pad,yC,cwC,hC,'① 뷰티샷 · 해적 (레퍼런스 포즈)',(w,h)=>
    mcell(w,h,{anim:'idle',t:.30,skin:'pirate',zoom:h/860,gy:h*.90,cx:.60,time:.8}));
  cell(pad*2+cwC,yC,cwC,hC,'② 죽기(위) / 패배(아래)',(w,h)=>{
    g.save();g.beginPath();g.rect(0,0,w,h/2);g.clip();
    mcell(w,h/2,{anim:'death',t:.88,skin:'pirate',zoom:(h/2)/700,gy:h*.40,cx:.44,time:2.2});
    g.restore();
    g.save();g.beginPath();g.rect(0,h/2,w,h/2);g.clip();g.translate(0,h/2);
    mcell(w,h/2,{anim:'defeat',t:.90,skin:'pirate',zoom:(h/2)/620,gy:(h/2)*.90,cx:.55,time:2.6});
    g.restore();
    g.strokeStyle='rgba(255,220,170,.2)';g.lineWidth=1;
    g.beginPath();g.moveTo(0,h/2+.5);g.lineTo(w,h/2+.5);g.stroke();
  });
  cell(pad*3+cwC*2,yC,cwC,hC,'③ 얼굴 클로즈업 (3/4 · 머리 450px+)',(w,h)=>{
    resetPose();
    const rr={x:0,y:0,rot:0,sx:1,sy:1,fx:{}};
    ANIMS.idle.fn(.30,rr);
    N.armU_F.rot=.95;N.armL_F.rot=-2.05;aimBlade(-1.95);   // 검을 뒤로 눕혀 얼굴 비움
    const loc=new Float32Array(NODES.length*5);
    NODES.forEach((n,i)=>{loc[i*5]=n.rot;loc[i*5+1]=n.px;loc[i*5+2]=n.py;loc[i*5+3]=n.sx;loc[i*5+4]=n.sy;});
    const snap={r:rr,loc,zf:false,face:{eye:'',mouth:'m_smile',blushX:0,browY:0}};
    drawScene(g,w,h,{snap,skin:'pirate',time:.8,zoom:1.62,gy:h*.62+1.62*312,cx:.44});
  });
  cell(pad*4+cwC*3,yC,cwC,hC,'④ 부품 분해 — 3/4 아틀라스',(w,h)=>renderExplode(g,w,h));
  g.fillStyle='rgba(255,235,205,.5)';g.font='12px '+FONT;g.textAlign='left';g.textBaseline='alphabetic';
  g.fillText('chibi-puppet.html — 리코 · 컷아웃 퍼펫 · 3/4 반측면(우향) · 애니 11종 · 아바타 2벌(리그 공유)',14,MH-6);
}
</script>
